[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# ADR-0001 ES-09: overflow is a bug, and a crash recovers from the journal rather than unwinding.
[profile.release]
overflow-checks = true
panic = "abort"
