[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

# Versions of every shared dependency live here; each is registered in docs/dependencies.md.
[workspace.dependencies]
mandate-accounting = { path = "crates/mandate-accounting", version = "0.0.0" }
mandate-alpaca = { path = "crates/mandate-alpaca", version = "0.0.0" }
mandate-api = { path = "crates/mandate-api", version = "0.0.0" }
mandate-approval = { path = "crates/mandate-approval", version = "0.0.0" }
mandate-audit = { path = "crates/mandate-audit", version = "0.0.0" }
mandate-artifacts-fs = { path = "crates/mandate-artifacts-fs", version = "0.0.0" }
mandate-authn = { path = "crates/mandate-authn", version = "0.0.0" }
mandate-backtest = { path = "crates/mandate-backtest", version = "0.0.0" }
mandate-builder = { path = "crates/mandate-builder", version = "0.0.0" }
mandate-canon = { path = "crates/mandate-canon", version = "0.0.0" }
mandate-domain = { path = "crates/mandate-domain", version = "0.0.0" }
mandate-executor = { path = "crates/mandate-executor", version = "0.0.0" }
mandate-identity = { path = "crates/mandate-identity", version = "0.0.0" }
mandate-identity-seal = { path = "crates/mandate-identity-seal", version = "0.0.0" }
mandate-identity-system = { path = "crates/mandate-identity-system", version = "0.0.0" }
mandate-identity-testkit = { path = "crates/mandate-identity-testkit", version = "0.0.0" }
mandate-journal = { path = "crates/mandate-journal", version = "0.0.0" }
mandate-journal-cold = { path = "crates/mandate-journal-cold", version = "0.0.0" }
mandate-journal-pg = { path = "crates/mandate-journal-pg", version = "0.0.0" }
mandate-liquidity = { path = "crates/mandate-liquidity", version = "0.0.0" }
mandate-marketdata = { path = "crates/mandate-marketdata", version = "0.0.0" }
mandate-mcp = { path = "crates/mandate-mcp", version = "0.0.0" }
mandate-connections = { path = "crates/mandate-connections", version = "0.0.0" }
mandate-vault-local = { path = "crates/mandate-vault-local", version = "0.0.0" }
mandate-modelhost = { path = "crates/mandate-modelhost", version = "0.0.0" }
mandate-notify = { path = "crates/mandate-notify", version = "0.0.0" }
mandate-num = { path = "crates/mandate-num", version = "0.0.0" }
mandate-passkey = { path = "crates/mandate-passkey", version = "0.0.0" }
mandate-push-relay = { path = "crates/mandate-push-relay", version = "0.0.0" }
mandate-risk = { path = "crates/mandate-risk", version = "0.0.0" }
mandate-runtime = { path = "crates/mandate-runtime", version = "0.0.0" }
mandate-rh-sim = { path = "crates/mandate-rh-sim", version = "0.0.0" }
mandate-robinhood = { path = "crates/mandate-robinhood", version = "0.0.0" }
mandate-research = { path = "crates/mandate-research", version = "0.0.0" }
mandate-sim = { path = "crates/mandate-sim", version = "0.0.0" }
mandate-shell = { path = "crates/mandate-shell", version = "0.0.0" }
mandate-spec = { path = "crates/mandate-spec", version = "0.0.0" }
mandate-tenant = { path = "crates/mandate-tenant", version = "0.0.0" }
mandate-time = { path = "crates/mandate-time", version = "0.0.0" }
mandate-webpush = { path = "crates/mandate-webpush", version = "0.0.0" }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.104"
arrow-array = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
getrandom = { version = "0.2.17", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["std", "tzdb-bundle-always"] }
libtest-mimic = "0.8.2"
p256 = { version = "0.14.0", default-features = false }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
proptest = "1.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
ruint = { version = "1.20.1", default-features = false }
rust_decimal = { version = "1.43.0", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "tls-rustls-ring-native-roots"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.21"
tokio = { version = "~1.53.1", default-features = false }
toml = "1.1.6"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every exception states why, so agents cannot copy a silent one (AGENTS.md, trust ladder).
allow_attributes_without_reason = "deny"

# ADR-0001 ES-09: overflow is a bug, and a crash recovers from the journal rather than unwinding.
[profile.release]
overflow-checks = true
panic = "abort"
