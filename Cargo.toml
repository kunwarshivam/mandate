[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

# Versions of every shared dependency live here; each is registered in docs/dependencies.md.
[workspace.dependencies]
mandate-canon = { path = "crates/mandate-canon", version = "0.0.0" }
mandate-time = { path = "crates/mandate-time", version = "0.0.0" }
proptest = "1.11.0"
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.21"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# ADR-0001 ES-09: overflow is a bug, and a crash recovers from the journal rather than unwinding.
[profile.release]
overflow-checks = true
panic = "abort"
