# Keys only, the admin user only, no root (DEC-2001 item 3). The cloud firewall opens port 22 to
# the other cell node alone; the founder arrives through the ops tunnel, which connects to
# localhost.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers cell1_admin
X11Forwarding no
AllowAgentForwarding no
