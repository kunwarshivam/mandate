# The upstream charts, as OCI artifacts pinned by manifest digest. Each manifest's chart layer is
# the tarball xtask/src/cell.rs pins by SHA-256 for the local cell (DEC-2015 item 3), so the two
# install the same bytes. The repository's own charts are the environment's, in its release.yaml,
# since promotion moves their digests.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
  ref:
    digest: sha256:3245fa051bb21d0dd9246272f57a2760b4234817a164a3167d2a1e7fb9f63fd9
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: plugin-barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
  ref:
    digest: sha256:b48511269e2c75603ee2f06f6c5444e8154542103a3c3b9d692344725bac37b7
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
