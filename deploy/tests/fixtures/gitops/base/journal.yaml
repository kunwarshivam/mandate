# The workspace journal's Postgres (deploy/cell/charts/journal-db): a primary and its synchronous
# standby on separate nodes (E21-41, DEC-1050), archiving WAL and base backups to the
# environment's R2 bucket. The chart's own values.yaml holds the defaults; the overlay patches
# in the environment's archive destination, egress and sizes. The archive's endpoint names the
# founder's Cloudflare account, which no file here holds: the bootstrap writes it from OpenTofu's
# `archive_endpoint` output into the ConfigMap `journal-archive-endpoint` (DEC-2017 item 6), and
# the release waits until it exists. Flux never prunes it: removing it
# from git leaves the journal running rather than uninstalling it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: journal
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  releaseName: journal
  targetNamespace: ws-ws1
  storageNamespace: ws-ws1
  dependsOn:
    - name: barman-cloud
  chartRef:
    kind: OCIRepository
    name: mandate-journal-db
  valuesFrom:
    - kind: ConfigMap
      name: journal-archive-endpoint
      valuesKey: values.yaml
  values:
    instances: 2
    failureDomain: separate
