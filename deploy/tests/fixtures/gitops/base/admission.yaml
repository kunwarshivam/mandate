# Signatures at admission (DEC-2016 items 1 and 2): sigstore's policy-controller, its chart and
# images pinned by digest. It checks only namespaces labelled `policy.sigstore.dev/include`, and the
# workspace's is the one so labelled (namespaces.yaml). An image no policy matches is allowed; the
# overlay checks keep every such image pinned by digest (DEC-2017). The pod webhooks fail closed,
# except for pods labelled `mandate.dev/process: control`, the Job that commits a kill switch
# (AGENTS.md rule 13), which neither webhook sees; kill-switch-admission.yaml lets only the Job
# controller create such a pod, for a Job no service account or CronJob made. The one policy is in
# deploy/gitops/policies/, applied by its own Kustomization once this chart's CRD exists.
apiVersion: v1
kind: Namespace
metadata:
  name: cosign-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: policy-controller
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/sigstore/helm-charts/policy-controller
  ref:
    digest: sha256:9ff3ca6ae4a0155de4dd667f8b760e56e1bd5c8233a0321ad870a654ce022f2f
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-controller
  namespace: flux-system
spec:
  interval: 1h
  releaseName: policy-controller
  targetNamespace: cosign-system
  storageNamespace: cosign-system
  chartRef:
    kind: OCIRepository
    name: policy-controller
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    webhook:
      image:
        repository: ghcr.io/sigstore/policy-controller/policy-controller
        version: sha256:0bcd60beb93f4427c29cf3a669743caf58490e98ded4380c33c09f092734a6ab
      failurePolicy: Fail
      configData:
        no-match-policy: allow
    leasescleanup:
      image:
        repository: cgr.dev/chainguard/kubectl
        version: sha256:63e7072e580dad3a8b9740e76594bb19156f81173f525d6b3765db58eb629704
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: MutatingWebhookConfiguration
              name: policy.sigstore.dev
            patch: |
              - op: add
                path: /webhooks/0/objectSelector
                value:
                  matchExpressions:
                    - key: mandate.dev/process
                      operator: NotIn
                      values: [control]
          - target:
              kind: ValidatingWebhookConfiguration
              name: policy.sigstore.dev
            patch: |
              - op: add
                path: /webhooks/0/objectSelector
                value:
                  matchExpressions:
                    - key: mandate.dev/process
                      operator: NotIn
                      values: [control]
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./deploy/gitops/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: mandate
