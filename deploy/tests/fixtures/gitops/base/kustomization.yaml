# A fixture of a hosted cluster's base (E21-58, DEC-2017 item 3): the set every hosted cluster
# runs, the same set `cargo xtask cell up` installs in the local cell, minus its test archive
# store. deploy/tests/test_gitops.py builds, renders and checks it, and seeds its bugs into it,
# until the real overlays under deploy/gitops/ exist and are checked the same way.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - sources.yaml
  - operator.yaml
  - backup-plugin.yaml
  - journal.yaml
  - workspace.yaml
  - admission.yaml
  - kill-switch-admission.yaml
configMapGenerator:
  - name: workspace-managed-values
    namespace: flux-system
    files:
      - values.yaml=../../../../cell/values/managed.yaml
generatorOptions:
  disableNameSuffixHash: true
