# One workspace deployment (E21-36). Settings only: no secret is ever a value (DEC-822 item 4).
# Credentials arrive as Secrets the journal-db chart or the operator creates, mounted as files.
# values.schema.json refuses any key not named here.

# The workspace this release deploys; one release, in its own namespace, per workspace.
workspace: ws1

# `paper` or `backtest` (DEC-967 item 15). The live Robinhood connection of E21-48 is not in
# this chart.
environment: paper

# MANDATE_DEPLOYMENT_TIER, which the chart sets on every process from this value and nothing else
# (DEC-971 item 2): `dev`, `ci`, `staging` or `production`. Unsigned builds start only in `dev`
# and `ci`; the release keys are not wired yet (DEC-971 item 7), so a signed tier starts nothing.
deploymentTier: production

# Whether `mandate.local/` images, built by `cargo xtask cell up` and imported into a local k3d
# cell, may be named. Only the local cell's values set it; every other cluster takes digests only.
localImages: false

# Container images. A process renders only when its image is named here (processes.json), so an
# empty entry leaves that process out. Each is pinned by digest, or is a `mandate.local/` image
# that `cargo xtask cell up` built from the change itself and imported into the cell.
images:
  # The migration Job's psql, and the drills' network probe: CloudNativePG's PostgreSQL 18 image
  # (D-5).
  postgres: ghcr.io/cloudnative-pg/postgresql:18.6-202609281634-minimal-trixie@sha256:4467d4cf7e502fbc29800b75d755ede477a765b25a506a58a0842a57a4bf42c9
  mandate: ""
  api: ""
  # The local stub token issuer (DEC-2100): a sidecar in the API pod, for a dev or ci cell's
  # sign-in only. A local build alone can be named here, which only the local cell allows.
  stub-issuer: ""
  runtime: ""
  executor: ""
  token-exchange: ""
  scheduler: ""
  model-gateway: ""
  exporter: ""
  data: ""
  # The deployment manager (DEC-1172): the one pod with an API token, which starts the runtimes and
  # executors. Once named, those two render as its pod templates, never as Deployments.
  deploy-manager: ""
  # The role provisioner (DEC-2350): makes each OAuth connect's Kubernetes-auth roles with its own
  # AppRole, the Secret `vault-approle-provisioner` the vault's provisioning makes. It needs
  # `api.workspace`, whose control stream it reads, like the deployment manager.
  role-provisioner: ""

# The Alpaca OAuth app the founder registers for paper (DEC-2636): its client id and this
# deployment's redirect URI, both public. Each is rendered, when set, into the API and the token
# exchange only, which both send it. The client secret is never a value: staging's apply imports
# it into the vault, where only the token exchange reads it.
alpacaOAuth:
  # MANDATE_ALPACA_CLIENT_ID; empty until the app is registered.
  clientId: ""
  # MANDATE_ALPACA_REDIRECT_URI: https on this deployment's API host, or loopback http in a cell,
  # with the callback's path.
  redirectUri: ""

# The fixture OAuth provider of a dev or ci cell (DEC-1176): its own `oauth-fixture` pod, the stub
# issuer's image run as the Alpaca provider alone, which only the token exchange reaches, and the
# exchange's token URL pointed at it. It needs images.stub-issuer and both alpacaOAuth values. Any
# tier but dev or ci refuses it, in the schema and in the chart.
oauthFixture:
  enabled: false

# The workspace API server's settings (workspace API spec §3.11 item 2), each required once
# images.api is named. None is a secret: the session signing key is made in the pod's memory at
# each start, since sessions live in that one replica's memory too, and the subject links are a
# ConfigMap the operator makes, mounted at the one fixed path (DEC-1023).
api:
  # The hosted workspace and its organization, as ULIDs (MANDATE_API_WORKSPACE, MANDATE_API_ORG).
  org: ""
  workspace: ""
  # The identity provider: issuer, audience, and its published key set (identity spec §6.1).
  issuer: ""
  audience: ""
  jwksUrl: ""
  # The web app's origin, exactly as a browser sends it (§3.3 item 5).
  appOrigin: ""
  # The ConfigMap holding the `subject-links` key; empty mounts none, so every sign-in is refused.
  subjectLinks: ""
  # The addresses of the ingress in front of the API (MANDATE_API_INGRESS_PEERS): from these peers
  # alone, route 2's limits read the client's address from X-Forwarded-For (DEC-2117 item 4). With
  # the tunnel on, cloudflared runs beside the API in its pod and reaches it on loopback.
  ingressPeers: []
  # The API's vault binding (DEC-2338): its AppRole, the Secret `vault-approle-api` the vault's
  # provisioning makes, and the vault's CA, copied owner-only into its vault directory, with egress
  # to the vault on 8200 alone. Off until that Secret exists: staging provisions it, production runs
  # no vault, and the local cell turns it on once `cargo xtask cell up` provisions it.
  vaultBinding: false
  # The connect finish (DEC-2348 item 3): its own Deployment, from the API's image, holding the
  # connection manager's AppRole alone, the Secret `vault-approle-connection-manager`; the API pod
  # never holds it. Off until that Secret exists: staging provisions it, and the local cell turns it
  # on with `vaultBinding`, once `cargo xtask cell up` provisions both.
  connectFinish: false

# The workspace's shared artifact store (mandate documents, backtest reports), mounted at
# /var/lib/mandate/artifacts. Which process may write it is fixed by the chart, never a value.
artifacts:
  size: 1Gi
  # Empty takes the cluster's default class (local-path in the local cell).
  storageClass: ""
  # ReadWriteOnce keeps every mounting pod on one node; ReadWriteMany needs a class that offers it.
  accessMode: ReadWriteOnce

# Where the workspace journal's Postgres is. The journal-db chart's defaults match these.
journal:
  host: journal-rw
  port: 5432
  database: mandate
  # The Secret holding the cluster's CA certificate (`ca.crt`): every connection is verify-full.
  ca: journal-ca
  # The pods to allow on port 5432, by label (CloudNativePG's cluster label).
  podSelector:
    cnpg.io/cluster: journal

# Each process type's credential is the Secret `<rolePrefix><db_role with _ as ->`, with a
# `pgpass` key, created by the journal-db chart.
rolePrefix: journal-role-

# Addresses outside the cluster that an external egress target may reach, as CIDRs of /24 or
# narrower (/32 for the token host). Each is empty until the lane that needs it sets it; an empty
# target allows nothing. Never a live trading host (DEC-821 item 4): `cargo xtask ci cell` refuses
# a rendering whose policies contain one, and the egress drill probes them (OPS-5).
egress:
  broker: []
  token-host: []
  time: []
  model-providers: []
  object-storage: []
  timestamping: []
  market-data: []
  artifact-store: []
  identity-provider: []
  # The cluster's API server, for the deployment manager alone (DEC-1172): a policy cannot select
  # it by pod label (k3s's is not a pod), so it is the addresses its `kubernetes` endpoints list,
  # each a /32 or a narrow CIDR, and the port they listen on: 6443 on k3s, behind the 443 Service.
  kube-api: []
  kubeApiPort: 6443
  # The cluster DNS, which every process with an egress target needs to resolve its names.
  dns:
    namespace: kube-system
    podSelector:
      k8s-app: kube-dns

# One-off runs of the `run` and `verify` processes, rendered only when set. `id` names the Job,
# so each run is a new Job. `process` is the run process it runs, `control` (the CLI) unless it
# names another (DEC-2035).
run:
  id: ""
  args: []
  process: control
verify:
  id: ""
  streams: []

# The workspace's founding grant (DEC-2114): with `enabled`, a post-install and post-upgrade hook
# runs `workspace found --open` for `member`, the founder's principal ULID, on `api.workspace`.
# Never the founder's identity-provider subject: the sign-in link is the `subject-links` ConfigMap.
founding:
  enabled: false
  member: ""

# The agent deployment the runtime process runs (DEC-1013): its agent, the connection it trades
# through, and the owner whose kill switch it acts on. Required once `images.runtime` is named;
# ids only, never a secret. `research`, when set, is the path of the recorded research bundle in the
# runtime image, which every runtime pod the deployment manager starts is handed as `--research`;
# the confirmed envelope still decides whether an agent researches (DEC-2246 item 4). Empty, the
# runtime runs deny-all.
runtime:
  agent: ""
  connection: ""
  owner: ""
  research: ""

# The broker every executor runs over (DEC-2306 item 1): `fixture`, the in-process fixture paper
# broker, or `alpaca-paper`, Alpaca's paper trading host under the vault lease on its connection,
# which staging alone may name. `vaultAddress` is the cell's vault, which `alpaca-paper` needs: the
# executor trusts the CA mounted at /run/mandate/vault and logs in with the ServiceAccount token at
# /run/mandate/vault-token, both of which the vault wiring mounts.
executor:
  broker: fixture
  vaultAddress: ""

# The cell's one ingress: cloudflared dialing out to Cloudflare's tunnel edge, so the cluster
# exposes no port (DEC-967 item 6). Off in the local cell, which has no tunnel.
ingress:
  cloudflared:
    enabled: false
    # cloudflared, pinned by digest (D-5).
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # The Secret holding the tunnel token as its `token` key, made by the operator, never a value.
    tokenFrom: cloudflared-tunnel
    # The tunnel edge's CIDRs (region1 and region2.v2.argotunnel.com), reached on port 7844.
    edge: []
