{{- /*
The workspace's shared artifact store (mandate documents, backtest reports), which the API server
and the control runs write and the runtime, the deployment manager and the model gateway read (see
"mandate.artifactsAccess"). One claim, so a document survives a pod's restart and an upgrade; it
goes with the release on uninstall, since a kept claim loses Helm's ownership and a reinstall would
refuse it. It renders only with a long-running process that writes it, the API server ("mandate.artifactsClaimed"). ReadWriteOnce, as the local cell's local-path class offers:
every pod that mounts it then runs on the claim's one node, by the required affinity of
"mandate.colocated" (DEC-2273). A hosted cell names a class that can
(or moves the store to the object store of E21-40) in `artifacts.storageClass`.
*/ -}}
{{- define "mandate.artifactsClaim" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifacts
  labels:
    mandate.dev/workspace: {{ .Values.workspace | quote }}
spec:
  accessModes: [{{ .Values.artifacts.accessMode | quote }}]
  {{- with .Values.artifacts.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.artifacts.size | quote }}
{{- end -}}
{{- if include "mandate.artifactsClaimed" . }}
---
{{ include "mandate.emit" (include "mandate.artifactsClaim" .) }}
{{- end }}
{{- /*
The research store (DEC-2279 item 5): research artifacts only, which the model gateway alone writes
and the runtime reads back ("mandate.researchArtifactsAccess"). It renders with the gateway. Its
size is `researchArtifacts.size`, which the chart's tests hold at no less than twice the gateway's
fixed cap (DEC-2279 item 4). ReadWriteOnce by default, and its pods join the shared store's
colocation ("mandate.colocated").
*/ -}}
{{- define "mandate.researchArtifactsClaim" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: research-artifacts
  labels:
    mandate.dev/workspace: {{ .Values.workspace | quote }}
spec:
  accessModes: [{{ .Values.researchArtifacts.accessMode | quote }}]
  {{- with .Values.researchArtifacts.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.researchArtifacts.size | quote }}
{{- end -}}
{{- if include "mandate.researchArtifactsClaimed" . }}
---
{{ include "mandate.emit" (include "mandate.researchArtifactsClaim" .) }}
{{- end }}
