{{- /* One Deployment per long-running process whose image is built (§3.1, §3.2); the API server's
is its own template, api.yaml, the deployment manager's deploy-manager.yaml, the role
provisioner's role-provisioner.yaml, and the connect finish's connect-finish.yaml. The
dispatcher mounts its configuration file, the ConfigMap dispatcher.yaml renders, read-only at
/etc/mandate/dispatcher (DEC-2516). A process the manager starts (the runtime and the executor, `started_by`) has no Deployment once the manager
renders: only the manager starts it, from its pod template (DEC-1170). Without the manager the
executor is a Deployment on `default`, the fixture broker's alone: a paper executor, which reaches
the vault for its connection's lease, needs the manager, and the render fails without it
(DEC-2365). */ -}}
{{- define "mandate.service" -}}
{{- $ctx := . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .p.name | quote }}
  labels:
    {{- include "mandate.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mandate.selector" . | nindent 6 }}
  template:
    {{- $launch := dict "root" .root "p" .p "name" .p.name }}
    {{- with .p.args }}
    {{- $_ := set $launch "args" (include "mandate.fill" (dict "root" $ctx.root "words" . "probe" "") | fromJsonArray) }}
    {{- end }}
    {{- if eq .p.name "executor" }}
    {{- if eq .root.Values.executor.broker "alpaca-paper" }}
    {{- fail "executor.broker=alpaca-paper needs images.deploy-manager: a paper executor runs only as the pod the manager starts as its connection's own account, never as this Deployment's default (DEC-2365)" }}
    {{- end }}
    {{- $_ := set $launch "args" (concat ($launch.args | default list) (include "mandate.executorBroker" .root | fromJsonArray)) }}
    {{- end }}
    {{- $volumes := "" }}
    {{- if eq .p.name "dispatcher" }}
    {{- $_ := set $launch "mounts" "- {name: dispatcher-config, mountPath: /etc/mandate/dispatcher, readOnly: true}" }}
    {{- $volumes = "- {name: dispatcher-config, configMap: {name: dispatcher-config, defaultMode: 292, items: [{key: config.json, path: config.json}]}}" }}
    {{- end }}
    {{- with .p.probe }}
    {{- $probe := dict "livez" (include "mandate.fill" (dict "root" $ctx.root "words" . "probe" "livez") | fromJsonArray) "readyz" (include "mandate.fill" (dict "root" $ctx.root "words" . "probe" "readyz") | fromJsonArray) }}
    {{- $_ := set $launch "probe" $probe }}
    {{- end }}
    {{- $container := include "mandate.container" $launch }}
    {{- include "mandate.pod" (dict "root" .root "p" .p "restartPolicy" "Always" "containers" $container "volumes" $volumes) | nindent 4 }}
{{- end -}}
{{- $root := . }}
{{- range (include "mandate.rendered" (dict "root" . "kind" "service") | fromJsonArray) }}
{{- if and (not (has .name (list "api" "deploy-manager" "role-provisioner" "connect-finish"))) (not (include "mandate.startedElsewhere" (dict "root" $root "p" .))) }}
---
{{ include "mandate.emit" (include "mandate.service" (dict "root" $root "p" .)) }}
{{- end }}
{{- end }}
