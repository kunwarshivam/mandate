{{- /* One Deployment per long-running process whose image is built (§3.1, §3.2); the API server's
is its own template, api.yaml, and the deployment manager's deploy-manager.yaml. A process the
manager starts (the runtime and the executor, `started_by`) has no Deployment once the manager
renders: only the manager starts it, from its pod template (DEC-1170). */ -}}
{{- define "mandate.service" -}}
{{- $ctx := . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .p.name | quote }}
  labels:
    {{- include "mandate.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mandate.selector" . | nindent 6 }}
  template:
    {{- $launch := dict "root" .root "p" .p "name" .p.name }}
    {{- with .p.args }}
    {{- $_ := set $launch "args" (include "mandate.fill" (dict "root" $ctx.root "words" . "probe" "") | fromJsonArray) }}
    {{- end }}
    {{- if eq .p.name "executor" }}
    {{- $_ := set $launch "args" (concat ($launch.args | default list) (include "mandate.executorBroker" .root | fromJsonArray)) }}
    {{- end }}
    {{- with .p.probe }}
    {{- $probe := dict "livez" (include "mandate.fill" (dict "root" $ctx.root "words" . "probe" "livez") | fromJsonArray) "readyz" (include "mandate.fill" (dict "root" $ctx.root "words" . "probe" "readyz") | fromJsonArray) }}
    {{- $_ := set $launch "probe" $probe }}
    {{- end }}
    {{- $container := include "mandate.container" $launch }}
    {{- include "mandate.pod" (dict "root" .root "p" .p "restartPolicy" "Always" "containers" $container) | nindent 4 }}
{{- end -}}
{{- $root := . }}
{{- range (include "mandate.rendered" (dict "root" . "kind" "service") | fromJsonArray) }}
{{- if and (not (has .name (list "api" "deploy-manager"))) (not (include "mandate.startedElsewhere" (dict "root" $root "p" .))) }}
---
{{ include "mandate.emit" (include "mandate.service" (dict "root" $root "p" .)) }}
{{- end }}
{{- end }}
