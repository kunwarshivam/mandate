{{- /*
The workspace API server (workspace API spec §3.11, DEC-978): one replica, since sessions live in
its memory until they move to Postgres (item 6).
- Both listeners are on the pod's loopback (item 1), so no other pod and no node reaches it: a
  port-forward reaches it for the local cell's demo, and with the tunnel on, cloudflared runs as a
  second container of this pod and reaches it there (DEC-2056, `ingress.yaml`).
- The session signing key is 32 random bytes an init container writes, owner-only, into a
  memory-backed `CREDENTIALS_DIRECTORY` at each start (item 2). It never exists at rest or outside
  the pod, and a restart loses nothing a restart does not already lose: the sessions themselves.
- The API's image is a bare binary with no CA bundle, and it fetches the identity provider's key
  set over public TLS. The same init container copies the pinned postgres image's public bundle
  into an emptyDir the API container alone mounts read-only and names in `SSL_CERT_FILE`.
- The subject links are the operator's ConfigMap, mounted read-only at the one fixed path
  (DEC-1023); with none named the file is absent and every sign-in is refused.
- In a dev or ci cell only, the local stub token issuer (DEC-2100, DEC-1025) runs as a sidecar on
  the pod's loopback, started and answering before the server starts, since the server fetches
  the stub's key set at its own start and only every five minutes after. Its image can only be a
  local build, and the chart refuses it in any other tier.
*/ -}}
{{- define "mandate.stubIssuer" -}}
{{- $tier := .root.Values.deploymentTier -}}
{{- if not (has $tier (list "dev" "ci")) -}}
{{- fail (printf "images.stub-issuer runs only in a dev or ci cell, and deploymentTier is %q (DEC-2100)" $tier) -}}
{{- end -}}
- name: stub-issuer
  image: {{ index .root.Values.images "stub-issuer" | quote }}
  imagePullPolicy: IfNotPresent
  restartPolicy: Always
  args: ["--bind", "127.0.0.1:8090"]
  env:
    - {name: MANDATE_DEPLOYMENT_TIER, value: {{ $tier | quote }}}
    - {name: HOME, value: /tmp}
  securityContext:
    {{- include "mandate.containerSecurity" . | nindent 4 }}
  resources:
    limits: {cpu: "50m", memory: "32Mi"}
    requests: {cpu: "50m", memory: "32Mi"}
- name: stub-issuer-ready
  image: {{ .root.Values.images.postgres | quote }}
  imagePullPolicy: IfNotPresent
  command:
    - bash
    - -c
    - |
      for _ in $(seq 1 60); do
        if timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/8090" 2>/dev/null; then
          echo "stub issuer answering"
          exit 0
        fi
        sleep 1
      done
      echo "the stub issuer did not answer on 127.0.0.1:8090 within a minute" >&2
      exit 1
  securityContext:
    {{- include "mandate.containerSecurity" . | nindent 4 }}
  resources:
    limits: {cpu: "50m", memory: "32Mi"}
    requests: {cpu: "50m", memory: "32Mi"}
{{- end -}}
{{- define "mandate.apiEnv" -}}
{{- $a := .root.Values.api -}}
{{- $j := .root.Values.journal -}}
- name: MANDATE_API_DATABASE_URL
  value: {{ printf "postgres://%s@%s:%v/%s?sslmode=verify-full&sslrootcert=/run/secrets/journal-ca/ca.crt" .p.db_role $j.host $j.port $j.database | quote }}
- name: MANDATE_API_ORG
  value: {{ required "api.org is required with images.api" $a.org | quote }}
- name: MANDATE_API_WORKSPACE
  value: {{ required "api.workspace is required with images.api" $a.workspace | quote }}
- name: MANDATE_API_ISSUER
  value: {{ required "api.issuer is required with images.api" $a.issuer | quote }}
- name: MANDATE_API_AUDIENCE
  value: {{ required "api.audience is required with images.api" $a.audience | quote }}
- name: MANDATE_API_JWKS_URL
  value: {{ required "api.jwksUrl is required with images.api" $a.jwksUrl | quote }}
- name: MANDATE_API_APP_ORIGIN
  value: {{ required "api.appOrigin is required with images.api" $a.appOrigin | quote }}
{{- with $a.ingressPeers }}
- name: MANDATE_API_INGRESS_PEERS
  value: {{ join "," . | quote }}
{{- end }}
- name: CREDENTIALS_DIRECTORY
  value: /run/credentials
- name: SSL_CERT_FILE
  value: /run/ca-bundle/ca-certificates.crt
{{- if .root.Values.api.vaultBinding }}
- name: MANDATE_API_VAULT_ADDRESS
  value: {{ include "mandate.vaultAddress" .root | quote }}
- name: MANDATE_API_VAULT_DIR
  value: /run/mandate/vault
{{- end }}
{{- end -}}
{{- /*
The API's vault binding (DEC-2338), with `api.vaultBinding`: the AppRole the vault provisioning
makes for it, the Secret `vault-approle-api` (`role-id`, `secret-id`), and the vault's CA, the
ConfigMap `vault-ca`, projected read-only into one source directory, mounted 0440 for the pod's
fsGroup, and copied by an init container into a memory-backed directory as `api.role-id`,
`api.secret-id` and `ca.crt` at 0600 with nothing else in it, since `mandate_vault`'s reader refuses
a file any group or other can read. The API reads them there as files, never from its environment.
*/ -}}
{{- define "mandate.apiVaultCopy" -}}
- name: vault-credentials
  image: {{ .root.Values.images.postgres | quote }}
  imagePullPolicy: IfNotPresent
  command: ["install", "-m", "0600", "/run/secrets/vault-api/api.role-id", "/run/secrets/vault-api/api.secret-id", "/run/secrets/vault-api/ca.crt", "/run/mandate/vault/"]
  securityContext:
    {{- include "mandate.containerSecurity" . | nindent 4 }}
  resources:
    limits: {cpu: "50m", memory: "32Mi"}
    requests: {cpu: "50m", memory: "32Mi"}
  volumeMounts:
    - {name: vault, mountPath: /run/mandate/vault}
    - {name: vault-sources, mountPath: /run/secrets/vault-api, readOnly: true}
{{- end -}}
{{- define "mandate.apiVaultVolumes" -}}
- name: vault
  emptyDir: {medium: Memory, sizeLimit: 1Mi}
- name: vault-sources
  projected:
    defaultMode: 288
    sources:
      - secret:
          name: vault-approle-api
          items:
            - {key: role-id, path: api.role-id}
            - {key: secret-id, path: api.secret-id}
      - configMap:
          name: vault-ca
          items:
            - {key: ca.crt, path: ca.crt}
{{- end -}}
{{- define "mandate.api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .p.name | quote }}
  labels:
    {{- include "mandate.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mandate.selector" . | nindent 6 }}
  template:
    {{- $mounts := "- {name: credentials, mountPath: /run/credentials, readOnly: true}\n- {name: ca-bundle, mountPath: /run/ca-bundle, readOnly: true}" }}
    {{- if .root.Values.api.vaultBinding }}
    {{- $mounts = printf "%s\n- {name: vault, mountPath: /run/mandate/vault, readOnly: true}" $mounts }}
    {{- end }}
    {{- if .root.Values.api.subjectLinks }}
    {{- $mounts = printf "%s\n- {name: subject-links, mountPath: /etc/mandate/subject-links, subPath: subject-links, readOnly: true}" $mounts }}
    {{- end }}
    {{- $container := include "mandate.container" (dict "root" .root "p" .p "name" .p.name "args" (list "--bind" "127.0.0.1:8080" "--probe-bind" "127.0.0.1:8081") "mounts" $mounts) }}
    {{- $container = replace "  env:\n" (printf "  env:\n%s\n" (include "mandate.apiEnv" . | indent 4)) $container }}
    {{- $tunnel := dict "root" .root "p" (include "mandate.cloudflaredProcess" .root | fromJson) }}
    {{- if .root.Values.ingress.cloudflared.enabled }}
    {{- $container = printf "%s\n%s" $container (include "mandate.cloudflaredContainer" $tunnel) }}
    {{- end }}
    {{- $init := printf `- name: session-key
  image: %q
  imagePullPolicy: IfNotPresent
  command: ["bash", "-c", "umask 077 && head -c 32 /dev/urandom > /run/credentials/session-signing-key && cp /etc/ssl/certs/ca-certificates.crt /run/ca-bundle/ca-certificates.crt"]
  securityContext:
%s
  resources:
    limits: {cpu: "50m", memory: "32Mi"}
    requests: {cpu: "50m", memory: "32Mi"}
  volumeMounts:
    - {name: credentials, mountPath: /run/credentials}
    - {name: ca-bundle, mountPath: /run/ca-bundle}` .root.Values.images.postgres (include "mandate.containerSecurity" . | indent 4) }}
    {{- if index .root.Values.images "stub-issuer" }}
    {{- $init = printf "%s\n%s" $init (include "mandate.stubIssuer" .) }}
    {{- end }}
    {{- if .root.Values.api.vaultBinding }}
    {{- $init = printf "%s\n%s" $init (include "mandate.apiVaultCopy" .) }}
    {{- end }}
    {{- $volumes := "- {name: ca-bundle, emptyDir: {sizeLimit: 1Mi}}\n- {name: credentials, emptyDir: {medium: Memory, sizeLimit: 1Mi}}" }}
    {{- if .root.Values.ingress.cloudflared.enabled }}
    {{- $volumes = printf "%s\n%s" $volumes (include "mandate.tunnelVolume" $tunnel) }}
    {{- end }}
    {{- if .root.Values.api.vaultBinding }}
    {{- $volumes = printf "%s\n%s" $volumes (include "mandate.apiVaultVolumes" .) }}
    {{- end }}
    {{- with .root.Values.api.subjectLinks }}
    {{- $volumes = printf "%s\n- {name: subject-links, configMap: {name: %q, defaultMode: 292, items: [{key: subject-links, path: subject-links}]}}" $volumes . }}
    {{- end }}
    {{- include "mandate.pod" (dict "root" .root "p" .p "restartPolicy" "Always" "containers" $container "initContainers" $init "volumes" $volumes) | nindent 4 }}
{{- end -}}
{{- $root := . }}
{{- range (include "mandate.rendered" (dict "root" . "kind" "service") | fromJsonArray) }}
{{- if eq .name "api" }}
---
{{ include "mandate.emit" (include "mandate.api" (dict "root" $root "p" .)) }}
{{- end }}
{{- end }}
