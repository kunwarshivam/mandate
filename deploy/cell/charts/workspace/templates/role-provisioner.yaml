{{- /*
The role provisioner (DEC-2350, DEC-2630 item 7): one replica per workspace, reading the control
stream `ctl:<api.workspace>`, the deployment manager's, and making each OAuth connect's two
Kubernetes-auth roles in the vault, then removing the token exchange's when its request closes or
its connection is revoked. Its roles bind ServiceAccounts in this namespace, which it is told by
`--namespace`, so it needs no service-account token and mounts none: it holds no Kubernetes
credential, and no Role or binding names it. Its one vault credential is its own AppRole, the
Secret `vault-approle-provisioner`, with the vault's CA, as owner-only files in its vault directory
(`mandate.vaultCopy`); its egress is Postgres and the vault on 8200 alone.
*/ -}}
{{- define "mandate.roleProvisioner" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .p.name | quote }}
  labels:
    {{- include "mandate.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mandate.selector" . | nindent 6 }}
  template:
    {{- $args := list "run" "--workspace" (required "api.workspace, the hosted workspace's ULID whose control stream the provisioner reads, is required with images.role-provisioner" .root.Values.api.workspace) "--namespace" .root.Release.Namespace "--probe" "/tmp/process.sock" "--vault-address" (include "mandate.vaultAddress" .root) "--vault-dir" "/run/mandate/vault" }}
    {{- $mounts := "- {name: vault, mountPath: /run/mandate/vault, readOnly: true}" }}
    {{- $probe := dict "livez" (list "/mandate-provisionerd" "probe" "livez" "--probe" "/tmp/process.sock") "readyz" (list "/mandate-provisionerd" "probe" "readyz" "--probe" "/tmp/process.sock") }}
    {{- $container := include "mandate.container" (dict "root" .root "p" .p "name" .p.name "args" $args "mounts" $mounts "probe" $probe) }}
    {{- $init := include "mandate.vaultCopy" (dict "root" .root "role" "provisioner") }}
    {{- $volumes := include "mandate.vaultVolumes" (dict "root" .root "role" "provisioner") }}
    {{- include "mandate.pod" (dict "root" .root "p" .p "restartPolicy" "Always" "containers" $container "initContainers" $init "volumes" $volumes) | nindent 4 }}
{{- end -}}
{{- $root := . }}
{{- range (include "mandate.rendered" (dict "root" . "kind" "service") | fromJsonArray) }}
{{- if eq .name "role-provisioner" }}
---
{{ include "mandate.emit" (include "mandate.roleProvisioner" (dict "root" $root "p" .)) }}
{{- end }}
{{- end }}
