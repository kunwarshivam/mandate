{{- /*
The vault itself (DEC-2019). One OpenBao server, in server mode on integrated storage: never the dev
server, which keeps its storage in memory and that the client refuses outside its own tests (DEC-977
item 6). Its arguments are fixed here and no value adds one. The listener speaks TLS 1.3 only. It
unseals by hand (DEC-977 item 5), except in staging, which may unseal itself from a mounted key
(DEC-2605 row 10, DEC-2021; `seal.type: static`, refused elsewhere by the schema): it starts sealed, is not ready until it is unsealed (`bao status`
exits 0 only then, over TLS to the pod's loopback, so the probe needs no network policy to admit the
kubelet), and nothing restarts it on its own, since a restart seals it again. Staging alone has a
second listener, on the pod's loopback, the one that answers root generation from the recovery keys
staging keeps in the cluster (DEC-2052): only `kubectl exec` or `kubectl port-forward` into the pod
reaches it, so staging's apply provisions the vault without a standing root token (DEC-2630). No
Service or policy names it.
*/ -}}
{{- define "vault.config" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  labels:
    {{- include "vault.labels" . | nindent 4 }}
data:
  config.hcl: |
    ui = false
    disable_mlock = true
    api_addr = "https://vault.{{ .Release.Namespace }}.svc:8200"
    cluster_addr = "https://127.0.0.1:8201"
    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "127.0.0.1:8201"
      tls_cert_file = "/openbao/tls/tls.crt"
      tls_key_file = "/openbao/tls/tls.key"
      tls_min_version = "tls13"
    }
    {{- if eq .Values.seal.type "static" }}
    listener "tcp" {
      address = "127.0.0.1:8210"
      tls_cert_file = "/openbao/tls/tls.crt"
      tls_key_file = "/openbao/tls/tls.key"
      tls_min_version = "tls13"
      disable_unauthed_generate_root_endpoints = false
    }
    {{- end }}
    storage "raft" {
      path = "/openbao/data"
      node_id = "vault-0"
    }
    {{- if eq .Values.seal.type "static" }}
    seal "static" {
      current_key_id = "{{ .Values.seal.keyId }}"
      current_key = "file:///openbao/seal/key"
    }
    {{- end }}
{{- end -}}
{{- define "vault.statefulset" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      {{- include "vault.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["bao", "server", "-config=/openbao/config/config.hcl"]
          env:
            - {name: BAO_ADDR, value: "https://127.0.0.1:8200"}
            - {name: BAO_CACERT, value: /openbao/tls/ca.crt}
            - {name: HOME, value: /tmp}
          ports:
            - {name: https, containerPort: 8200, protocol: TCP}
          readinessProbe:
            exec:
              command: ["bao", "status"]
            periodSeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /openbao/data}
            - {name: config, mountPath: /openbao/config, readOnly: true}
            - {name: tls, mountPath: /openbao/tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if eq .Values.seal.type "static" }}
            - {name: seal, mountPath: /openbao/seal, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: tls
          secret:
            secretName: vault-tls
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.seal.type "static" }}
        - name: seal
          secret:
            secretName: {{ .Values.seal.keyObject | quote }}
            defaultMode: 0440
            items:
              - {key: key, path: key}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "vault.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.className }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}
{{- end -}}
{{- define "vault.service" -}}
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vault.selector" . | nindent 4 }}
  ports:
    - {name: https, port: 8200, targetPort: 8200, protocol: TCP}
{{- end -}}
{{- /*
The Kubernetes API's addresses and ports, from values or else read from the cluster: the
`kubernetes` Service's address and its EndpointSlice's, since a policy controller may see either,
as the journal-db chart reads them.
Each must be one IPv4 host, from any source: an IPv6 address read as `/32` would cover a vast range.
*/ -}}
{{- define "vault.kubeApi" -}}
{{- $cidrs := .Values.kubeApi.cidrs -}}
{{- $ports := .Values.kubeApi.ports -}}
{{- if not $cidrs -}}
{{- $service := lookup "v1" "Service" "default" "kubernetes" -}}
{{- $slice := lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "kubernetes" -}}
{{- if and $service $slice -}}
{{- $cidrs = list (printf "%s/32" $service.spec.clusterIP) -}}
{{- $ports = list -}}
{{- range $service.spec.ports -}}
{{- $ports = append $ports (int .port) -}}
{{- end -}}
{{- range $slice.endpoints -}}
{{- range .addresses -}}
{{- $cidrs = append $cidrs (printf "%s/32" .) -}}
{{- end -}}
{{- end -}}
{{- range $slice.ports -}}
{{- $ports = append $ports (int .port) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if or (not $cidrs) (not $ports) -}}
{{- fail "the Kubernetes API's address is unknown: install into a cluster, or set kubeApi.cidrs and kubeApi.ports" -}}
{{- end -}}
{{- range $cidrs -}}
{{- if or (contains ":" .) (not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$" .)) -}}
{{- fail (printf "the Kubernetes API's address %s is not one IPv4 host: an IPv6 or wider address would open far more than the API" .) -}}
{{- end -}}
{{- end -}}
{{- dict "cidrs" (uniq $cidrs) "ports" (uniq $ports) | toJson -}}
{{- end -}}
{{- /*
Only the workspace's processes whose egress names the vault reach it, on 8200 alone. The vault
reaches nothing, but, with Kubernetes auth on, the cluster's API server, by address and port, for
TokenReview. The operator reaches it through `kubectl exec`, never the network.
*/ -}}
{{- define "vault.policy" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vault.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              mandate.dev/workspace: {{ .Values.workspace | quote }}
              mandate.dev/egress-vault: "true"
      ports:
        - {protocol: TCP, port: 8200}
  {{- if .Values.kubeApi.enabled }}
  {{- $api := include "vault.kubeApi" . | fromJson }}
  egress:
    - to:
        {{- range $api.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $api.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end -}}
---
{{ include "vault.emit" (include "vault.config" .) }}
---
{{ include "vault.emit" (include "vault.statefulset" .) }}
---
{{ include "vault.emit" (include "vault.service" .) }}
---
{{ include "vault.emit" (include "vault.policy" .) }}
