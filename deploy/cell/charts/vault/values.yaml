# The workspace vault (E21-32, DEC-2019). Settings only: the TLS key is made in the cluster at the
# first install and kept across upgrades, and the unseal key and the root token are made by
# `bao operator init`, never by the chart and never a value (DEC-822 item 4, DEC-977 item 5).

# Where this vault runs: `cell` (a local or CI cell), `staging`, or `production`. Only staging may
# unseal itself (DEC-2605 row 10, DEC-2021); the schema refuses the static seal anywhere else.
environment: cell

# How the vault unseals. `shamir` (the default): by hand, from key shares the operator holds
# (DEC-977 item 5). `static`: staging only, from a key in the Secret `keyObject`, which the
# founder's staging bootstrap creates (DEC-2021) and which is mounted as a
# file, never an environment variable; `keyId` names that key and is not a secret.
seal:
  type: shamir
  keyId: ""
  keyObject: vault-seal-key

# The workspace whose processes may reach the vault, by the label every workspace pod carries
# (`mandate.dev/workspace`) and the egress label of each process whose egress names the vault
# (`mandate.dev/egress-vault`).
workspace: ws1

# OpenBao 2.7.1, pinned by its index digest: the image CI's conformance suite runs (D-5, DEC-990;
# docs/dependencies.md).
image: ghcr.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf

# The integrated (raft) storage's volume. An empty class is the cluster's default.
storage:
  size: 1Gi
  className: ""

# How long the server certificate and its CA are valid from the install that made them. An
# install or upgrade within 30 days of their end makes new ones.
days: 365

# The cluster's API server, which the vault reaches only for Kubernetes auth's TokenReview, by
# address and port (V2, DEC-2630). Off, the vault reaches nothing. On, empty `cidrs` reads the
# `kubernetes` Service and its EndpointSlice at install, as the journal-db chart does; a rendering
# without a cluster must name them. Each address is one host (`/32`).
kubeApi:
  enabled: false
  cidrs: []
  ports: []
