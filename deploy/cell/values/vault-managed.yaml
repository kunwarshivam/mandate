# The workspace vault on a managed cluster outside staging (production): the chart's defaults but
# the environment and the volume's class. It unseals by hand after every restart of its pod (DEC-977
# item 5); the schema refuses the static seal here (DEC-2021). The operator steps are in
# deploy/cell/README.md, "The vault".
environment: production
workspace: ws1
storage:
  size: 1Gi
  className: do-block-storage
