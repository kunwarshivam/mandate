# The local and CI cell (E21-37): k3s in containers on a developer machine or a CI runner.
# `cargo xtask cell up` sets `images.mandate` and `images.runtime` to the images it built from the
# change.
workspace: ws1
environment: paper
localImages: true
# The demo agent deployment `cargo xtask cell up` starts the runtime for, on the deny-all wiring
# until the post-R0 hook (DEC-1013). `images.runtime` is set to the image `cell up` built.
runtime:
  agent: demo-agent
  connection: demo-paper
  owner: demo-owner
