# A managed Kubernetes cluster, rendered in CI to show the chart uses no k3s-only, Hetzner-only or
# cloud-only API (E21-36, DEC-967 item 6). Its DNS pods carry the upstream `k8s-app: kube-dns`
# label, as k3s's do.
workspace: ws1
environment: paper
egress:
  dns:
    namespace: kube-system
    podSelector:
      k8s-app: kube-dns
