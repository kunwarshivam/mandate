# The CloudNativePG operator, `cloudnative-pg` 0.29.1, with its image pinned by digest, as
# `cargo xtask cell up` installs it (xtask/src/cell.rs, CNPG_OPERATOR_TAG).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cnpg
  targetNamespace: cnpg-system
  storageNamespace: cnpg-system
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    image:
      tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
