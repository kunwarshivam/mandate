# The repository's own charts as production runs them: OCI artifacts that release.yml's publish-index
# job pushed from `main` (`cargo xtask release publish-charts`; these from 2fc268f6, release run
# 39173190442), pinned by digest, and used only once Flux has verified the digest's keyless
# signature from that workflow on `main` (DEC-2015 item 3). Promotion rewrites the digests here and
# in images.yaml together (DEC-2016).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mandate-backup-plugin-tls
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/kunwarshivam/mandate/charts/mandate-backup-plugin-tls
  ref:
    digest: sha256:8aaafe721058ebc1501843dae331c98bc8ed9aaa8b111ca54c7776f570e08e40
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/kunwarshivam/mandate/\.github/workflows/release\.yml@refs/heads/main$
---
