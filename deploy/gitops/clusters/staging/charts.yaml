# The repository's own charts as staging runs them: OCI artifacts that release.yml's publish-index
# job pushed from `main` (`cargo xtask release publish-charts`), pinned by digest, and used only
# once Flux has verified the digest's keyless signature from that workflow on `main` (DEC-2015
# item 3). Each names, as `mandate.dev/chart-version`, the version its digest was published as,
# whose `+g` suffix is the commit it was packaged from: test_gitops renders staging's values against
# that commit's chart, the one Flux installs. Promotion rewrites the digests and versions here and
# the images in images.yaml together (DEC-2016).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: mandate-backup-plugin-tls
  namespace: flux-system
  annotations:
    mandate.dev/chart-version: 0.1.0+gc6bb0c575999
spec:
  interval: 1h
  url: oci://ghcr.io/kunwarshivam/mandate/charts/mandate-backup-plugin-tls
  ref:
    digest: sha256:70d9d792b70078247c246e5a0383d4ecc9f4be4515ae7dab43f575f7fb5f7102
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/kunwarshivam/mandate/\.github/workflows/release\.yml@refs/heads/main$
---
