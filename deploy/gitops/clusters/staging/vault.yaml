# The workspace vault (deploy/cell/charts/vault), in staging alone (DEC-2051): production's unseal
# is not decided (DEC-2021 item 6), so production runs none until it is. Its values are
# deploy/cell/values/vault-staging.yaml unchanged, generated into the ConfigMap
# `vault-staging-values` (kustomization.yaml): a static seal from the Secret `vault-seal-key`, which
# only the founder's `cargo xtask gitops bootstrap staging` creates, from a key typed at a terminal
# and never in git, a value or a log (DEC-2021 item 3). Until that Secret exists the vault's pod
# waits to mount it, and until the founder initializes it once (`bao operator init`) it stays
# sealed and not ready, so Helm does not wait on it. helm-controller installs it, so the chart's own
# CA, kept by `lookup`, survives each upgrade. Flux never prunes it: removing it from git leaves
# the vault and its data in place rather than uninstalling it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  releaseName: vault
  targetNamespace: ws-ws1
  storageNamespace: ws-ws1
  chartRef:
    kind: OCIRepository
    name: mandate-vault-server
  install:
    disableWait: true
  upgrade:
    disableWait: true
  valuesFrom:
    - kind: ConfigMap
      name: vault-staging-values
      valuesKey: values.yaml
