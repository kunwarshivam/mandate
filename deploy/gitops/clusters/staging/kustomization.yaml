# Staging (E21-58): the base, with staging's own values patched in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sync.yaml
  - charts.yaml
  - vault.yaml
  - egress.yaml
  - ../../base
patches:
  - path: journal.yaml
  - path: workspace.yaml
configMapGenerator:
  - name: workspace-images
    namespace: flux-system
    files:
      - values.yaml=images.yaml
  - name: vault-staging-values
    namespace: flux-system
    files:
      - values.yaml=../../../cell/values/vault-staging.yaml
generatorOptions:
  disableNameSuffixHash: true
