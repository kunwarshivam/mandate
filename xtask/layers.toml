# Crate layering and dependency policy (ADR-0001 ES-02). Founder-owned (CODEOWNERS).
#
# Every workspace member must have an entry. Product crates have an integer `layer`; a crate may
# depend only on workspace crates in strictly lower layers. `layer = "tool"` crates (xtask, test
# harnesses) sit outside the product graph and no product crate may depend on them.
#
# `safety_critical = true` crates must:
#   - list every external (non-workspace) dependency in `allowed_external`;
#   - start `src/lib.rs` with the safety-critical lint header (see REQUIRED_HEADER in xtask).
# `pure = true` crates (the core) may not depend on any crate in `impure_crates`.
#
# Planned crates and layers, created only when a story needs them:
#   0  mandate-num, mandate-time, mandate-canon
#   1  mandate-domain
#   2  mandate-journal, mandate-accounting
#   3  mandate-spec
#   4  mandate-risk
#   5  mandate-builder
#   6  mandate-sim, mandate-marketdata, mandate-journal-pg, mandate-artifacts-fs, mandate-executor,
#      mandate-alpaca, mandate-runtime
#   7  mandate-backtest, mandate-cli (the CLI moves up when a command needs mandate-backtest)
#   tool  mandate-refcases, xtask

impure_crates = ["tokio", "sqlx", "reqwest", "hyper", "mio", "rand", "getrandom"]

[crates.xtask]
layer = "tool"
safety_critical = false
pure = false

[crates.mandate-num]
layer = 0
safety_critical = true
pure = true
allowed_external = ["ruint", "rust_decimal", "thiserror"]

[crates.mandate-time]
layer = 0
safety_critical = true
pure = true
allowed_external = ["jiff", "thiserror"]

[crates.mandate-canon]
layer = 0
safety_critical = true
pure = true
allowed_external = ["sha2", "thiserror"]

[crates.mandate-domain]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-journal]
layer = 2
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-accounting]
layer = 2
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-spec]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-refcases]
layer = "tool"
safety_critical = true
pure = false
allowed_external = ["libtest-mimic", "serde_json", "toml"]

[crates.mandate-research]
layer = 5
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-sim]
layer = 6
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-marketdata]
layer = 6
safety_critical = false
pure = false

[crates.mandate-journal-pg]
layer = 6
safety_critical = true
pure = false
allowed_external = ["sqlx", "thiserror"]

[crates.mandate-backtest]
layer = 7
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-cli]
layer = 7
safety_critical = false
pure = false

[crates.mandate-artifacts-fs]
layer = 6
safety_critical = true
pure = false
allowed_external = []

[crates.mandate-runtime]
layer = 6
safety_critical = true
pure = true
allowed_external = ["thiserror"]
