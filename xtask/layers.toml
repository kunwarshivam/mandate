# Crate layering and dependency policy (ADR-0001 ES-02). Founder-owned (CODEOWNERS).
#
# Every workspace member must have an entry. Product crates have an integer `layer`; a crate may
# depend only on workspace crates in strictly lower layers. `layer = "tool"` crates (xtask, test
# harnesses) sit outside the product graph and no product crate may depend on them.
#
# `safety_critical = true` crates must:
#   - list every external (non-workspace) dependency in `allowed_external`;
#   - start `src/lib.rs` with the safety-critical lint header (see REQUIRED_HEADER in xtask).
# The flag governs whatever the layer (DEC-253): a safety-critical `tool` crate is also mutated on
# the diff by `cargo xtask ci mutants`, and ES-13's 400-line change limit applies to it.
# `pure = true` crates (the core) may not depend on any crate in `impure_crates`.
# `forbidden_internal` names workspace crates a crate may never reach, directly or through any
# chain of path dependencies of any kind (normal, dev, build), whatever its layer allows; each name
# is a workspace member or in `planned`. No crate may have a path dependency outside the workspace,
# whose dependencies the check could not see (DEC-525).
# `allowed_dependents`, when set, is an allowlist: only the workspace crates it names may depend on
# the crate, by a dependency of any kind; each name is a workspace member or in `planned` (DEC-642
# item 7). `dev_only = true` lets other crates depend on the crate only as a dev-dependency
# (DEC-645).
#
# Planned crates and layers, created only when a story needs them:
#   0  mandate-num, mandate-time, mandate-canon, mandate-identity-seal (DEC-642 item 7: its
#      allowed_dependents list is the only thing that may build an identity session or membership),
#      and mandate-tenant (DEC-642 item 7, DEC-668): the sealed `Tenant` trait and the ID values it
#      returns, below mandate-identity, which re-exports them; its allowed_dependents list is the
#      only thing that may implement `Tenant`
#   1  mandate-domain, mandate-approval, mandate-liquidity, mandate-identity (pure cores over layer-0 values;
#      mandate-approval compares values and never reaches a limit under DEC-155 item 1), and
#      mandate-notify, the closed notice (E8-9, DEC-710): below the journal, so it can never reach
#      the control-stream writer (notifications spec NT-3)
#   2  mandate-push-relay, the web-push relay's pure core (E8-14 S8b, DEC-724): above mandate-notify,
#      whose canary scan its tests use, and kept off the journal and every trading crate (NT-3, NT-9);
#      mandate-journal, mandate-accounting, mandate-passkey, the WebAuthn relying party
#      (E9-1, DEC-660), which verifies and never signs, and mandate-authn (E9-1, DEC-650, DEC-652):
#      token verification and sessions as pure functions, with the issuer's keys and the clock
#      handed in, so it never fetches a key or reads a clock; above mandate-identity, whose sealed
#      session it builds; and mandate-identity-system (E9-8, DEC-642 items 5 to 8, DEC-668): the
#      background processes' SystemContext, above mandate-identity, whose permissions and witness it
#      uses; its allowed_dependents list names only the bootstrap crates of the agent runtime, the
#      executor and the scheduler, and is empty until E9-8 creates them
#   3  mandate-spec, mandate-audit (read-only audit reads over the journal, scoped to one
#      workspace; E12-6), and mandate-dispatcher, the notification process (E8-10, E8-14,
#      DEC-701 item 2): above mandate-journal, whose notice stream it alone appends to, and above
#      mandate-push-relay, whose request it builds; its forbidden_internal list names every crate
#      that writes an agent, account, or control stream (NT-3 at rung 1, DEC-701 item 3)
#   4  mandate-risk, and mandate-api (E10-10, DEC-681): the workspace API's pure contract, above
#      mandate-spec; it holds L5's audit wire types, and mandate-audit (layer 3) sits below it, so
#      the conversion into them sits above both; its server sits higher (DEC-680)
#   5  mandate-builder
#   6  mandate-sim, mandate-marketdata, mandate-journal-pg, mandate-artifacts-fs, mandate-executor,
#      mandate-runtime, mandate-mcp
#   7  mandate-alpaca, mandate-robinhood, mandate-backtest. `mandate-alpaca` is an adapter over the core (ES-02's
#      "adapters depend on the core, never the reverse"): it implements the `BrokerConnector` that
#      `mandate-executor` declares, so it must sit strictly above it rather than beside it
#   8  mandate-shell, the process shell and the `mandate-tracer` binary (E7-7, DEC-138): the lowest
#      layer that sees both `mandate-backtest` (7, the tracer's signal) and the order path
#      (`mandate-runtime`, `mandate-executor`, `mandate-alpaca`); and mandate-modelhost, the
#      quant model host (E15-13, DEC-503 item 2), beside the shell so that neither can depend on
#      the other: the shell cannot run a model, and the host cannot reach sizing, the gate, the
#      journal, the executor or the connector
#   9  mandate-paper, the paper adapter (E7-19 slice 5, DEC-503 item 2): the only crate that sees
#      both the host and the shell, and mandate-cli (DEC-525): above the model host, so `model register` takes the content object and
#      its hash from `mandate_modelhost::content()` and no caller supplies a hash; its
#      `forbidden_internal` list keeps it from ever reaching mandate-alpaca, mandate-shell or
#      mandate-paper, so the founder's CLI cannot place an order
#   10 mandate-rh-sim, the simulated Robinhood broker (E7-25, DEC-124): above every product crate,
#      so none can take it as a normal dependency and it stays out of every production graph,
#      while the Robinhood connector's tests (C1) reach it as a dev-dependency
#   11 mandate-identity-testkit (DEC-645): above every product crate, so only dev-dependencies
#      reach it, as mandate-rh-sim
#   tool  mandate-refcases, xtask

impure_crates = ["tokio", "sqlx", "reqwest", "hyper", "mio", "rand", "getrandom"]

# Crates planned but not yet created that a `forbidden_internal` list may already name (DEC-525).
planned = [
    "mandate-identity-seal",
    "mandate-identity-testkit",
]

[crates.xtask]
layer = "tool"
safety_critical = false
pure = false

[crates.mandate-num]
layer = 0
safety_critical = true
pure = true
allowed_external = ["ruint", "rust_decimal", "thiserror"]

[crates.mandate-time]
layer = 0
safety_critical = true
pure = true
allowed_external = ["jiff", "thiserror"]

[crates.mandate-canon]
layer = 0
safety_critical = true
pure = true
allowed_external = ["sha2", "thiserror"]

# Web push for opaque notices (E8-14, notifications spec §4.6): RFC 8291 encryption and RFC 8292
# VAPID over a closed payload. It depends on no workspace crate, and may never reach the journal,
# the control stream's writers, or the order path, so no push can approve or act (NT-3).
[crates.mandate-webpush]
layer = 0
safety_critical = true
pure = true
allowed_external = ["aes-gcm", "base64ct", "hkdf", "p256", "sha2", "thiserror"]
forbidden_internal = ["mandate-journal", "mandate-journal-pg", "mandate-journal-cold", "mandate-runtime", "mandate-executor", "mandate-shell", "mandate-alpaca", "mandate-mcp", "mandate-cli"]

[crates.mandate-domain]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-approval]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-authn]
layer = 2
safety_critical = true
pure = true
allowed_external = ["base64", "ring", "serde", "serde_json", "thiserror"]

[crates.mandate-identity]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-notify]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-push-relay]
layer = 2
safety_critical = true
pure = true
allowed_external = ["thiserror"]
forbidden_internal = ["mandate-journal", "mandate-journal-pg", "mandate-journal-cold", "mandate-runtime", "mandate-executor", "mandate-shell", "mandate-alpaca", "mandate-mcp", "mandate-cli", "mandate-paper", "mandate-risk", "mandate-approval"]

# The notification dispatcher (E8-10, E8-14, DEC-701): a process crate, above mandate-journal. It
# may never reach a crate that writes an agent, account, or control stream: the runtime, the
# executor, the MCP server, the shell, the CLI, the paper binary, and the broker connectors
# (DEC-701 item 3, NT-3). `pure` until the change that gives it I/O.
[crates.mandate-dispatcher]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]
forbidden_internal = ["mandate-runtime", "mandate-executor", "mandate-mcp", "mandate-shell", "mandate-cli", "mandate-paper", "mandate-alpaca", "mandate-robinhood"]

[crates.mandate-identity-seal]
layer = 0
safety_critical = true
pure = true
allowed_external = []
allowed_dependents = ["mandate-authn", "mandate-identity", "mandate-identity-testkit"]

[crates.mandate-tenant]
layer = 0
safety_critical = true
pure = true
allowed_external = ["thiserror"]
allowed_dependents = ["mandate-identity", "mandate-identity-system"]

[crates.mandate-identity-system]
layer = 2
safety_critical = true
pure = true
allowed_external = []
allowed_dependents = []

[crates.mandate-identity-testkit]
layer = 11
safety_critical = false
pure = true
dev_only = true

[crates.mandate-passkey]
layer = 2
safety_critical = true
pure = true
allowed_external = ["base64", "ring", "serde", "serde_json", "thiserror"]

[crates.mandate-liquidity]
layer = 1
safety_critical = true
pure = true
allowed_external = []

[crates.mandate-journal]
layer = 2
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-accounting]
layer = 2
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-journal-cold]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-audit]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-spec]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-api]
layer = 4
safety_critical = true
pure = true
allowed_external = ["serde", "serde_json", "serde_path_to_error", "sha2", "thiserror"]
# The identity system crate holds sessions and credentials; the contract never reaches it
# (DEC-642 item 6).
forbidden_internal = ["mandate-identity-system"]

[crates.mandate-refcases]
layer = "tool"
safety_critical = true
pure = false
allowed_external = ["libtest-mimic", "serde_json", "toml"]

[crates.mandate-rh-sim]
layer = 10
safety_critical = true
pure = true
allowed_external = ["serde_json", "thiserror"]

[crates.mandate-builder]
layer = 5
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-risk]
layer = 4
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-research]
layer = 5
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-sim]
layer = 6
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-marketdata]
layer = 6
safety_critical = false
pure = false

# The MCP client a broker connector uses inside itself (E7-16, connections spec §6.2): it knows
# nothing of brokers or orders, so it sits beside the executor, below the connectors that use it.
[crates.mandate-mcp]
layer = 6
safety_critical = true
pure = false
allowed_external = ["getrandom", "reqwest", "rustls", "secrecy", "serde", "serde_json", "thiserror", "tokio"]

[crates.mandate-connections]
layer = 6
safety_critical = true
pure = true
allowed_external = ["secrecy", "thiserror"]

[crates.mandate-journal-pg]
layer = 6
safety_critical = true
pure = false
allowed_external = ["sqlx", "thiserror"]

[crates.mandate-backtest]
layer = 7
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-cli]
layer = 9
safety_critical = true
pure = false
allowed_external = ["anyhow", "clap", "secrecy", "serde", "tokio", "toml"]
# The founder's CLI can never place an order (AGENTS.md rules 8 and 12, DEC-525): it may not reach
# the connector, the shell, or the paper binary, through any chain of dependencies.
forbidden_internal = ["mandate-alpaca", "mandate-paper", "mandate-shell"]

[crates.mandate-executor]
layer = 6
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-vault-local]
layer = 7
safety_critical = true
