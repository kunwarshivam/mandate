# Crate layering and dependency policy (ADR-0001 ES-02). Founder-owned (CODEOWNERS).
#
# Every workspace member must have an entry. Product crates have an integer `layer`; a crate may
# depend only on workspace crates in strictly lower layers. `layer = "tool"` crates (xtask, test
# harnesses) sit outside the product graph and no product crate may depend on them.
#
# `safety_critical = true` crates must:
#   - list every external (non-workspace) dependency in `allowed_external`;
#   - start `src/lib.rs` with the safety-critical lint header (see REQUIRED_HEADER in xtask).
# The flag governs whatever the layer (DEC-253): a safety-critical `tool` crate is also mutated on
# the diff by `cargo xtask ci mutants`, and ES-13's 400-line change limit applies to it.
# `pure = true` crates (the core) may not depend on any crate in `impure_crates`.
# `forbidden_internal` names workspace crates a crate may never reach, directly or through any
# chain of path dependencies of any kind (normal, dev, build), whatever its layer allows; each name
# is a workspace member or in `planned`. No crate may have a path dependency outside the workspace,
# whose dependencies the check could not see (DEC-525).
# `allowed_dependents`, when set, is an allowlist: only the workspace crates it names may depend on
# the crate, by a dependency of any kind; each name is a workspace member or in `planned` (DEC-642
# item 7). `dev_only = true` lets other crates depend on the crate only as a dev-dependency
# (DEC-645).
#
# Planned crates and layers, created only when a story needs them:
#   0  mandate-num, mandate-time, mandate-canon, mandate-identity-seal (DEC-642 item 7: its
#      allowed_dependents list is the only thing that may build an identity session or membership),
#      and mandate-tenant (DEC-642 item 7, DEC-668): the sealed `Tenant` trait and the ID values it
#      returns, below mandate-identity, which re-exports them; its allowed_dependents list is the
#      only thing that may implement `Tenant`
#   1  mandate-cp-agent (E20-3, DEC-982: the control-plane link's inbound checks, kept off the
#      journal), mandate-domain, mandate-approval, mandate-liquidity, mandate-identity, mandate-gateway (pure cores over layer-0 values;
#      mandate-approval compares values and never reaches a limit under DEC-155 item 1), and
#      mandate-notify, the closed notice (E8-9, DEC-710): below the journal, so it can never reach
#      the control-stream writer (notifications spec NT-3)
#   2  mandate-webpush, web push for opaque notices (E8-14, DEC-790): above mandate-notify, whose
#      `Notification` is its plaintext's only public source (DEC-713); mandate-journal, mandate-accounting, mandate-passkey, the WebAuthn relying party
#      (E9-1, DEC-660), which verifies and never signs, and mandate-authn (E9-1, DEC-650, DEC-652):
#      token verification and sessions as pure functions, with the issuer's keys and the clock
#      handed in, so it never fetches a key or reads a clock; above mandate-identity, whose sealed
#      session it builds; and mandate-identity-system (E9-8, DEC-642 items 5 to 8, DEC-668): the
#      background processes' SystemContext, above mandate-identity, whose permissions and witness it
#      uses; its allowed_dependents list names only the bootstrap crates of the agent runtime, the
#      executor and the scheduler, and is empty until E9-8 creates them
#   3  mandate-spec, and mandate-push-relay, the web-push relay's pure core (E8-14 S8b, DEC-724):
#      above mandate-webpush, whose endpoint parser it shares, and mandate-notify, whose canary scan
#      its tests use, and kept off the journal and every trading crate (NT-3, NT-9; raised from
#      layer 2 by DEC-713); and mandate-process, the lifecycle every long-running process shares
#      (E21-28, DEC-994): above mandate-journal, whose `Fenced` outcome it reads, and below every
#      process crate that imports it
#   3  mandate-alerts, the §8.2 operator alerts (E21-4, DEC-1070): above mandate-journal, whose
#      stored record it reads, and mandate-notify, whose minted id and canary scan it reuses; kept
#      off every crate that writes a stream or reaches a broker, so an alert can never act (OPS-10)
#   4  mandate-deploy-manager, the deployment manager (E21-33, DEC-1170): a workspace service above
#      mandate-process and mandate-journal, kept off every stream writer but the control stream
#   4  mandate-risk, and mandate-api (E10-10, DEC-681): the workspace API's pure contract, above
#      mandate-spec; it holds L5's audit wire types, and mandate-audit sits beside it, so the
#      conversion into them sits above both; its server sits higher (DEC-680); and mandate-audit
#      (read-only audit reads over the journal, scoped to one workspace; E12-6), raised from layer
#      3 by DEC-785 so that E12-3's verification run can use mandate-journal-cold's (layer 3)
#      verify_tsa and SegmentManifest rather than reimplement them
#   5  mandate-builder; mandate-research-run, the research worker (E19-2, DEC-431 item 20, DEC-996)
#   6  mandate-sim, mandate-evaluation (E17-8, DEC-1002), mandate-marketdata, mandate-journal-pg, mandate-artifacts-fs, mandate-executor,
#      mandate-runtime, mandate-mcp
#   6  mandate-sim, mandate-marketdata, mandate-journal-pg, mandate-artifacts-fs, mandate-objectstore,
#      mandate-executor, mandate-runtime, mandate-mcp
#   7  mandate-alpaca, mandate-robinhood, mandate-backtest. `mandate-alpaca` is an adapter over the core (ES-02's
#      "adapters depend on the core, never the reverse"): it implements the `BrokerConnector` that
#      `mandate-executor` declares, so it must sit strictly above it rather than beside it
#   8  mandate-version-backtest (E4-4, DEC-1000), above mandate-backtest and mandate-executor
#   8  mandate-shell, the process shell (E7-7, DEC-138; the shell's dependency on backtest is
#      deleted with the tracer's signal path, DEC-475 item 6): the lowest layer that sees the
#      order path (`mandate-runtime`, `mandate-executor`, `mandate-alpaca`) and no model at all; and
#      mandate-dataservice, the workspace data service (E2-6, DEC-1200): above mandate-alpaca, whose
#      stream messages it normalizes in a later slice, and above mandate-risk, whose `SaneQuote` it
#      hands the gate; runtimes and executors are to read it over the host-local channel (E21-44),
#      not link it; and mandate-modelhost, the
#      quant model host (E15-13, DEC-503 item 2), beside the shell so that neither can depend on
#      the other: the shell cannot run a model, and the host cannot reach sizing, the gate, the
#      journal, the executor or the connector
#   8  mandate-telemetry, metrics through the OpenTelemetry API and a Prometheus pull exporter
#      (E21-3, DEC-980): no workspace dependency, and its allowed_dependents list names only process
#      binaries, so no core crate can record a metric or read one (OPS-11)
#   9  mandate-agentd, the long-running agent process (E21-2, DEC-968), beside mandate-paper and
#      kept from reaching it; mandate-paper, the paper adapter (E7-19 slice 5, DEC-503 item 2): the only crate that sees
#      both the host and the shell, and mandate-cli (DEC-525): above the model host, so `model register` takes the content object and
#      its hash from `mandate_modelhost::content()` and no caller supplies a hash; its
#      `forbidden_internal` list keeps it from ever reaching mandate-alpaca, mandate-shell or
#      mandate-paper, so the founder's CLI cannot place an order; and mandate-dispatcher, the
#      notification process (E8-10, E8-14, DEC-701 item 2), raised from layer 4 by DEC-2500 item 2
#      to sit above mandate-journal-pg, whose notice stream it alone appends to; its
#      forbidden_internal list names every crate that writes an agent, account, or control stream
#      (NT-3 at rung 1, DEC-701 item 3), and nothing may depend on it (NT-9)
#   9  also mandate-api-server, the workspace API server (E21-31, DEC-978): above the journal's
#      Postgres store and the API's contract, raised from layer 7 by DEC-2338 item 1 to sit above
#      mandate-vault, through which it writes the callback's code; kept from the runtime, executor
#      and connectors
#   10 mandate-rh-sim, the simulated Robinhood broker (E7-25, DEC-124): above every product crate,
#      so none can take it as a normal dependency and it stays out of every production graph,
#      while the Robinhood connector's tests (C1) reach it as a dev-dependency
#   11 mandate-identity-testkit (DEC-645): above every product crate, so only dev-dependencies
#      reach it, as mandate-rh-sim; and mandate-shell-rh-sim (DEC-928 item 4), the simulator
#      harness of the shell's Robinhood connector: a crate of tests only, above mandate-rh-sim,
#      which its tests drive
#   tool  mandate-refcases, xtask

impure_crates = ["tokio", "sqlx", "reqwest", "hyper", "mio", "rand", "getrandom", "opentelemetry", "opentelemetry_sdk", "opentelemetry-prometheus", "prometheus"]

# Crates planned but not yet created that a `forbidden_internal` list may already name (DEC-525).
planned = [
    "mandate-identity-seal",
    "mandate-identity-testkit",
]

# The two sides of a workspace deployment, which meet only in the journal (E21-42, DEC-986;
# journal spec §2; DEC-17). No crate in one list may reach a crate in the other, directly or
# through any chain of path dependencies of any kind (normal, dev, build), so no workspace service
# can call into a runtime's host, an executor or a connector, and no agent process can call a
# workspace service: every fact crosses as a journaled event. Each name is a workspace member or in
# `planned`, and no crate is in both. A crate in neither list is a shared library (the journal, the
# pure cores, the runtime's and the model host's pure decision code, connections, storage) or a
# tool. A new crate that is a workspace service or an agent process joins its list in the change
# that creates it.
#
# `mandate-cli` is Phase 1's workspace control services (infrastructure design §3.1).
# `mandate-mcp` is the broker connectors' MCP client, used only inside the executor's connectors.
[process_groups]
workspace_services = [
    "mandate-api",
    "mandate-audit",
    "mandate-cli",
    "mandate-cp-agent",
    "mandate-cp-site",
    "mandate-deploy-manager",
    "mandate-deployd",
    "mandate-provisioner",
    "mandate-provisionerd",
    "mandate-dispatcher",
    "mandate-gatewayd",
]
agent_process = [
    "mandate-agentd",
    "mandate-alpaca",
    "mandate-daemon",
    "mandate-executor",
    "mandate-executord",
    "mandate-mcp",
    "mandate-paper",
    "mandate-robinhood",
    "mandate-shell",
]

[crates.xtask]
layer = "tool"
safety_critical = false
pure = false

[crates.mandate-num]
layer = 0
safety_critical = true
pure = true
allowed_external = ["ruint", "rust_decimal", "thiserror"]

# The release a process runs (E21-8, DEC-972): the build digest of its own executable, the SHA-256
# the reproducible release build's SHA256SUMS lists, which the process journals as `actor.build`;
# and the start-up signature check (E21-35, DEC-971, OPS-15), which verifies the executable's
# cosign signature with `ring` (ECDSA P-256) against compiled-in release keys. Above
# mandate-canon, whose digest it uses; not pure, because it reads the executable's file.
[crates.mandate-release]
layer = 1
safety_critical = true
pure = false
allowed_external = ["base64", "ring", "thiserror"]

[crates.mandate-time]
layer = 0
safety_critical = true
pure = true
allowed_external = ["jiff", "thiserror"]

[crates.mandate-canon]
layer = 0
safety_critical = true
pure = true
allowed_external = ["sha2", "thiserror"]

# Web push for opaque notices (E8-14, notifications spec §4.6): RFC 8291 encryption and RFC 8292
# VAPID over a closed payload. Its one workspace dependency is mandate-notify, whose closed
# `Notification` is the only public source of a plaintext (DEC-790 item 7, DEC-713), so it sits at
# layer 2, one above it. It may never reach the journal, the control stream's writers, or the order
# path, so no push can approve or act (NT-3).
[crates.mandate-webpush]
layer = 2
safety_critical = true
pure = true
allowed_external = ["aes-gcm", "base64ct", "hkdf", "p256", "sha2", "thiserror"]
forbidden_internal = ["mandate-journal", "mandate-journal-pg", "mandate-journal-cold", "mandate-runtime", "mandate-executor", "mandate-shell", "mandate-alpaca", "mandate-mcp", "mandate-cli"]

[crates.mandate-domain]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-approval]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-authn]
layer = 2
safety_critical = true
pure = true
allowed_external = ["base64", "ring", "serde", "serde_json", "thiserror"]

[crates.mandate-identity]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-notify]
layer = 1
safety_critical = true
pure = true
allowed_external = ["thiserror"]

# The §8.2 operator alerts (E21-4, infrastructure design §8.2, OPS-10, DEC-1070): a closed alert set
# raised from stored journal records and from signals, with a payload of an opaque id and fixed
# text only. It reads the journal's stored record and reaches no writer, executor, runtime,
# connector, or the CLI, so raising an alert can never append, act, or trade.
[crates.mandate-alerts]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]
forbidden_internal = ["mandate-journal-pg", "mandate-journal-cold", "mandate-runtime", "mandate-executor", "mandate-shell", "mandate-alpaca", "mandate-robinhood", "mandate-mcp", "mandate-cli", "mandate-paper", "mandate-agentd", "mandate-risk", "mandate-approval", "mandate-dispatcher", "mandate-webpush", "mandate-push-relay", "mandate-connections", "mandate-vault-local", "mandate-api", "mandate-authn"]

[crates.mandate-push-relay]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]
forbidden_internal = ["mandate-journal", "mandate-journal-pg", "mandate-journal-cold", "mandate-runtime", "mandate-executor", "mandate-shell", "mandate-alpaca", "mandate-mcp", "mandate-cli", "mandate-paper", "mandate-risk", "mandate-approval"]

# The process lifecycle core (E21-28, DEC-994): a pure fold over injected inputs and time, and the
# probe answers. Its one I/O is the probe socket, std only, reading no clock. Layer 3 keeps it below
# every process crate and every trading crate.
[crates.mandate-process]
layer = 3
safety_critical = true
pure = true
allowed_external = []

# The deployment manager (E21-33, DEC-1170): a workspace service at layer 4, above
# mandate-process, whose crash-loop bound it applies, and mandate-journal, whose control stream it
# reads and appends its three records to. It reaches the orchestrator over plain HTTPS (D-3) and may
# never reach a crate that writes an agent or account stream, holds a broker credential, or edits a
# mandate: the runtime, the executor, the connectors, the shell, the CLI, the paper binary, the
# agent process, the order builder, the risk gate and the mandate document crate.
[crates.mandate-deploy-manager]
layer = 4
safety_critical = true
pure = false
allowed_external = ["reqwest", "rustls", "serde_json"]
forbidden_internal = [
    "mandate-agentd",
    "mandate-alpaca",
    "mandate-builder",
    "mandate-cli",
    "mandate-executor",
    "mandate-mcp",
    "mandate-paper",
    "mandate-risk",
    "mandate-robinhood",
    "mandate-runtime",
    "mandate-shell",
    "mandate-spec",
]

# The notification dispatcher (E8-10, E8-14, DEC-701): a process crate at layer 9, above the
# Postgres journal it reads and appends to (DEC-2500 item 2). It may never reach a crate that
# writes an agent, account, or control stream: the runtime, the executor, the MCP server, the
# shell, the CLI, the paper binary, the broker connectors (DEC-701 item 3, NT-3), the agent
# process, and the workspace API (DEC-2500 item 2). Nothing may depend on it, so no trading crate
# can wait on it (NT-9 at rung 1). `pure = false` since slice D10a: the operating system's random
# source (through `ring`) and the Postgres journal (through `tokio`). Its other externals
# (DEC-2500 item 2) are listed by the slice that first uses each: `secrecy` since slice D10b, for a
# web-push address's vault entry and a VAPID key's document (DEC-2502 item 8, DEC-2503 item 3).
[crates.mandate-dispatcher]
layer = 9
safety_critical = true
pure = false
allowed_external = ["ring", "secrecy", "thiserror", "tokio"]
forbidden_internal = ["mandate-runtime", "mandate-executor", "mandate-mcp", "mandate-shell", "mandate-cli", "mandate-paper", "mandate-alpaca", "mandate-robinhood", "mandate-agentd", "mandate-api"]
allowed_dependents = []

# The seal: only the workspace store and test support build memberships and identity sessions
# (DEC-642 items 4 and 7). `mandate-api-server` is that store for a workspace deployment: it folds
# the control stream's membership records per request (E21-31, DEC-978 item 8).
[crates.mandate-identity-seal]
layer = 0
safety_critical = true
pure = true
allowed_external = []
allowed_dependents = [
    "mandate-api-server",
    "mandate-authn",
    "mandate-identity",
    "mandate-identity-testkit",
]

[crates.mandate-tenant]
layer = 0
safety_critical = true
pure = true
allowed_external = ["thiserror"]
allowed_dependents = ["mandate-identity", "mandate-identity-system"]

[crates.mandate-identity-system]
layer = 2
safety_critical = true
pure = true
allowed_external = []
allowed_dependents = []

[crates.mandate-identity-testkit]
layer = 11
safety_critical = false
pure = true
dev_only = true

[crates.mandate-passkey]
layer = 2
safety_critical = true
pure = true
allowed_external = ["base64", "ring", "serde", "serde_json", "thiserror"]

# The cell's control-plane agent (E20-3, DEC-981; control-plane design §3, CP-4, CP-5): the closed
# inbound message set and its signature checks, handed to workspace control services through a port
# this crate declares and they implement. It reaches no journal, runtime, executor, mandate registry
# or vault crate, directly or through any chain, so it can never append, hold a writer epoch, place
# an order, or read a credential.
[crates.mandate-cp-agent]
layer = 1
safety_critical = true
pure = true
allowed_external = ["ring"]
forbidden_internal = [
    "mandate-journal",
    "mandate-journal-pg",
    "mandate-journal-cold",
    "mandate-spec",
    "mandate-runtime",
    "mandate-executor",
    "mandate-connections",
    "mandate-vault-local",
    "mandate-shell",
    "mandate-agentd",
    "mandate-paper",
]

# The global control plane's first slice (E21-43 with E20-1, E20-2, E20-5; DEC-984): the
# directory, enrollment, routing and fleet health, over a store it declares. It runs outside every
# cell (design §3), so it reaches no journal, runtime, executor, connector, vault, or process crate,
# and not the cell's control-plane agent or its workspace-services handler: nothing it holds is a
# path into a deployment (CP-4, CP-7, CP-12).
[crates.mandate-cp]
layer = 2
safety_critical = true
pure = true
allowed_external = ["ring"]
forbidden_internal = [
    "mandate-journal",
    "mandate-journal-pg",
    "mandate-journal-cold",
    "mandate-spec",
    "mandate-runtime",
    "mandate-executor",
    "mandate-connections",
    "mandate-vault-local",
    "mandate-shell",
    "mandate-agentd",
    "mandate-paper",
]

# Workspace control services' side of the control-plane link (E20-3, DEC-983; control-plane design
# CP-5, CP-9): it implements cp-agent's port, judges each instruction against the journaled
# sequence, and writes §9.17 records through a port of its own, so it needs no journal crate
# outside its tests. It never reaches a runtime, executor, connector, vault, or process crate.
[crates.mandate-cp-site]
layer = 2
safety_critical = true
pure = true
allowed_external = []
forbidden_internal = [
    "mandate-spec",
    "mandate-runtime",
    "mandate-executor",
    "mandate-connections",
    "mandate-vault-local",
    "mandate-shell",
    "mandate-agentd",
    "mandate-paper",
]

[crates.mandate-liquidity]
layer = 1
safety_critical = true
pure = true
allowed_external = []

[crates.mandate-journal]
layer = 2
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-accounting]
layer = 2
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-journal-cold]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-audit]
layer = 4
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-spec]
layer = 3
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-api]
layer = 4
safety_critical = true
pure = true
allowed_external = ["serde", "serde_json", "serde_path_to_error", "sha2", "thiserror"]
# The identity system crate holds sessions and credentials; the contract never reaches it
# (DEC-642 item 6).
forbidden_internal = ["mandate-identity-system"]

[crates.mandate-refcases]
layer = "tool"
safety_critical = true
pure = false
allowed_external = ["libtest-mimic", "serde_json", "toml"]

[crates.mandate-rh-sim]
layer = 10
safety_critical = true
pure = true
allowed_external = ["serde_json", "thiserror"]

[crates.mandate-shell-rh-sim]
layer = 11
safety_critical = true
pure = false
allowed_external = ["serde_json", "tokio"]

[crates.mandate-builder]
layer = 5
safety_critical = true
pure = true
allowed_external = ["thiserror"]

[crates.mandate-risk]
layer = 4
safety_critical = true
pure = true
allowed_external = ["thiserror"]

# The model gateway (E15-6 to E15-10, inference spec, DEC-997, DEC-998): the one component that
# calls a model. Pure, over layer-0 values: transport, clock, ids and the provider key come in
# through traits, so it opens no socket and reads no clock or vault itself. It may never reach the
# order path, a mandate or policy document's writer, or a credential store (INF-5, INF-14, INF-16).
[crates.mandate-gateway]
layer = 1
safety_critical = true
pure = true
allowed_external = ["serde_json", "thiserror"]
forbidden_internal = ["mandate-spec", "mandate-journal", "mandate-builder", "mandate-risk", "mandate-executor", "mandate-runtime", "mandate-alpaca", "mandate-robinhood", "mandate-shell", "mandate-connections", "mandate-vault-local"]

[crates.mandate-research]
layer = 5
safety_critical = true
pure = true
allowed_external = ["thiserror"]

# The forward-paper evaluation harness (E17-8, E15-3, DEC-1002): above mandate-research, whose
# scorer it calls, and mandate-spec, whose record check it runs. It may never reach the backtest,
# so no scorecard can be computed from a backtest (DEC-99).
[crates.mandate-evaluation]
layer = 6
safety_critical = true
pure = true
allowed_external = ["thiserror"]
forbidden_internal = ["mandate-backtest", "mandate-version-backtest"]

# The agent harness's research worker (agent harness spec §4, E19-2, E19-3; DEC-431 item 20,
# DEC-996): the retrieval plan, read-only reader ports, the gateway port, and the strict output
# parse. Layer 5, below mandate-runtime, so it can never name `IntentSink` (HI-1); and kept off
# every journal crate, so the runtime core stays the agent stream's one writer (HI-16).
[crates.mandate-research-run]
layer = 5
safety_critical = true
pure = true
allowed_external = ["thiserror"]
forbidden_internal = ["mandate-journal", "mandate-journal-pg", "mandate-journal-cold", "mandate-artifacts-fs"]

[crates.mandate-sim]
layer = 6
safety_critical = true
pure = true
allowed_external = ["thiserror"]

# The research agent's inputs beyond prices (E17-7, data-plane spec §4, DEC-1130): the vetted-source
# allowlist, news and filings records, their typed readers, and the guarded fetchers. Layer 6,
# above mandate-research, whose source and drift types it fills, and level with the executor, so
# neither the executor nor anything below it (the builder, the gate, accounting) can reach its
# untrusted text (DP-8). Pure: the HTTPS transport is mandate-sources-http's.
[crates.mandate-sources]
layer = 6
safety_critical = true
pure = true
allowed_external = ["secrecy", "serde", "serde_json", "thiserror", "toml"]

# The HTTPS transport for mandate-sources' fetchers (E17-7, DEC-1130 item 3): it only sends to a
# PermittedUrl the allowlist built, follows no redirect, and caps each body. Layer 7, above
# mandate-sources; nothing in the trading path depends on it.
[crates.mandate-sources-http]
layer = 7
safety_critical = false
pure = false

# The model gateway's HTTPS transport (E15-6, E15-10, DEC-2200): one attempt to the host the
# gateway's egress allowlist permitted, over TLS, inside its deadline, with the provider key as a
# sensitive header. Safety-critical because it carries the key. Layer 7, above mandate-gateway;
# nothing in the trading path depends on it, and nothing wires it to a live endpoint until DEC-998
# item 8 and DEC-997 allow one. It may never reach the order path or a mandate or policy writer.
[crates.mandate-gateway-http]
layer = 7
safety_critical = true
pure = false
allowed_external = ["reqwest", "rustls", "thiserror", "tokio"]
