file = "crates/mandate-api/tests/contract.rs"
test = "a_custom_refusal_on_an_objects_last_member_is_located_at_the_member"
reason = """
E10-10's decode minors from #993's review (DEC-681 item 10): `decode` is already implemented, and
locates a `non_canonical` refusal on an object's last member at the parent pointer (`""` for
`{"effect": "none", "bid": "1.50"}`) instead of at the member (`/bid`), so this test fails on that
answer rather than at a stub. The change that locates it at the member deletes this file with the
test's `#[ignore]` line.
"""
