file = "crates/mandate-api/tests/contract.rs"
test = "a_request_body_given_as_an_array_is_refused_as_type_at_the_root"
reason = """
E10-10, DEC-882: `decode` is already implemented, and through serde's derived `visit_seq` it
accepts a request body written as a JSON array (`[]` as a pause, `[{"kind": "agent", "id": "a"}]`
as a kill switch) and refuses `[5]` at `/0`, where `type` at `""` is expected, so this test fails
on that answer rather than at a stub. The change that reads a derived struct only from a JSON
object deletes this file with the test's `#[ignore]` line.
"""
