# The mail guard's configuration (notifications spec §4.4, rung 2; DEC-700 item 4, DEC-2511).
# While the spec still holds the general footer's placeholder, `cargo xtask mail-guard` refuses
# any `MailTransport` implementor not listed here, and any crate below anywhere in the build but
# as a direct dependency of the founder-only transport's crate. The change that supplies counsel's
# general footer removes the check (spec §4.4).

spec = "docs/specs/notifications.md"
placeholder = "[[EMAIL-FOOTER]]"
founder_transport_crate = "mandate-mail-smtp"

# The file that defines the trait: the only place `trait MailTransport` may appear.
trait_file = "crates/mandate-dispatcher/src/email.rs"

# The only implementors §4.4 allows: the recorded fixture and the founder-only SMTP transport.
# Each is defined, once, in its file, and implements the trait there, by its bare name.
[[transport]]
crate = "mandate-dispatcher"
type = "RecordedTransport"
file = "crates/mandate-dispatcher/src/email.rs"

[[transport]]
crate = "mandate-mail-smtp"
type = "FounderSmtpTransport"
file = "crates/mandate-mail-smtp/src/lib.rs"

# Mail-sending crates: SMTP clients, message builders that submit, and mail-provider SDKs.
[denied]
crates = [
  "async-smtp",
  "aws-sdk-pinpoint",
  "aws-sdk-ses",
  "aws-sdk-sesv2",
  "aws-sdk-sns",
  "google-gmail1",
  "lettre",
  "lettre_email",
  "mail-builder",
  "mail-core",
  "mail-send",
  "mail-smtp",
  "mailchimp",
  "mailgun-rs",
  "mailin",
  "mailjet",
  "mandrill",
  "postmark",
  "resend-rs",
  "rusoto_ses",
  "samotop",
  "sendgrid",
  "sendinblue",
  "sendmail",
  "ses",
  "smtp",
  "smtp-client",
  "smtpbis",
  "sparkpost",
]
