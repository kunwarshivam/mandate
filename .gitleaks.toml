# Secret scanning (ADR-0001 ES-14). Extends the default rules with Alpaca key formats.

[extend]
useDefault = true

[[rules]]
id = "alpaca-key-id"
description = "Alpaca API key ID (live AK..., paper PK...)"
regex = '''\b(AK|PK)[A-Z0-9]{18}\b'''
keywords = ["ak", "pk"]

[[rules]]
id = "alpaca-secret"
description = "Alpaca API secret assigned to a variable"
regex = '''(?i)alpaca[a-z_]*secret[a-z_]*\s*[:=]\s*['"]?[A-Za-z0-9/+]{30,}'''
keywords = ["alpaca"]

# Alpaca pagination tokens in recorded fixtures are base64 of `SYMBOL|...|timestamp`, not
# credentials; the tests replay them to check pagination (E2-1, DEC-89). `condition = "AND"`
# allows a match only when both the path and the text match, so the same text in any other file
# is still reported; `cargo xtask ci supply-chain` plants cases that check this.
[[allowlists]]
description = "Alpaca page tokens in the recorded fixture pages"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^crates/mandate-marketdata/tests/fixtures/alpaca/[a-z0-9-]+/(?:page-[0-9]+\.json|requests\.txt)$''']
regexTarget = "match"
regexes = ['''^(?:next_page_token":"[A-Za-z0-9+/=]+"|page_token=[A-Za-z0-9+/%=]+)$''']

# The key-ID-shaped sentinel that the redaction test checks never reaches output (E2-1, DEC-89),
# allowed only in that test file.
[[allowlists]]
description = "Redaction test sentinel"
targetRules = ["alpaca-key-id"]
condition = "AND"
paths = ['''^crates/mandate-marketdata/tests/http\.rs$''']
regexTarget = "match"
regexes = ['''^PKSENTINELKEYID00000$''']

# The trading redaction test sentinel comment above — recorded fixtures deliberately not
# allowlisted — applies here too: nothing under `web/` is allowlisted wholesale.

# The key-ID-shaped sentinel the trading connector's redaction tests check never reaches output
# (E7-2, DEC-133), allowed only in the file that defines it. It is a planted test value, never a
# credential and never a recording: the recorded fixtures under
# `crates/mandate-alpaca/tests/fixtures/` are deliberately **not** allowlisted, so a real key that
# reached one would still be reported.
[[allowlists]]
description = "Trading redaction test sentinel"
targetRules = ["alpaca-key-id"]
condition = "AND"
paths = ['''^crates/mandate-alpaca/tests/common/mod\.rs$''']
regexTarget = "match"
regexes = ['''^PKSENTINELTRADING000$''']

# The web palette's `lapis` token rows (DEC-204 to DEC-217): `lapis` contains "api", so the
# generic key heuristic reads the design-source table's quoted ramp refs as credentials —
# `lapis-soft": "ultramarine-100"` in the old Ink-and-Ultramarine commits of 2026-09-28/29,
# which sit in history for ever. The value is a colour ramp name. Allowed only in that one
# file and only in the ramp-ref grammar, so a real key pasted into the file is still reported
# and the same text anywhere else is still reported; `cargo xtask ci supply-chain` plants both
# cases beside the allowed row.
[[allowlists]]
description = "Web palette ramp references"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/src/lib/palette\.ts$''']
regexTarget = "match"
regexes = ['''^"?lapis[a-z-]*": "[a-z]+(?:-[a-z]+)*-[0-9]{1,3}"$''']

# The pinned GPG key fingerprints of the package repositories the deploy scripts trust
# (DEC-822 item 3): a fingerprint is a public identifier of a public key, and the scripts stop if
# the downloaded key differs from it. Allowed only in the scripts that pin one and the test that
# checks the pin, and only in the `NAME_FINGERPRINT=<40 hex>` shape, so any other 40-hex string in
# those files, and the same text anywhere else, is still reported.
[[allowlists]]
description = "Pinned GPG key fingerprints in the deploy scripts"
targetRules = ["cloudflare-api-key", "generic-api-key"]
condition = "AND"
paths = ['''^deploy/(?:bootstrap\.sh|install-cloudflared\.sh|tests/test_invariants\.py)$''']
regexTarget = "match"
regexes = ['''^[A-Z_]*FINGERPRINT=[0-9A-F]{40}"?$''']

# The deploy invariant test names systemd unit files beside their settings (`owlhead-api.service`
# contains "api"), which the generic key heuristic reads as a key assignment. Allowed only in that
# test file and only in the `<unit>.service", "<Setting>=<word>` shape.
[[allowlists]]
description = "Systemd setting assertions in the deploy invariant test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^deploy/tests/test_invariants\.py$''']
regexTarget = "match"
regexes = ['''^[a-z-]+\.service", "[A-Za-z]+=(?:[A-Za-z0-9]*"|\\n)$''']
