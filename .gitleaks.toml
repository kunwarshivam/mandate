# Secret scanning (ADR-0001 ES-14). Extends the default rules with Alpaca key formats.

[extend]
useDefault = true

[[rules]]
id = "alpaca-key-id"
description = "Alpaca API key ID (live AK..., paper PK...)"
regex = '''\b(AK|PK)[A-Z0-9]{18}\b'''
keywords = ["ak", "pk"]

[[rules]]
id = "alpaca-secret"
description = "Alpaca API secret assigned to a variable"
regex = '''(?i)alpaca[a-z_]*secret[a-z_]*\s*[:=]\s*['"]?[A-Za-z0-9/+]{30,}'''
keywords = ["alpaca"]

# Alpaca pagination tokens in recorded fixtures are base64 of `SYMBOL|...|timestamp`, not
# credentials; the tests replay them to check pagination (E2-1, DEC-89). `condition = "AND"`
# allows a match only when both the path and the text match, so the same text in any other file
# is still reported; `cargo xtask ci supply-chain` plants cases that check this.
[[allowlists]]
description = "Alpaca page tokens in the recorded fixture pages"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^crates/mandate-marketdata/tests/fixtures/alpaca/[a-z0-9-]+/(?:page-[0-9]+\.json|requests\.txt)$''']
regexTarget = "match"
regexes = ['''^(?:next_page_token":"[A-Za-z0-9+/=]+"|page_token=[A-Za-z0-9+/%=]+)$''']

# The key-ID-shaped sentinel that the redaction test checks never reaches output (E2-1, DEC-89),
# allowed only in that test file.
[[allowlists]]
description = "Redaction test sentinel"
targetRules = ["alpaca-key-id"]
condition = "AND"
paths = ['''^crates/mandate-marketdata/tests/http\.rs$''']
regexTarget = "match"
regexes = ['''^PKSENTINELKEYID00000$''']

# The trading redaction test sentinel comment above — recorded fixtures deliberately not
# allowlisted — applies here too: nothing under `web/` is allowlisted wholesale.

# The key-ID-shaped sentinel the trading connector's redaction tests check never reaches output
# (E7-2, DEC-133), allowed only in the file that defines it. It is a planted test value, never a
# credential and never a recording: the recorded fixtures under
# `crates/mandate-alpaca/tests/fixtures/` are deliberately **not** allowlisted, so a real key that
# reached one would still be reported.
[[allowlists]]
description = "Trading redaction test sentinel"
targetRules = ["alpaca-key-id"]
condition = "AND"
paths = ['''^crates/mandate-alpaca/tests/common/mod\.rs$''']
regexTarget = "match"
regexes = ['''^PKSENTINELTRADING000$''']

# Amazon's published example access key ID, from the worked SigV4 examples of the S3
# documentation, which the object store's signer is tested against (E21-40, DEC-973). It matches the
# Alpaca key-ID shape. Allowed only as that exact value and only in the signer's test file, so a
# real key there, or the example anywhere else, is still reported.
[[allowlists]]
description = "Amazon's documented SigV4 example key ID"
targetRules = ["alpaca-key-id"]
condition = "AND"
paths = ['''^crates/mandate-objectstore/tests/sigv4\.rs$''']
regexTarget = "match"
regexes = ['''^AKIAIOSFODNN7EXAMPLE$''']

# The web palette's `lapis` token rows (DEC-204 to DEC-217): `lapis` contains "api", so the
# generic key heuristic reads the design-source table's quoted ramp refs as credentials —
# `lapis-soft": "ultramarine-100"` in the old Ink-and-Ultramarine commits of 2026-09-28/29,
# which sit in history for ever. The value is a colour ramp name. Allowed only in that one
# file and only in the ramp-ref grammar, so a real key pasted into the file is still reported
# and the same text anywhere else is still reported; `cargo xtask ci supply-chain` plants both
# cases beside the allowed row.
[[allowlists]]
description = "Web palette ramp references"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/src/lib/palette\.ts$''']
regexTarget = "match"
regexes = ['''^"?lapis[a-z-]*": "[a-z]+(?:-[a-z]+)*-[0-9]{1,3}"$''']

# The pinned GPG key fingerprints of the package repositories the deploy scripts trust
# (DEC-822 item 3): a fingerprint is a public identifier of a public key, and the scripts stop if
# the downloaded key differs from it. Allowed only in the scripts that pin one and the test that
# checks the pin, and only in the `NAME_FINGERPRINT=<40 hex>` shape, so any other 40-hex string in
# those files, and the same text anywhere else, is still reported.
[[allowlists]]
description = "Pinned GPG key fingerprints in the deploy scripts"
targetRules = ["cloudflare-api-key", "generic-api-key"]
condition = "AND"
paths = ['''^deploy/(?:bootstrap\.sh|install-cloudflared\.sh|tests/test_invariants\.py)$''']
regexTarget = "match"
regexes = ['''^[A-Z_]*FINGERPRINT=[0-9A-F]{40}"?$''']

# The deploy invariant test names systemd unit files beside their settings (`owlhead-api.service`
# contains "api"), which the generic key heuristic reads as a key assignment. Allowed only in that
# test file and only in the `<unit>.service", "<Setting>=<word>` shape.
[[allowlists]]
description = "Systemd setting assertions in the deploy invariant test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^deploy/tests/test_invariants\.py$''']
regexTarget = "match"
regexes = ['''^[a-z-]+\.service", "[A-Za-z]+=(?:[A-Za-z0-9]*"|\\n)$''']

# The API server's process test names its workspace and organization settings beside their
# ULIDs (`MANDATE_API_WORKSPACE` contains "api"), which the generic key heuristic reads as a key
# assignment (E21-31, DEC-978 item 8). A ULID is an opaque public identifier. Allowed only in that
# test file and only in the `MANDATE_API_(WORKSPACE|ORG)", "<ULID>"` shape, so any other value
# there, and the same text anywhere else, is still reported.
[[allowlists]]
description = "Workspace and organization ULID settings in the API server's process test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^crates/mandate-api-server/tests/process\.rs$''']
regexTarget = "match"
regexes = ['''^MANDATE_API_(?:WORKSPACE|ORG)", "[0-7][0-9A-HJKMNP-TV-Z]{25}"$''']

# The cell test's stand-in for the label values the deployment manager's adapter adds to a pod
# template (E21-33, DEC-1170): fixed hex placeholders for a workspace and a subject key, which are
# label values, not credentials. Allowed only in that test file and only for those two labels with
# those two values, so any other value there, and the same text anywhere else, is still reported.
[[allowlists]]
description = "Deployment manager label placeholders in the cell test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^deploy/tests/test_cell\.py$''']
regexTarget = "match"
regexes = ['''(?:workspace-key": "0123456789abcdef|subject-key": "fedcba9876543210)"?$''']

# Test-fixture values that the generic key heuristic reads as credentials. The whole-tree scan of
# the nightly found them (DEC-2603); a pull request's scan reads only its own commits, and a
# `web/`-only change skips it. Each entry allows one exact value or shape in one file only, so a
# real key there, or the same text anywhere else, is still reported; `cargo xtask ci supply-chain`
# plants each case beside a near miss and a stray copy.

# An agent id the web test asks the API about and expects to be unknown: `agt_` and a ULID, an
# opaque public identifier.
[[allowlists]]
description = "Unknown-agent id in the API screens test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/src/components/api-screens/api-screens\.test\.tsx$''']
regexTarget = "match"
regexes = ['''^ApiAgent agentId="agt_[0-9A-HJKMNP-TV-Z]{26}"$''']

# The push tests' fake browser subscription: the Web Push documentation's example `auth` secret
# and a VAPID application server key, which is a public key by design. Allowed only as those exact
# values and only in the two push test files.
[[allowlists]]
description = "Web Push example subscription values in the push tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/src/(?:components/notifications/push-section\.test\.tsx|lib/push/subscribe\.test\.ts)$''']
regexTarget = "match"
regexes = [
  '''^VAPID = "BP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A8"$''',
  '''^auth: "BTBZMqHH6r4Tts7J_aSIgg"$''',
]

# The cell tests' placeholder API image tag: `api:` and twelve fixed hex digits, an image
# reference, not a credential. Allowed only as that exact tag, and only in the cell module and the
# OAuth fixture's chart test, which plants it as a wrong image.
[[allowlists]]
description = "Placeholder API image tag in the cell tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^xtask/src/cell\.rs$''', '''^deploy/tests/test_oauth_fixture\.py$''']
regexTarget = "match"
regexes = ['''^api:0123456789ab"$''']

# The step-up and passkey challenge examples' `webauthn_challenge` values (E9-4, DEC-2103 item 9;
# DEC-2632): fixed base64url strings of 32 example bytes and the malformed variants the invalid
# cases refuse, not credentials (a WebAuthn challenge is public by design). Allowed only as those
# exact values and only in the challenge responses' and the registration challenge's example files,
# so another value there, or the same value anywhere else, is still reported.
[[allowlists]]
description = "Example WebAuthn challenges in the step-up, passkey and reduction-session challenge examples"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^schemas/workspace-api/examples/commands\.(?:step-up-challenge|passkey-registration-challenge|reduction-session-challenge)(?:\.valid|\.invalid)?\.json$''']
regexTarget = "match"
regexes = ['''^webauthn_challenge": "(?:q83vEjRWeJCrze8SNFZ4kKvN7xI0VniQq83vEjRWeJ(?:A=?|B)|q83vEjRWeJCrze8SNFZ4kKvN7xI0VniQq83vEjRWe\+A|q83vEjRWeJCrze8SNFZ4kKvN7xI0VniQq83vEjRWeA|q83vEjRWeJCrze8SNFZ4kA)"$''']

# The passkey enrolment examples' `authenticator_data` values and the `credential` and
# `public_key` sentinels the journal reference cases, the vault fixture and the API examples use
# (DEC-2632): fixed base64url and base64 strings of a made-up attestation object and 16 example
# credential bytes, not credentials. A passkey's credential id and public key are public by design
# (identity spec §7.2). Allowed only as those exact values and only in the files that show a
# passkey's enrolment, so another value there, or the same value anywhere else, is still reported.
# A connect start's, a version confirmation's, a resume's, a Stop's, an acknowledgment request's and an acknowledgment's (DEC-2144)
# `step_up_assertion` examples and the decoder's tests carry the same kind of made-up authenticator data (E9-4, DEC-2126, DEC-2128, DEC-2140; allowlisted
# as DEC-89 allows a fixture): synthetic
# WebAuthn test bytes, composed by hand as SHA-256("localhost") as the RP ID hash, the flags 0x05
# and a 4-byte counter, never taken from a credential. Each file is named by its exact path, in the
# JSON form and the Rust struct-literal form.
[[allowlists]]
description = "Example passkey credentials and authenticator data"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^schemas/workspace-api/examples/(?:commands\.passkey-enrol-request(?:\.valid|\.invalid)?|commands\.reduction-session-request(?:\.valid|\.invalid)?|envelope(?:\.valid|\.invalid)?)\.json$''',
  '''^schemas/workspace-api/examples/commands\.oauth-start-request\.json$''',
  '''^schemas/workspace-api/examples/commands\.oauth-start-request\.valid\.json$''',
  '''^schemas/workspace-api/examples/commands\.oauth-start-request\.invalid\.json$''',
  '''^schemas/workspace-api/examples/commands\.confirm-request\.valid\.json$''',
  '''^schemas/workspace-api/examples/commands\.confirm-request\.invalid\.json$''',
  '''^schemas/workspace-api/examples/commands\.resume-request\.valid\.json$''',
  '''^schemas/workspace-api/examples/commands\.resume-request\.invalid\.json$''',
  '''^schemas/workspace-api/examples/commands\.stop-request\.valid\.json$''',
  '''^schemas/workspace-api/examples/commands\.stop-request\.invalid\.json$''',
  '''^crates/mandate-api/tests/step_up_assertion\.rs$''',
  '''^crates/mandate-api/tests/acknowledge_request\.rs$''',
  '''^schemas/workspace-api/examples/commands\.acknowledge-request\.json$''',
  '''^schemas/workspace-api/examples/commands\.acknowledgment-request-request\.json$''',
  '''^docs/specs/reference-cases/journal\.yaml$''',
  '''^fixtures/refcases/journal\.json$''',
  '''^reference/journal/credentials\.py$''',
]
regexTarget = "match"
regexes = [
  '''^authenticator_data": "SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAABw"$''',
  '''^authenticator_data": "SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAAAQ(?:==)?"$''',
  '''^authenticator_data"?: "SZYN5YgOjGh0NBcPZHZgW4_krrmihjLHmVzzuoMdl2MFAAAACQ"$''',
  '''^credential: (?:AAECAwQFBgcICQoLDA0ODw|EBESExQVFhcYGRobHB0eHw)$''',
  '''^credential": "(?:AAECAwQFBgcICQoLDA0ODw|EBESExQVFhcYGRobHB0eHw)"$''',
  '''^(?:CREDENTIAL|OTHER_CREDENTIAL) = "(?:AAECAwQFBgcICQoLDA0ODw|EBESExQVFhcYGRobHB0eHw)"$''',
]

# The stub issuer's stand-in OAuth secret and the one value its test varies it to (E10-13,
# DEC-2625): `secret-canary-...`, a literal that exists only so a wrong client secret can be
# refused, not a credential. The generic key heuristic reads the `"client_secret", "<value>"` pair
# as an assignment. Allowed only as that exact value and only in that test file, so a real secret
# there, or the same text anywhere else, is still reported.
[[allowlists]]
description = "Stub issuer's wrong-secret canary"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^crates/mandate-stub-issuer/tests/alpaca\.rs$''']
regexTarget = "match"
regexes = ['''^client_secret", "secret-canary-9f2b"$''']

# Cargo's build output at the workspace root. CI restores `target/` from its cache before
# `cargo xtask ci full`, and on a push to `main` the scan is `gitleaks dir .`, which walks it: a
# dependency's compiled test vectors there (p256's private-key example, in its `.rmeta`) are
# reported though no source holds them. Only the root `target/` is allowed, never a `target`
# directory elsewhere or a name that merely starts with it; `cargo xtask ci supply-chain` plants
# both beside the allowed one.
[[allowlists]]
description = "Cargo's build output at the workspace root"
paths = ['''^target/''']
