# CodeQL configuration for the "CodeQL Advanced" workflow (DEC-500).
name: "mandate CodeQL config"

query-filters:
  # rust/cleartext-logging classifies data as sensitive by name: anything matching `acc(ou)?nt`
  # is "account info" and anything matching `trusted` is a "secret". In a brokerage-account
  # journal those words name the domain, so the rule raised 110 alerts on main, every one a
  # false positive (DEC-500 lists them). Credentials are kept out of logs by the vault and by
  # AGENTS.md rules 6 and 7, not by this query.
  - exclude:
      id: rust/cleartext-logging

# Published cryptographic test vectors (DEC-794): RFC 8291 §5 and Appendix A, and RFC 8188 §3.1's
# keys, salts and messages, which the web push tests reproduce byte-exact. They are never used
# outside tests: only `crates/mandate-webpush/src/tests.rs` includes this directory, and its test
# `no_product_code_reaches_the_rfc_vectors` fails if the crate's product files name it. Only this
# one directory is ignored; every query still runs on every other path.
paths-ignore:
  - crates/mandate-webpush/tests/vectors
