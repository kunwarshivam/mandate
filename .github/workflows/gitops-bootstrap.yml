# The founder's one bootstrap of a hosted cluster, and its workload secrets (E21-56, DEC-2015,
# DEC-2018; the runbook is deploy/gitops/README.md). It runs only when dispatched from `main`, and
# only under the chosen environment's GitHub environment (`staging` or `production`), whose
# required reviewer is the founder. Only that environment holds the cluster's kubeconfig and the
# workload secrets, and GitHub hands them only to a job that reviewer approved. No pull request and
# no push can start it (ES-12, the web-deploy.yml pattern, DEC-1005). `cargo xtask gitops` refuses to
# run anywhere but here, and agents never dispatch it. `bootstrap` installs Flux's three
# controllers, pinned by digest, writes the workload secrets, and applies the environment's
# sync.yaml; from then on Flux reconciles deploy/gitops/clusters/<environment> from `main`.
# `secrets` writes the workload secrets alone, to set or rotate them.
name: gitops-bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The hosted cluster
        required: true
        type: choice
        options: [staging, production]
      action:
        description: bootstrap (Flux, the secrets and sync.yaml) or secrets (the secrets alone)
        required: true
        type: choice
        options: [bootstrap, secrets]

permissions: {}

concurrency:
  group: gitops-bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

env:
  FLUX_VERSION: "2.9.6"
  FLUX_SHA256: "b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5"
  KUBECTL_VERSION: "1.35.9"
  KUBECTL_SHA256: "3cfeaf80be482b435b0aa214aff6e0b2c312ee23c0ff20810c75517b6004c6eb"

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install flux and kubectl (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o flux.tgz "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_SHA256}  flux.tgz" | sha256sum --check
          tar xzf flux.tgz flux
          sudo install flux /usr/local/bin/ && rm flux flux.tgz
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check
          sudo install kubectl /usr/local/bin/ && rm kubectl
      - name: Bootstrap the cluster
        if: inputs.action == 'bootstrap'
        env:
          GITOPS_ENVIRONMENT: ${{ inputs.environment }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          JOURNAL_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.JOURNAL_ARCHIVE_ACCESS_KEY_ID }}
          JOURNAL_ARCHIVE_SECRET_KEY: ${{ secrets.JOURNAL_ARCHIVE_SECRET_KEY }}
          CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
        run: cargo xtask gitops bootstrap
      - name: Write the workload secrets
        if: inputs.action == 'secrets'
        env:
          GITOPS_ENVIRONMENT: ${{ inputs.environment }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          JOURNAL_ARCHIVE_ACCESS_KEY_ID: ${{ secrets.JOURNAL_ARCHIVE_ACCESS_KEY_ID }}
          JOURNAL_ARCHIVE_SECRET_KEY: ${{ secrets.JOURNAL_ARCHIVE_SECRET_KEY }}
          CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_TUNNEL_TOKEN }}
        run: cargo xtask gitops secrets
