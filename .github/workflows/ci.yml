# Per-PR checks (ADR-0001 ES-12, DEC-75, DEC-76, DEC-464). The required checks remain `fast` and
# `full`, and both are quick aggregates. `fast` is over `fast-lint` (lint and the spec guard), the
# four `fast-test` shards of the nextest run, `fast-pending` (pending tests, doctests and the
# rh-sim build's tests) and `fast-python` (pytest), which together run exactly `cargo xtask ci
# fast` (DEC-871), and `fast-rh-sim-live`, the runner's tests in the `live,rh-sim` build, which no
# `cargo xtask` group runs (DEC-964). `full` is
# over the non-mutation full checks (`full-checks`, `full-checks-2` and `full-checks-3`, DEC-2334), the mutation plan, every deterministic mutation shard the plan
# sized to the diff (DEC-538), and the workspace API schemas' mutation sweep (DEC-688). Run
# `cargo xtask check` locally for the same complete set, unsharded. main itself is covered by the
# nightly workflow, which dispatches this workflow on main every night (DEC-1190).
# DEC-1190 scopes the jobs to the diff: `select` runs `cargo xtask ci select`, which takes the
# changed paths, the crates owning them or naming them in their sources, and every crate built on
# those, and says which jobs the diff needs. `fast-test`, `fast-pending`, `fast-python`,
# `fast-portable`, `fast-rh-sim-live`, `full-checks`, `full-checks-2`, `full-checks-3`, `schema-mutants` and the ten cell jobs
# (DEC-2609: a crate the cell's images hold or are built on, or `deploy/` and the cell's Python
# pins) start only when it says so, and inside them xtask runs only the selected crates' tests. `fast-lint`, the mutation plan
# and its shards run on every ready pull request as before. A build input, CI, xtask, any
# manifest, an unknown path, and a run with no diff base select everything. A skipped job starts
# no runner; `fast` and `full` still pass or fail, and accept a skip only where `select` asked for
# it, printing its reasons in their summaries. A documentation-only change still takes the short
# path in `fast-lint` (DEC-112): no toolchain, just typos, the spec guard, and the trailer check
# (`.github/scripts/docs-checks.sh`). So does a change that touches only documentation and
# `web/`, whose checks run in `web.yml` (DEC-200).
# Every diff-based check compares against the first parent of the merge commit a `pull_request`
# run checks out, main's tip the PR was merged onto: xtask's `choose_base` and
# `.github/scripts/base-ref.sh` read `GITHUB_EVENT_NAME` for it, and `fetch-depth: 0` keeps both
# parents. The PR's `base.sha` is not the base: main's changes since it would count as the PR's.
# `MANDATE_BASE_REF` stays an override for local runs and is not set here.
name: ci

# A draft runs nothing (DEC-610): every job is skipped while the pull request is a draft, so the
# runs a builder's draft pushes start no runner and cannot crowd out a ready pull request's. The
# run that judges a pull request is the one marking it ready starts (`ready_for_review`) or a later
# push to it. `fast` and `full` are skipped too, not failed, and `merge-approved.sh` accepts only a
# run in which both actually ran and passed, so a skipped run on a draft never counts as green.
# `workflow_dispatch` has no pull request, so it always runs.
# DEC-2610: every push to `main` runs it too, after the merge, since merges no longer wait for
# CI. A run on `main`'s tip has no diff base, so it selects everything, as the nightly's dispatch
# does, and `report-main` opens an issue when it fails. `main`'s runs share one concurrency group:
# a run that has started finishes, and a burst of merges queues only its latest, which tests every
# one of them. A merge `merge.yml`
# makes with its own token starts no push run, so `merge.yml` dispatches this workflow then.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      post_merge:
        description: "A post-merge run on main, sent by merge.yml (DEC-2610)"
        type: boolean
        default: false

permissions: {}

# A pull request's runs share one group per ref, so a newer push cancels the older run. The
# post-merge runs on `main`, a push's and the ones `merge.yml` dispatches with `post_merge`, share
# one group too, but a newer one never cancels the run in progress: it waits, and replaces any run
# still waiting, so every burst of merges gets a verdict and only its latest waits. Any other
# dispatched run, the nightly's included, has a group of its own, so it is never cancelled and
# cancels nothing (DEC-2610).
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && !inputs.post_merge && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_MUTANTS_SHA256: "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  # The local cell's tools (D-4, DEC-969), pinned with .cursor/install.sh. k3d and kubeconform come
  # from their GitHub releases; helm publishes its binaries only on get.helm.sh (DEC-993 item 3).
  K3D_VERSION: "5.9.0"
  K3D_SHA256: "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0"
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  # Builds the hosted clusters' overlays offline for deploy/tests/test_gitops.py (E21-58, DEC-2017),
  # pinned with .cursor/install.sh.
  FLUX_VERSION: "2.9.6"
  FLUX_SHA256: "b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5"
  # The hosted environments' OpenTofu and tflint (E21-56, DEC-2012 item 2), pinned with
  # .cursor/install.sh and .github/workflows/infra.yml. tflint publishes only zip archives.
  TOFU_VERSION: "1.13.1"
  TOFU_SHA256: "378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69"
  TFLINT_VERSION: "0.64.0"
  TFLINT_SHA256: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537"

jobs:
  # DEC-1190. The affected-set selection every scoped job follows: one boolean a job, and the
  # one-line reasons `fast` and `full` print. It builds only xtask.
  select:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      python: ${{ steps.select.outputs.python }}
      portable: ${{ steps.select.outputs.portable }}
      rh_sim_live: ${{ steps.select.outputs.rh_sim_live }}
      full_checks: ${{ steps.select.outputs.full_checks }}
      schema_mutants: ${{ steps.select.outputs.schema_mutants }}
      cell: ${{ steps.select.outputs.cell }}
      cell_web: ${{ steps.select.outputs.cell_web }}
      reasons: ${{ steps.select.outputs.reasons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: select
      - name: Select the jobs this diff needs (DEC-1190)
        id: select
        run: cargo xtask ci select >> "$GITHUB_OUTPUT"

  # DEC-871. `fast`'s parts run in parallel jobs, so each stays under ten minutes (DEC-464):
  # `cargo xtask ci fast` in one job took 13 to 14.6 minutes. `fast-lint` runs lint and the spec
  # guard, and the documentation-only short path (DEC-112); the other jobs start only when `select`
  # says the diff needs them (DEC-1190).
  fast-lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_PR_BODY: ${{ github.event.pull_request.body }}
      MANDATE_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (DEC-112)
        id: change
        run: .github/scripts/docs-only.sh | tee -a "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        if: steps.change.outputs.docs_only == 'true'
        with:
          tool: typos@1.50.2
      - name: Documentation-only checks (typos, spec guard, trailers)
        if: steps.change.outputs.docs_only == 'true'
        run: .github/scripts/docs-checks.sh
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.change.outputs.docs_only != 'true'
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        if: steps.change.outputs.docs_only != 'true'
        with:
          tool: typos@1.50.2,shellcheck@0.11.0
      - name: Install actionlint (checksum-verified)
        if: steps.change.outputs.docs_only != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum --check
          tar xzf actionlint.tgz actionlint && sudo install actionlint /usr/local/bin/ && rm actionlint actionlint.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: steps.change.outputs.docs_only != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.change.outputs.docs_only != 'true'
        with:
          shared-key: fast-lint
      - run: cargo xtask ci lint
        if: steps.change.outputs.docs_only != 'true'
      - run: cargo xtask ci spec-guard
        if: steps.change.outputs.docs_only != 'true'

  # DEC-871, DEC-2325. The workspace's nextest run, in nextest's counted partitions: each shard builds every
  # test binary and runs its quarter of the tests, and together they run every test once. The shards
  # and `fast-pending` build the same test profile, so they share one cache, which only the first
  # shard saves.
  fast-test:
    name: fast-test (${{ matrix.shard }})
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146,typos@1.50.2,shellcheck@0.11.0
      - name: Install actionlint (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum --check
          tar xzf actionlint.tgz actionlint && sudo install actionlint /usr/local/bin/ && rm actionlint actionlint.tgz
      # xtask's own tests drive the whole mutation gate over a fixture repository, so the jobs that
      # run them need the tool the gate calls as well (DEC-139).
      - name: Install cargo-mutants (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fast-test
          save-if: ${{ matrix.shard == '1/4' }}
      - run: cargo xtask ci test-nextest
        env:
          MANDATE_TEST_PARTITION: ${{ matrix.shard }}

  # DEC-871. The pending tests (DEC-110, DEC-137), the doctests, and the `rh-sim` rehearsal
  # build's tests of `mandate-mcp` and `mandate-paper` (DEC-922, DEC-963): all need the test
  # profile the `fast-test` shards build, and run in seconds once it is built.
  fast-pending:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146,typos@1.50.2,shellcheck@0.11.0
      - name: Install actionlint (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum --check
          tar xzf actionlint.tgz actionlint && sudo install actionlint /usr/local/bin/ && rm actionlint actionlint.tgz
      # xtask's own tests drive the whole mutation gate over a fixture repository, so the jobs that
      # run them need the tool the gate calls as well (DEC-139).
      - name: Install cargo-mutants (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fast-test
          save-if: false
      - run: cargo xtask ci pending
      - run: cargo xtask ci test-doc
      - run: cargo xtask ci test-rh-sim

  # DEC-871. The Python tests, which took about two and a half minutes inside `test`; this job
  # builds only xtask.
  fast-python:
    needs: select
    if: needs.select.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fast-python
      # The workspace chart's invariants (deploy/tests/test_cell.py) render it with helm, and the
      # hosted overlays' (test_gitops.py) build them with flux and check them with kubeconform, so
      # the required `fast` check holds them; without the tools they would skip (DEC-993 item 10,
      # DEC-2017).
      - name: Install helm, flux and kubeconform (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o flux.tgz "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          echo "${FLUX_SHA256}  flux.tgz" | sha256sum --check
          tar xzf flux.tgz flux && sudo install flux /usr/local/bin/ && rm flux flux.tgz
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar xzf kubeconform.tgz kubeconform && sudo install kubeconform /usr/local/bin/ && rm kubeconform kubeconform.tgz
      - run: cargo xtask ci test-python
        env:
          MANDATE_CELL_HELM_REQUIRED: "1"
          MANDATE_GITOPS_REQUIRED: "1"

  # DEC-954. The runner on macOS, where the founder runs the CLIs: `cargo xtask ci portable`
  # lints `mandate-paper` and runs its core-dump hardening tests there, so a Linux-only call in it
  # fails the required `fast` check. A cross-check from Linux cannot build `ring`'s C for Apple
  # without the macOS SDK, so it runs on a macOS runner.
  fast-portable:
    needs: select
    if: needs.select.outputs.portable == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fast-portable
      - run: cargo xtask ci portable

  # DEC-964 (narrowing DEC-529 item 3). The runner's tests in the `live,rh-sim` build, the build
  # the R0 rehearsal runs: `rh-sim` wins over `live`, so it holds no Robinhood host and dials only
  # a loopback simulator (DEC-922), and a test in the suite pins that. The credential guard runs
  # first in the same shell and fails if any variable could carry a broker or data credential; no
  # step of this job may name a secret or the workflow's token. `cargo xtask live-feature` allows
  # exactly this run, in this job, besides its compile-only check. It is a job of its own, not a
  # step of `fast-pending`, so neither nears ten minutes (DEC-464).
  fast-rh-sim-live:
    needs: select
    if: needs.select.outputs.rh_sim_live == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fast-rh-sim-live
      - run: .github/scripts/no-credentials.sh && cargo nextest run --locked --no-tests=fail --package mandate-paper --features live,rh-sim

  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    # On a pull request it runs even when the run is cancelled, so a cancelled head fails rather
    # than reading skipped, which a required check counts as passing. Elsewhere a cancelled run
    # skips it, so the run ends at once and releases `main`'s group (DEC-2610 item 3).
    if: ${{ ((github.event_name == 'pull_request' && always()) || !cancelled()) && !github.event.pull_request.draft }}
    needs: [select, fast-lint, fast-test, fast-pending, fast-python, fast-portable, fast-rh-sim-live]
    # DEC-871, DEC-1190. The required `fast` verdict: `select` and `fast-lint` must succeed, and
    # each scoped part must have succeeded where `select` selected it and been skipped where it did
    # not; a matrix succeeds only when every shard did. A failed or cancelled part, a skip `select`
    # did not ask for, and a part that ran when it should not have all fail it. xtask's tests run
    # this script over every combination of the results and switches.
    steps:
      - name: Require the selection, lint and the spec guard, and every part the selection named
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          REASONS: ${{ needs.select.outputs.reasons }}
          TESTS_SELECTED: ${{ needs.select.outputs.tests }}
          PYTHON_SELECTED: ${{ needs.select.outputs.python }}
          PORTABLE_SELECTED: ${{ needs.select.outputs.portable }}
          RH_SIM_LIVE_SELECTED: ${{ needs.select.outputs.rh_sim_live }}
          LINT_RESULT: ${{ needs.fast-lint.result }}
          TEST_RESULT: ${{ needs.fast-test.result }}
          PENDING_RESULT: ${{ needs.fast-pending.result }}
          PYTHON_RESULT: ${{ needs.fast-python.result }}
          PORTABLE_RESULT: ${{ needs.fast-portable.result }}
          RH_SIM_LIVE_RESULT: ${{ needs.fast-rh-sim-live.result }}
        run: |
          printf 'Affected-set selection (DEC-1190): %s\n' "$REASONS" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SELECT_RESULT" = success
          test "$LINT_RESULT" = success
          test "$TESTS_SELECTED:$TEST_RESULT" = true:success || test "$TESTS_SELECTED:$TEST_RESULT" = false:skipped
          test "$TESTS_SELECTED:$PENDING_RESULT" = true:success || test "$TESTS_SELECTED:$PENDING_RESULT" = false:skipped
          test "$PYTHON_SELECTED:$PYTHON_RESULT" = true:success || test "$PYTHON_SELECTED:$PYTHON_RESULT" = false:skipped
          test "$PORTABLE_SELECTED:$PORTABLE_RESULT" = true:success || test "$PORTABLE_SELECTED:$PORTABLE_RESULT" = false:skipped
          test "$RH_SIM_LIVE_SELECTED:$RH_SIM_LIVE_RESULT" = true:success || test "$RH_SIM_LIVE_SELECTED:$RH_SIM_LIVE_RESULT" = false:skipped

  full-checks:
    needs: select
    if: needs.select.outputs.full_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      MANDATE_PG_REQUIRED: "1"
      MANDATE_OPENBAO_REQUIRED: "1"
      MANDATE_OPENBAO_ADDR: https://127.0.0.1:8200
      MANDATE_OPENBAO_CA: /tmp/openbao/ca.pem
      MANDATE_OPENBAO_OPERATOR_TOKEN_FILE: /tmp/openbao/token
      MANDATE_S3_URL: http://127.0.0.1:9000
      MANDATE_S3_ACCESS_KEY_ID: mandate-test
      MANDATE_S3_SECRET_ACCESS_KEY: mandate-test-only
      MANDATE_S3_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Postgres journal tests run here, not in `fast` (DEC-109): the supported version, ES-08.
      - name: Start PostgreSQL 18 (digest-pinned)
        run: .github/scripts/start-postgres.sh
      # mandate-vault's conformance suite against OpenBao in dev mode, fake secrets only (DEC-977).
      - name: Start OpenBao 2.7.1 (digest-pinned, dev mode)
        run: .github/scripts/start-openbao.sh
      # The object store's conformance suite runs here too (E21-40, DEC-973), as `objectstore`.
      - name: Start the S3 test store (digest-pinned)
        run: .github/scripts/start-minio.sh
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci refcases
      - run: cargo xtask ci postgres
      - run: cargo xtask ci openbao
      - run: cargo xtask ci objectstore

  # DEC-2334. The rest of `cargo xtask ci full`, which needs none of `full-checks`' services: the
  # OpenTofu checks and two of the release-profile builds. A full selection ran past ten minutes in
  # one job (DEC-464), so `full-checks`, this job and `full-checks-3` split `full`'s parts, each
  # once, and `full` needs all three. It starts exactly when `full-checks` does.
  full-checks-2:
    needs: select
    if: needs.select.outputs.full_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_TOFU_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny@0.20.2
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/ && rm gitleaks gitleaks.tgz
      # `tofu`, the credential-free checks of deploy/tofu/ (E21-56, DEC-2013): fmt, tflint,
      # validate, and `tofu test` against mocked providers. No step here holds a cloud credential.
      - name: Install OpenTofu and tflint (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o tofu.tgz "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          echo "${TOFU_SHA256}  tofu.tgz" | sha256sum --check
          tar xzf tofu.tgz tofu && sudo install tofu /usr/local/bin/ && rm tofu tofu.tgz
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum --check
          unzip tflint.zip tflint && sudo install tflint /usr/local/bin/ && rm tflint tflint.zip
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci reference
      - run: cargo xtask ci schemas
      - run: cargo xtask ci supply-chain
      - run: cargo xtask ci tofu
      - run: cargo xtask ci stub-release
      - run: cargo xtask ci exchange-release

  # DEC-2334, DEC-2338 item 5. The API server's release-profile build and its release `config`
  # tests, about five minutes on its own, which neither job above has room for under ten minutes
  # (DEC-464), and the role provisioner's release build, which refuses its fixture (DEC-2350),
  # under two more. It starts exactly when `full-checks` does.
  full-checks-3:
    needs: select
    if: needs.select.outputs.full_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci api-release
      - run: cargo xtask ci provisionerd-release

  # E21-36, E21-37 (DEC-993): the local cell on the runner. `cargo xtask ci cell` lints and renders
  # both charts, runs the chart's invariant tests, brings up a k3d cluster, installs the chart from
  # the image this change built, runs its drills (each again with its bug planted, which each
  # must catch, is `cell-seeded`'s; the journal's drills run in `cell-journal` and `cell-failover`, and the kill
  # switch's in `cell-kill-switch` and the executor's, the vault's and the token exchange's in `cell-executor`, `cell-vault` and `cell-exchange`, below); `cell demo --no-web`, an upgrade of every release in place, is `cell-upgrade`'s (DEC-464). Not yet in `full` (DEC-993 item 10); the chart's invariants are in
  # `fast-python`. It and the nine cell jobs below start only when `select` says the diff reaches
  # the cell (DEC-2609); main's nightly run has no diff base and runs all ten.
  cell:
    needs: select
    if: needs.select.outputs.cell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_CELL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install k3d, helm and kubeconform (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o k3d "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install k3d /usr/local/bin/ && rm k3d
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar xzf kubeconform.tgz kubeconform && sudo install kubeconform /usr/local/bin/ && rm kubeconform kubeconform.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cell
          cache-on-failure: true
      - run: cargo xtask ci cell

  # E21-54 (DEC-2002): the demo's scenario on the runner's cell. `cargo xtask ci cell-demo` brings
  # up the cell, runs every gesture of the demo's six steps that is on main and names each missing
  # link by its PR or story, then verifies the workspace's control stream. No required check needs
  # it; it keeps the ready steps green.
  cell-demo:
    needs: select
    if: needs.select.outputs.cell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_CELL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install k3d, helm and kubeconform (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o k3d "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install k3d /usr/local/bin/ && rm k3d
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar xzf kubeconform.tgz kubeconform && sudo install kubeconform /usr/local/bin/ && rm kubeconform kubeconform.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cell-demo
          cache-on-failure: true
      - run: cargo xtask ci cell-demo

  # E21-54 (DEC-2002, DEC-2609 item 5): the demo's scenario again, with its web gesture required.
  # `web/`'s tools are installed: `npm ci --ignore-scripts`, so no dependency's install script runs
  # in a job that runs cargo, and the Chromium headless shell of the Playwright the lockfile pins,
  # cached per that version as `web-e2e.yml` caches it. MANDATE_DEMO_WEB_REQUIRED
  # makes a machine without them fail the run, and MANDATE_CELL_REQUIRED an API that cannot be
  # asked, rather than either reading "not run". It holds no secret. Not required, as `cell-demo`
  # is not; it starts for the cell jobs' changes and for any change under `web/`. It restores
  # `cell-demo`'s cache and saves none of its own.
  cell-demo-web:
    needs: select
    if: needs.select.outputs.cell_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_CELL_REQUIRED: "1"
      MANDATE_DEMO_WEB_REQUIRED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Playwright version
        id: playwright
        working-directory: web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Chromium's libraries come from Ubuntu's archive. The runner also lists packages.microsoft.com,
      # which has answered 403 for noble; one failing source fails `apt-get update` and the install.
      - name: Drop the runner's Microsoft package source
        run: grep -rls 'packages\.microsoft\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ | tee /dev/stderr | xargs -r sudo rm -f
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Install k3d, helm and kubeconform (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o k3d "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install k3d /usr/local/bin/ && rm k3d
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar xzf kubeconform.tgz kubeconform && sudo install kubeconform /usr/local/bin/ && rm kubeconform kubeconform.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cell-demo
          save-if: false
          cache-on-failure: true
      - run: cargo xtask ci cell-demo
      # The web gesture's Playwright output when the job fails, so its cause can be read off the run
      # rather than off the runner. Only the log: the same directory holds next dev's throwaway TLS
      # key (DEC-2609 item 5).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cell-demo-web-playwright
          path: target/cell/web-gesture/playwright.log
          if-no-files-found: ignore
          retention-days: 7

  # E21-41 (DEC-1050 item 7): the journal's own drills on the same cell, in a job of their own so
  # each cell job stays within its ten minutes (DEC-464). `cargo xtask ci cell-journal` brings the
  # cell up and runs the `standby-down` and `archive` drills, plain and seeded. Not required, as
  # `cell` is not (DEC-993 item 10). It restores `cell`'s cache and saves none of its own.
  cell-journal:
    needs: select
    if: needs.select.outputs.cell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_CELL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install k3d, helm and kubeconform (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o k3d "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install k3d /usr/local/bin/ && rm k3d
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar xzf kubeconform.tgz kubeconform && sudo install kubeconform /usr/local/bin/ && rm kubeconform kubeconform.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cell
          save-if: false
          cache-on-failure: true
      - run: cargo xtask ci cell-journal

  # E21-41 (DEC-1050 item 7): the restart drill, which with a synchronous standby is a failover and
  # the old primary's rejoin, on its own cell so each cell job stays within ten minutes (DEC-464).
  # Not required, as `cell` is not. It restores `cell`'s cache and saves none of its own.
  cell-failover:
    needs: select
    if: needs.select.outputs.cell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_CELL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install k3d, helm and kubeconform (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o k3d "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install k3d /usr/local/bin/ && rm k3d
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum --check
          tar xzf kubeconform.tgz kubeconform && sudo install kubeconform /usr/local/bin/ && rm kubeconform kubeconform.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cell
          save-if: false
          cache-on-failure: true
      - run: cargo xtask ci cell-failover

  # E21-34 (DEC-2602): the kill-switch and admission drills, plain and seeded, on their own cell, so
  # `cell` stays within its ten minutes (DEC-464). Not required, as `cell` is not. It restores
  # `cell`'s cache and saves none of its own.
  cell-kill-switch:
    needs: select
    if: needs.select.outputs.cell == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_CELL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
