# Per-PR checks (ADR-0001 ES-12, DEC-75, DEC-76, DEC-464). The required checks remain `fast` and
# `full`. The latter is a quick aggregate over the non-mutation full checks, the mutation plan,
# every deterministic mutation shard the plan sized to the diff (DEC-538), and the workspace API
# schemas' mutation sweep (DEC-688). Run `cargo xtask check`
# locally for the same complete set, unsharded. main itself is covered by the nightly workflow.
# A documentation-only change takes the short path in both jobs (DEC-112): no toolchain, just
# typos, the spec guard, and the trailer check (`.github/scripts/docs-checks.sh`). So does a change
# that touches only documentation and `web/`, whose checks run in `web.yml` (DEC-200).
# Every diff-based check compares against the first parent of the merge commit a `pull_request`
# run checks out, main's tip the PR was merged onto: xtask's `choose_base` and
# `.github/scripts/base-ref.sh` read `GITHUB_EVENT_NAME` for it, and `fetch-depth: 0` keeps both
# parents. The PR's `base.sha` is not the base: main's changes since it would count as the PR's.
# `MANDATE_BASE_REF` stays an override for local runs and is not set here.
name: ci

# A draft runs nothing (DEC-610): every job is skipped while the pull request is a draft, so the
# runs a builder's draft pushes start no runner and cannot crowd out a ready pull request's. The
# run that judges a pull request is the one marking it ready starts (`ready_for_review`) or a later
# push to it. `fast` and `full` are skipped too, not failed, and `merge-approved.sh` accepts only a
# run in which both actually ran and passed, so a skipped run on a draft never counts as green.
# `workflow_dispatch` has no pull request, so it always runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_MUTANTS_SHA256: "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  fast:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MANDATE_PR_BODY: ${{ github.event.pull_request.body }}
      MANDATE_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (DEC-112)
        id: change
        run: .github/scripts/docs-only.sh | tee -a "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        if: steps.change.outputs.docs_only == 'true'
        with:
          tool: typos@1.50.2
      - name: Documentation-only checks (typos, spec guard, trailers)
        if: steps.change.outputs.docs_only == 'true'
        run: .github/scripts/docs-checks.sh
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.change.outputs.docs_only != 'true'
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        if: steps.change.outputs.docs_only != 'true'
        with:
          tool: cargo-nextest@0.9.146,typos@1.50.2,shellcheck@0.11.0
      - name: Install actionlint (checksum-verified)
        if: steps.change.outputs.docs_only != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum --check
          tar xzf actionlint.tgz actionlint && sudo install actionlint /usr/local/bin/ && rm actionlint actionlint.tgz
      # `test` runs xtask's own tests, and one of them drives the whole mutation gate over a fixture
      # repository, so this check needs the tool the gate calls as well (DEC-139).
      - name: Install cargo-mutants (checksum-verified)
        if: steps.change.outputs.docs_only != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: steps.change.outputs.docs_only != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.change.outputs.docs_only != 'true'
      - run: cargo xtask ci fast
        if: steps.change.outputs.docs_only != 'true'

  full-checks:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MANDATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      MANDATE_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (DEC-112)
        id: change
        run: .github/scripts/docs-only.sh | tee -a "$GITHUB_OUTPUT"
      - name: Documentation-only change
        if: steps.change.outputs.docs_only == 'true'
        run: echo "docs-only change; the fast job ran the documentation checks (DEC-112)"
      # The Postgres journal tests run here, not in `fast` (DEC-109): the supported version, ES-08.
      - name: Start PostgreSQL 18 (digest-pinned)
        if: steps.change.outputs.docs_only != 'true'
        run: .github/scripts/start-postgres.sh
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.change.outputs.docs_only != 'true'
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        if: steps.change.outputs.docs_only != 'true'
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.146
      - name: Install gitleaks (checksum-verified)
        if: steps.change.outputs.docs_only != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/ && rm gitleaks gitleaks.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: steps.change.outputs.docs_only != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.change.outputs.docs_only != 'true'
      - run: cargo xtask ci full
        if: steps.change.outputs.docs_only != 'true'

  # DEC-538. Sizes the mutation matrix to the diff: `cargo xtask ci mutants --plan` lists, without
  # building, exactly the mutants the gate would test (its own diff and listing code), and reports
  # the count and `min(192, count)` shard indices. A diff with no mutants, a documentation-only one
  # included (DEC-112), launches no shard at all.
  mutants-plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mutants: ${{ steps.plan.outputs.mutants }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (DEC-112)
        id: change
        run: .github/scripts/docs-only.sh | tee -a "$GITHUB_OUTPUT"
      - name: Install cargo-mutants (checksum-verified)
        if: steps.change.outputs.docs_only != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: steps.change.outputs.docs_only != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.change.outputs.docs_only != 'true'
      - name: Plan the mutation matrix
        id: plan
        env:
          DOCS_ONLY: ${{ steps.change.outputs.docs_only }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            echo "docs-only change; no mutation shard has source to test (DEC-112)"
            printf 'mutants=0\nshards=[]\ntotal=0\n' >> "$GITHUB_OUTPUT"
          else
            cargo xtask ci mutants --plan >> "$GITHUB_OUTPUT"
          fi

  # One shard per planned mutant up to DEC-498's 192, so each shard's slice is what it was with 192
  # (DEC-538). Skipped when the plan counted none; `full` accepts that skip only then.
  mutants:
    name: mutants (${{ matrix.shard }}/${{ needs.mutants-plan.outputs.total }})
    needs: mutants-plan
    if: needs.mutants-plan.outputs.mutants != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    # DEC-519. The database `full-checks` has, so a mutant in code only the Postgres tests reach is
    # judged by them rather than reported missed while they skip; required, so they fail rather than
    # skip if it is ever missing. No debuginfo: xtask sets the same two settings on every build the
    # gate makes, and setting them here as well puts them in rust-cache's key, so the dependencies
    # it restores were built the way the gate builds and are not rebuilt in every shard. The plan's
    # count goes with the shard, and xtask refuses a shard whose own listing disagrees (DEC-538).
    env:
      MANDATE_MUTANT_SHARD: ${{ matrix.shard }}/${{ needs.mutants-plan.outputs.total }}
      MANDATE_MUTANTS_PLANNED: ${{ needs.mutants-plan.outputs.mutants }}
      MANDATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      MANDATE_PG_REQUIRED: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start PostgreSQL 18 (digest-pinned)
        run: .github/scripts/start-postgres.sh
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146
      - name: Install cargo-mutants (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci mutants

  # DEC-688. The workspace API schemas' mutation sweep (`schemas/workspace-api/mutate_schemas.py`)
  # takes about seven minutes unsharded, so it runs here beside `full-checks`, which stays under ten
  # minutes (DEC-464), as three fixed shards of about two and a half to three minutes each; `full`
  # needs every one. Each shard runs the three checkers on the unmutated tree first; they alone
  # also run inside `full-checks`.
  schema-mutants:
    name: schema-mutants (${{ matrix.shard }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (DEC-112)
        id: change
        run: .github/scripts/docs-only.sh | tee -a "$GITHUB_OUTPUT"
      - name: Documentation-only change
        if: steps.change.outputs.docs_only == 'true'
        run: echo "docs-only change; the fast job ran the documentation checks (DEC-112)"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.change.outputs.docs_only != 'true'
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: steps.change.outputs.docs_only != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.change.outputs.docs_only != 'true'
      - run: cargo xtask ci schema-mutants
        if: steps.change.outputs.docs_only != 'true'
        env:
          MANDATE_SCHEMA_SHARD: ${{ matrix.shard }}

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [full-checks, mutants-plan, mutants, schema-mutants]
    # DEC-538. A plan of zero mutants launches no shard, so `mutants` is skipped, and that skip
    # passes only beside a plan that succeeded and reported zero. A failed or cancelled plan, a
    # count that is not a number, a skipped matrix beside a plan that counted mutants, and a matrix
    # that ran beside a plan of zero all fail. xtask's tests run this script over that table.
    # `schema-mutants` must succeed, which a matrix does only when every shard succeeded (DEC-688).
    steps:
      - name: Require every full check, the mutation plan, every shard it sized, and schema-mutants
        env:
          FULL_CHECKS_RESULT: ${{ needs.full-checks.result }}
          PLAN_RESULT: ${{ needs.mutants-plan.result }}
          PLANNED_MUTANTS: ${{ needs.mutants-plan.outputs.mutants }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
          SCHEMA_MUTANTS_RESULT: ${{ needs.schema-mutants.result }}
        run: |
          test "$FULL_CHECKS_RESULT" = success
          test "$SCHEMA_MUTANTS_RESULT" = success
          test "$PLAN_RESULT" = success
          case "$PLANNED_MUTANTS" in
            '' | *[!0-9]* | 0?*) exit 1 ;;
            0) test "$MUTANTS_RESULT" = skipped ;;
            *) test "$MUTANTS_RESULT" = success ;;
          esac
