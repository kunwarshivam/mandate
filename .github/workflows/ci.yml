      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cell
          save-if: false
          cache-on-failure: true
      - run: cargo xtask ci cell-upgrade

  # E21-51, DEC-2001 item 11. Cell #1's `cluster` step, the same code the founder runs against the
  # droplets, against a two-node k3d cluster: the namespace and its secrets, the pull secret on the
  # default service account, the CloudNativePG operator, journal-db and the workspace chart with
  # cell #1's values, the tunnel off. Not a required check; skipped for a documentation-only
  # change (DEC-112).
  hosted-k3d:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (DEC-112)
        id: change
        run: .github/scripts/docs-only.sh | tee -a "$GITHUB_OUTPUT"
      - name: Documentation-only change
        if: steps.change.outputs.docs_only == 'true'
        run: echo "docs-only change; nothing to bring up"
      - name: Install k3d and helm (checksum-verified)
        if: steps.change.outputs.docs_only != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o k3d "https://github.com/k3d-io/k3d/releases/download/v${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum --check
          sudo install k3d /usr/local/bin/ && rm k3d
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: steps.change.outputs.docs_only != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo xtask cell hosted
        if: steps.change.outputs.docs_only != 'true'

  # DEC-538. Sizes the mutation matrix to the diff: `cargo xtask ci mutants --plan` lists, without
  # building, exactly the mutants the gate would test (its own diff and listing code), and reports
  # the count, `min(192, ceil(count / k))` shard indices and `k`, the mutants a shard carries,
  # sized per package from the `mutant-costs` history and one without a clean one (DEC-2607). A
  # diff with no mutants, a documentation-only one included (DEC-112), launches no shard at all.
  mutants-plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # DEC-2607 item 3: the plan reads the `mutant-costs` history through the Actions API.
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      mutants: ${{ steps.plan.outputs.mutants }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
      per_shard: ${{ steps.plan.outputs.per_shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (DEC-112)
        id: change
        run: .github/scripts/docs-only.sh | tee -a "$GITHUB_OUTPUT"
      - name: Install cargo-mutants (checksum-verified)
        if: steps.change.outputs.docs_only != 'true'
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        if: steps.change.outputs.docs_only != 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.change.outputs.docs_only != 'true'
      - name: Plan the mutation matrix
        id: plan
        env:
          DOCS_ONLY: ${{ steps.change.outputs.docs_only }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            echo "docs-only change; no mutation shard has source to test (DEC-112)"
            printf 'mutants=0\nshards=[]\ntotal=0\nper_shard=1\n' >> "$GITHUB_OUTPUT"
          else
            cargo xtask ci mutants --plan >> "$GITHUB_OUTPUT"
          fi

  # Up to `k` planned mutants a shard, 192 shards at most (DEC-538, DEC-2607); at `k` of one each
  # shard's slice is what it was with 192. A shard of more than one stops 480 s after the gate
  # starts and fails if it has not finished (DEC-2607 item 5). Skipped when the plan counted none;
  # `full` accepts that skip only then.
  mutants:
    name: mutants (${{ matrix.shard }}/${{ needs.mutants-plan.outputs.total }})
    needs: mutants-plan
    if: needs.mutants-plan.outputs.mutants != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    # DEC-519. The database `full-checks` has, so a mutant in code only the Postgres tests reach is
    # judged by them rather than reported missed while they skip; required, so they fail rather than
    # skip if it is ever missing. No debuginfo, and `opt-level = 1`, which keeps cargo's debug
    # assertions and overflow checks, for everything but the packages a mutant rebuilds, which
    # xtask keeps at 0 (DEC-931): xtask sets the same settings on every build the gate makes, and
    # setting them here as well puts them in rust-cache's key, so the dependencies it restores
    # were built the way the gate builds and are not rebuilt in every shard. The plan's
    # count goes with the shard, and xtask refuses a shard whose own listing disagrees (DEC-538).
    env:
      MANDATE_MUTANT_SHARD: ${{ matrix.shard }}/${{ needs.mutants-plan.outputs.total }}
      MANDATE_MUTANTS_PLANNED: ${{ needs.mutants-plan.outputs.mutants }}
      MANDATE_MUTANTS_PER_SHARD: ${{ needs.mutants-plan.outputs.per_shard }}
      MANDATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      MANDATE_PG_REQUIRED: "1"
      MANDATE_OPENBAO_REQUIRED: "1"
      MANDATE_OPENBAO_ADDR: https://127.0.0.1:8200
      MANDATE_OPENBAO_CA: /tmp/openbao/ca.pem
      MANDATE_OPENBAO_OPERATOR_TOKEN_FILE: /tmp/openbao/token
      MANDATE_S3_URL: http://127.0.0.1:9000
      MANDATE_S3_ACCESS_KEY_ID: mandate-test
      MANDATE_S3_SECRET_ACCESS_KEY: mandate-test-only
      MANDATE_S3_REQUIRED: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start PostgreSQL 18 (digest-pinned)
        run: .github/scripts/start-postgres.sh
      - name: Start OpenBao 2.7.1 (digest-pinned, dev mode)
        run: .github/scripts/start-openbao.sh
      - name: Start the S3 test store (digest-pinned)
        run: .github/scripts/start-minio.sh
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146
      - name: Install cargo-mutants (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci mutants
      # DEC-2607 item 1: what this shard cost, kept whatever the gate concluded, for the history.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutant-cost-${{ matrix.shard }}
          path: target/mutant-cost.json
          if-no-files-found: ignore
          retention-days: 14

  # DEC-2607 item 2. Folds this run's shard records into the rolling `mutant-costs` history,
  # whatever the matrix concluded. It judges nothing, and neither `fast` nor `full` needs it.
  mutants-costs:
    needs: [mutants-plan, mutants]
    if: ${{ always() && needs.mutants-plan.result == 'success' && needs.mutants-plan.outputs.mutants != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: select
      - run: cargo xtask ci mutants-costs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutant-costs
          path: target/mutant-costs/mutant-costs.json
          retention-days: 14

  # DEC-688, DEC-1004, DEC-2637. The workspace API schemas' mutation sweep
  # (`schemas/workspace-api/mutate_schemas.py`) runs here beside `full-checks`, which stays under ten
  # minutes (DEC-464), as ten fixed shards of about 137 mutants, about six minutes each on the
  # slowest runner; `full` needs every one. Each shard runs the three checkers on the unmutated tree
  # first; they alone also run inside `full-checks`.
  schema-mutants:
    name: schema-mutants (${{ matrix.shard }})
    needs: select
    if: needs.select.outputs.schema_mutants == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/10", "1/10", "2/10", "3/10", "4/10", "5/10", "6/10", "7/10", "8/10", "9/10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci schema-mutants
        env:
          MANDATE_SCHEMA_SHARD: ${{ matrix.shard }}

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    # As `fast`: it runs on a cancelled pull request run, and a cancelled run elsewhere skips it.
    if: ${{ ((github.event_name == 'pull_request' && always()) || !cancelled()) && !github.event.pull_request.draft }}
    needs: [select, full-checks, full-checks-2, full-checks-3, mutants-plan, mutants, schema-mutants]
    # DEC-538. A plan of zero mutants launches no shard, so `mutants` is skipped, and that skip
    # passes only beside a plan that succeeded and reported zero. A failed or cancelled plan, a
    # count that is not a number, a skipped matrix beside a plan that counted mutants, and a matrix
    # that ran beside a plan of zero all fail. xtask's tests run this script over that table.
    # `schema-mutants` must succeed, which a matrix does only when every shard succeeded (DEC-688).
    # DEC-1190: `full-checks`, `full-checks-2`, `full-checks-3` (DEC-2334) and `schema-mutants` must have run and
    # succeeded where `select` selected them and been skipped where it did not, beside a `select`
    # that succeeded.
    steps:
      - name: Require the selection, every full check it named, the mutation plan, every shard it sized, and schema-mutants where named
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          REASONS: ${{ needs.select.outputs.reasons }}
          FULL_CHECKS_SELECTED: ${{ needs.select.outputs.full_checks }}
          SCHEMA_MUTANTS_SELECTED: ${{ needs.select.outputs.schema_mutants }}
          FULL_CHECKS_RESULT: ${{ needs.full-checks.result }}
          FULL_CHECKS_2_RESULT: ${{ needs.full-checks-2.result }}
          FULL_CHECKS_3_RESULT: ${{ needs.full-checks-3.result }}
          PLAN_RESULT: ${{ needs.mutants-plan.result }}
          PLANNED_MUTANTS: ${{ needs.mutants-plan.outputs.mutants }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
          SCHEMA_MUTANTS_RESULT: ${{ needs.schema-mutants.result }}
        run: |
          printf 'Affected-set selection (DEC-1190): %s\n' "$REASONS" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SELECT_RESULT" = success
          test "$FULL_CHECKS_SELECTED:$FULL_CHECKS_RESULT" = true:success || test "$FULL_CHECKS_SELECTED:$FULL_CHECKS_RESULT" = false:skipped
          test "$FULL_CHECKS_SELECTED:$FULL_CHECKS_2_RESULT" = true:success || test "$FULL_CHECKS_SELECTED:$FULL_CHECKS_2_RESULT" = false:skipped
          test "$FULL_CHECKS_SELECTED:$FULL_CHECKS_3_RESULT" = true:success || test "$FULL_CHECKS_SELECTED:$FULL_CHECKS_3_RESULT" = false:skipped
          test "$SCHEMA_MUTANTS_SELECTED:$SCHEMA_MUTANTS_RESULT" = true:success || test "$SCHEMA_MUTANTS_SELECTED:$SCHEMA_MUTANTS_RESULT" = false:skipped
          test "$PLAN_RESULT" = success
          case "$PLANNED_MUTANTS" in
            '' | *[!0-9]* | 0?*) exit 1 ;;
            0) test "$MUTANTS_RESULT" = skipped ;;
            *) test "$MUTANTS_RESULT" = success ;;
          esac

  # DEC-1190 item 5, DEC-2610. The nightly dispatches this workflow on main, and every push to main
  # (and every merge `merge.yml` makes) runs it there too, where `select` has no diff base and
  # selects everything; when that run fails, this opens an issue naming only the event, the run and
  # the verdicts, never a log line. A run cancelled by a newer one reports nothing, nor does a run
  # on any other branch.
  report-main:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && (needs.fast.result == 'failure' || needs.full.result == 'failure') }}
    needs: [fast, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed run on main (opaque)
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_RESULT: ${{ needs.fast.result }}
          FULL_RESULT: ${{ needs.full.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[].title' | grep -Fqx "ci on main failed at ${GITHUB_SHA}"; then
            echo "An open issue already reports ci on main failing at ${GITHUB_SHA}"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="ci on main failed at ${GITHUB_SHA}" -f body="The ${GITHUB_EVENT_NAME} ci run on main failed (fast ${FAST_RESULT}, full ${FULL_RESULT}): ${RUN_URL} (DEC-1190, DEC-2610)"
