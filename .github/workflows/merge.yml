# Merges a pull request once the coordinator has approved its head and CI is green (DEC-175).
# The coordinating agent approves only after the independent review passes (DEC-79): it writes
# `Coordinator-approved-head: <sha>` into the description and adds the `coordinator-approved`
# label. `.github/scripts/merge-approved.sh` re-checks everything against the pull request's
# current head before it merges, and does nothing otherwise, so this file only decides when to look:
# on the label, on a description edit (a new approved head), when the pull request leaves draft,
# whenever a `ci` or `web` run completes, and on a half-hourly sweep of every labelled pull request,
# so that an event GitHub drops (a pending run replaced in its concurrency group, mergeability
# still being computed) never leaves an approved pull request waiting for good.
# Nothing here checks out or runs the pull request's code: `pull_request_target`, `workflow_run`
# and `schedule` run this file and the script as they are on the default branch. A merge made
# here pushes to `main` with this workflow's own token, which starts no workflow, so after any
# merge it dispatches on `main` once each workflow a push to `main` would have started: `ci`, the
# post-merge run (DEC-2610), `release`, which publishes main's keyless-signed images and charts,
# and `web-deploy`, which deploys main's web app once its own switch is on (DEC-2651). The
# dispatches are their own job, `post-merge`, the only one holding `actions: write`.
name: merge

on:
  pull_request_target:
    types: [labeled, edited, ready_for_review]
  workflow_run:
    workflows: [ci, web]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"

permissions: {}

jobs:
  merge:
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.base.ref == 'main'
        && contains(github.event.pull_request.labels.*.name, 'coordinator-approved'))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request')
      || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_APPROVERS: ${{ vars.MERGE_APPROVERS || format('{0} kunwar-vp cursor', github.repository_owner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - name: Merge each approved pull request whose checks are green
        id: merge
        env:
          EVENT: ${{ github.event_name }}
          LABELED_PR: ${{ github.event.pull_request.number }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          if [ "$EVENT" = schedule ]; then
            prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
              --label coordinator-approved --json number --jq '.[].number')
          elif [ -n "$LABELED_PR" ]; then
            prs=$LABELED_PR
          else
            prs=$(jq -r '.[]' <<<"$RUN_PRS")
          fi
          failed=0
          merged=0
          for pr in $prs; do
            if out=$(.github/scripts/merge-approved.sh "$pr"); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              failed=1
            fi
            if printf '%s\n' "$out" | grep -q '^merged as '; then
              merged=1
            fi
          done
          if [ "$merged" = 1 ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$failed"

  # DEC-2610, DEC-2651: after a run that merged at least one pull request, even when another
  # failed to, dispatch `ci`, `release` and `web-deploy` on `main` once each, as a push would have
  # started them. `ci` and `release` get `post_merge`, which makes each run its push path: for
  # `release`, publishing and never the founder-signed path. `web-deploy` runs on every such merge,
  # not only one that touched `web/`: it deploys only `main`'s web, and only while
  # `WEB_DEPLOY_ENABLED` is on. It holds `actions: write` and nothing else, and runs no code.
  post-merge:
    needs: merge
    if: ${{ always() && needs.merge.outputs.merged == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch ci on main after this run's merges (DEC-2610)
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main -f "inputs[post_merge]=true"
      - name: Dispatch release on main after this run's merges (DEC-2651)
        if: ${{ !cancelled() }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" -f ref=main -f "inputs[post_merge]=true"
      - name: Dispatch web-deploy on main after this run's merges (DEC-2651)
        if: ${{ !cancelled() }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/web-deploy.yml/dispatches" -f ref=main
