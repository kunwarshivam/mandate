# Merges a pull request once the coordinator has approved its head and CI is green (DEC-175).
# The coordinating agent approves only after the independent review passes (DEC-79): it writes
# `Coordinator-approved-head: <sha>` into the description and adds the `coordinator-approved`
# label. `.github/scripts/merge-approved.sh` re-checks everything against the pull request's
# current head before it merges, and does nothing otherwise, so this file only decides when to look:
# on the label, on a description edit (a new approved head), when the pull request leaves draft, and
# whenever a `ci` or `web` run completes.
# Nothing here checks out or runs the pull request's code: `pull_request_target` and `workflow_run`
# run this file and the script as they are on the default branch.
name: merge

on:
  pull_request_target:
    types: [labeled, edited, ready_for_review]
  workflow_run:
    workflows: [ci, web]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.base.ref == 'main'
        && contains(github.event.pull_request.labels.*.name, 'coordinator-approved'))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: merge-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge each approved pull request whose checks are green
        env:
          LABELED_PR: ${{ github.event.pull_request.number }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          if [ -n "$LABELED_PR" ]; then
            prs=$LABELED_PR
          else
            prs=$(jq -r '.[]' <<<"$RUN_PRS")
          fi
          for pr in $prs; do
            .github/scripts/merge-approved.sh "$pr"
          done
