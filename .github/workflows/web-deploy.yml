# Deploys the web app to Cloudflare Workers from `main` only (E21-38, DEC-1005). This file and its
# one job are the only place the repository deploys: the job runs on a push to `main` that touches
# `web/` or this file, or on demand from `main`, and its `environment: production` is the only
# holder of the Cloudflare API token, an environment secret GitHub hands only to jobs on `main`.
# No pull-request job can reach it (ES-12): `web.yml` builds and dry-runs the same Worker with no
# credential. The build gets only the public `NEXT_PUBLIC_*` variables (DEC-823 item 5); the token
# and the account ID reach the deploy step alone, after the bundle is built, so neither can be
# inlined into it. `web/scripts/workers.mjs` checks this shape, and that nothing else deploys. The job
# is off until the repository variable `WEB_DEPLOY_ENABLED` is `true` (DEC-1005 item 7). The job
# restores and saves no cache, which pull request runs could share, and installs with
# `--ignore-scripts`, so no dependency's install script runs in the job that holds the token. It runs
# the `wrangler` that install put in `node_modules/.bin`, never `npx`, which fetches a package the
# lockfile does not hold instead of failing.
name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Off until the founder accepts DEC-1005 and sets the repository variable WEB_DEPLOY_ENABLED to
    # true: a job-level condition cannot read the environment's own variables, so it is the
    # repository's. While it is unset the job is skipped and nothing reads the token.
    if: github.ref == 'refs/heads/main' && vars.WEB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    # 15 minutes: the build takes about five; the cap clears a queue, not a hang.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run cf:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_OWLHEAD_EMAIL_SIGNIN: ${{ vars.NEXT_PUBLIC_OWLHEAD_EMAIL_SIGNIN }}
          # The public site and the one app origin that serves sign-in and every app screen (DEC-2405).
          NEXT_PUBLIC_OWLHEAD_SITE_ORIGIN: "https://owlhead.ai"
          NEXT_PUBLIC_OWLHEAD_APP_ORIGIN: "https://app.owlhead.ai"
          # The staging demo's cool-off waiver in the browser: until this instant the browser tries a
          # passkey still cooling off and the staging server judges it (DEC-2150). No later than the
          # ceiling in src/lib/cool-off-build.ts, which the build refuses past; E9-4's row removes it.
          NEXT_PUBLIC_OWLHEAD_STAGING_COOL_OFF_UNTIL: "2026-11-05T00:00:00Z"
      - run: node_modules/.bin/wrangler deploy --dry-run --outdir .wrangler/dry-run
      - run: node scripts/workers.mjs size .wrangler/dry-run
      - run: node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
