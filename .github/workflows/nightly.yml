# Nightly checks on main (ADR-0001 ES-11, ES-12, DEC-76): every per-PR job plus long fuzz seeds, the
# seeded-bug mutation check, and a full-history secret scan. Skipped when main has not changed
# since the last successful nightly, to save Actions minutes.
name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_MUTANTS_SHA256: "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e"

jobs:
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "main unchanged since the last successful nightly ($last); skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # 90 minutes: the 2026-09-30 run was cancelled at the old 30-minute cap mid
    # `cargo xtask ci nightly`, after DEC-253 extended the mutation gate to every
    # safety-critical crate (tool crates included) and the workspace grew by seven
    # crates; the cap must clear the workload, not cancel it (last full success
    # 2026-09-26).
    timeout-minutes: 90
    permissions:
      contents: read
    # The oldest Postgres the journal supports (ADR-0001 ES-08); per-PR `full` runs the newest.
    services:
      postgres:
        image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MANDATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      MANDATE_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny@0.20.2,cargo-nextest@0.9.146,typos@1.50.2
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/ && rm gitleaks gitleaks.tgz
      # xtask's own tests drive the mutation gate over a fixture repository, so the nightly test run
      # needs the tool the gate calls, as ci.yml's `fast` does (DEC-139).
      - name: Install cargo-mutants (checksum-verified)
        run: |
          curl -sSfL -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci nightly
