# The nightly checks on main (ADR-0001 ES-11, ES-12, DEC-76, DEC-1190). Pull requests run only
# the jobs their diff selects (DEC-1190), so every night main runs everything unselected:
# `dispatch-ci` starts the per-PR `ci` workflow on main, where `select` has no diff base and
# selects every crate and every job (all tests, `schema-mutants`, the macOS `portable` job), and
# that run opens an issue itself if it fails (`ci.yml`'s `report-main`). Beside it, this workflow
# runs the Postgres journal tests on the oldest supported version, the long fuzz seeds, the
# seeded-bug mutation check of the reference implementation and a full-history secret scan, and
# the whole-crate mutation sweep of every safety-critical crate, a seventh of it a day so every
# mutant is tested once a week, while most shared runners stay with pull requests
# (DEC-1190 item 5). A failure opens an issue naming only the run and the jobs. Weekly from
# DEC-256 until DEC-1190; skipped when main has not changed since the last successful run.
name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_MUTANTS_SHA256: "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e"

jobs:
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "main unchanged since the last successful nightly ($last); skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Every per-PR job, unscoped: `ci.yml` dispatched on main selects everything (DEC-1190).
  dispatch-ci:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch ci on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main

  # The oldest Postgres the journal supports (ADR-0001 ES-08); per-PR `full-checks` runs the newest.
  postgres-oldest:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MANDATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      MANDATE_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci postgres

  # Ten fuzz seeds of the mandate reference, its seeded-bug mutation check, and gitleaks over the
  # whole history (`cargo xtask ci nightly`).
  reference:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar xzf gitleaks.tgz gitleaks && sudo install gitleaks /usr/local/bin/ && rm gitleaks gitleaks.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: select
      - run: cargo xtask ci nightly

  # DEC-1190 item 5. Tonight's share of the whole-crate mutation sweep: the gate's own listing of
  # every safety-critical crate's source, cut into shards of at most eight mutants, of which the
  # shards whose index is today's (days since the Unix epoch) modulo the rotation run. It runs even
  # when main is unchanged, so no day's share is skipped and every shard runs once a rotation.
  sweep-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mutants: ${{ steps.plan.outputs.mutants }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install cargo-mutants (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: select
      - name: Read the clock
        id: clock
        run: echo "seconds=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Plan tonight's share of the sweep
        id: plan
        env:
          MANDATE_SWEEP_CLOCK: ${{ steps.clock.outputs.seconds }}
        run: cargo xtask ci sweep --plan >> "$GITHUB_OUTPUT"

  # One shard of tonight's share, as a per-PR mutation shard runs (DEC-519, DEC-931, DEC-538), at
  # most eight at a time so pull requests keep most of the shared runners.
  sweep:
    name: sweep (${{ matrix.shard }}/${{ needs.sweep-plan.outputs.total }})
    needs: sweep-plan
    if: needs.sweep-plan.outputs.shards != '[]' && needs.sweep-plan.outputs.shards != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.sweep-plan.outputs.shards) }}
    env:
      MANDATE_MUTANT_SHARD: ${{ matrix.shard }}/${{ needs.sweep-plan.outputs.total }}
      MANDATE_MUTANTS_PLANNED: ${{ needs.sweep-plan.outputs.mutants }}
      MANDATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      MANDATE_PG_REQUIRED: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start PostgreSQL 18 (digest-pinned)
        run: .github/scripts/start-postgres.sh
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest@0.9.146
      - name: Install cargo-mutants (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o cargo-mutants.tgz "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_MUTANTS_SHA256}  cargo-mutants.tgz" | sha256sum --check
          tar xzf cargo-mutants.tgz cargo-mutants && sudo install cargo-mutants /usr/local/bin/ && rm cargo-mutants cargo-mutants.tgz
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci sweep

  # Opens an issue when any nightly job fails or is cancelled, naming only the run and the jobs'
  # verdicts, never a log line (DEC-1190 item 5).
  report:
    needs: [changed, dispatch-ci, postgres-oldest, reference, sweep-plan, sweep]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed nightly (opaque)
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICTS: changed ${{ needs.changed.result }}, dispatch-ci ${{ needs.dispatch-ci.result }}, postgres-oldest ${{ needs.postgres-oldest.result }}, reference ${{ needs.reference.result }}, sweep-plan ${{ needs.sweep-plan.result }}, sweep ${{ needs.sweep.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[].title' | grep -Fqx "nightly failed at ${GITHUB_SHA}"; then
            echo "An open issue already reports the nightly failing at ${GITHUB_SHA}"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="nightly failed at ${GITHUB_SHA}" -f body="The nightly run on main failed (${VERDICTS}): ${RUN_URL} (DEC-1190)"
