# The release build (E21-8, DEC-972; infrastructure design §7.1 step 2, ES-14, ES-17), for amd64
# and arm64 (DEC-1060), each natively on runners of its own arch, never cross-built. For each arch,
# two jobs build the same commit with `cargo xtask release build`: on two runners, in two checkout
# paths, with no cache, so nothing one build left behind can reach the other. `compare` fails
# unless each arch's two builds printed the same digest of their SHA256SUMS, which lists every
# binary's SHA-256: one commit, byte-identical binaries. On `main` and on demand, each arch's
# `build-a` keeps its binaries, SHA256SUMS and SBOMs as `release-<commit>-<arch>`, and builds one
# image a binary (E21-35, DEC-971), signed by an ephemeral test key, and drills the start-up
# signature check on them: an unsigned and a wrongly signed image are refused outside dev and CI.
# Only a push to `main` publishes: each arch's `publish` job rebuilds, requires its `build-a`'s
# digest, pushes that arch's images to GHCR by digest, signs each keyless with the run's OIDC
# identity and attests its SBOM; then `publish-index` pushes and signs the multi-arch index a cell
# pulls on any arch, and the hosted clusters' charts (E21-58). A pull request that changes the
# release build runs the same builds and drills in `release-check.yml`, which keeps, publishes
# and signs nothing and holds no deploy gate, so this workflow, which holds one, runs only on
# `main` and on dispatch (leak-guard L12, DEC-2032; ES-12). On a
# manual dispatch from `main` only, `release-signing` waits for the founder to approve its
# `release-signing` environment, then signs each arch's binaries and SHA256SUMS with the release key
# that environment's secrets hold (DEC-2024, as the founder decided in DEC-2605 rows 8 and 9).
# Nothing here builds a feature, so no release build holds `live` (DEC-529 item 3).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A pull request's runs share one group, so a new push cancels the old run. Pushes to `main` share
# one group that cancels nothing: the running release finishes, and of the pushes behind it only
# the newest waits, so a burst of merges releases once, at the tip (DEC-2025). A manual dispatch
# has a group of its own, because its `release-signing` job can wait hours for the founder's
# approval and must not hold the pushes' releases behind it.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # helm for `publish-charts`, at ci.yml's pin (E21-58).
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"

jobs:
  build-a-amd64:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Not a required check (DEC-464's ten minutes bind those): one uncached three-binary musl
    # build took about three minutes on four cores, and a two-core runner may take twice that.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the release
        id: build
        run: cargo xtask release build dist | tee -a "$GITHUB_OUTPUT"
      - name: Build the images, signed by an ephemeral test key
        run: cargo xtask release images dist images --test-sign
      - name: Drill the start-up check on signed, unsigned and wrongly signed images
        run: cargo xtask release drill dist images
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}-amd64
          path: |
            dist/
            images/IMAGES
            images/images/
            images/signatures/
            images/test-key/cosign.pub
          if-no-files-found: error
          retention-days: 90

  build-b-amd64:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        shell: bash
        working-directory: elsewhere/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elsewhere/src
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the release again, elsewhere
        id: build
        run: cargo xtask release build out | tee -a "$GITHUB_OUTPUT"

  build-a-arm64:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    # Not a required check (DEC-464's ten minutes bind those): one uncached three-binary musl
    # build took about three minutes on four cores, and a two-core runner may take twice that.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the release
        id: build
        run: cargo xtask release build dist | tee -a "$GITHUB_OUTPUT"
      - name: Build the images, signed by an ephemeral test key
        run: cargo xtask release images dist images --test-sign
      - name: Drill the start-up check on signed, unsigned and wrongly signed images
        run: cargo xtask release drill dist images
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}-arm64
          path: |
            dist/
            images/IMAGES
            images/images/
            images/signatures/
            images/test-key/cosign.pub
          if-no-files-found: error
          retention-days: 90

  build-b-arm64:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    defaults:
      run:
        shell: bash
        working-directory: elsewhere/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elsewhere/src
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the release again, elsewhere
        id: build
        run: cargo xtask release build out | tee -a "$GITHUB_OUTPUT"

  # Runs whatever the builds did, so a failed or cancelled build fails this job rather than
  # skipping it.
  compare:
    needs: [build-a-amd64, build-b-amd64, build-a-arm64, build-b-arm64]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: A build did not finish
        if: needs.build-a-amd64.result != 'success' || needs.build-b-amd64.result != 'success' || needs.build-a-arm64.result != 'success' || needs.build-b-arm64.result != 'success'
        run: |
          echo "a release build of this commit did not succeed"
          exit 1
      - name: The two amd64 builds differ
        if: needs.build-a-amd64.outputs.digest == '' || needs.build-a-amd64.outputs.digest != needs.build-b-amd64.outputs.digest
        run: |
          echo "the two amd64 release builds of this commit differ, or one printed no digest; each build's log lists its SHA256SUMS and toolchain"
          exit 1
      - name: The two arm64 builds differ
        if: needs.build-a-arm64.outputs.digest == '' || needs.build-a-arm64.outputs.digest != needs.build-b-arm64.outputs.digest
        run: |
          echo "the two arm64 release builds of this commit differ, or one printed no digest; each build's log lists its SHA256SUMS and toolchain"
          exit 1
      - name: Each arch's two builds are identical
        run: echo "each arch's two release builds of this commit printed the same SHA256SUMS digest"

  # A push to main only: never a pull request, never a branch (ES-12, E21-35). Each arch publishes
  # from a runner of its own arch, and its rebuild must print its build-a's digest, so what is
  # published is what `compare` proved reproducible.
  publish-amd64:
    needs: [build-a-amd64, compare]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rebuild the release
        id: build
        run: cargo xtask release build dist | tee -a "$GITHUB_OUTPUT"
      - name: The rebuild differs from build-a
        if: steps.build.outputs.digest != needs.build-a-amd64.outputs.digest
        run: |
          echo "the publish job's rebuild is not the release build-a built and compare proved"
          exit 1
      - name: Publish this arch's images to GHCR, sign them keyless and attest their SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish dist published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ github.sha }}-amd64
          path: |
            published/PUBLISHED
            published/IMAGES
          if-no-files-found: error
          retention-days: 90

  publish-arm64:
    needs: [build-a-arm64, compare]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rebuild the release
        id: build
        run: cargo xtask release build dist | tee -a "$GITHUB_OUTPUT"
      - name: The rebuild differs from build-a
        if: steps.build.outputs.digest != needs.build-a-arm64.outputs.digest
        run: |
          echo "the publish job's rebuild is not the release build-a built and compare proved"
          exit 1
      - name: Publish this arch's images to GHCR, sign them keyless and attest their SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish dist published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ github.sha }}-arm64
          path: |
            published/PUBLISHED
            published/IMAGES
          if-no-files-found: error
          retention-days: 90

  # The one reference per binary a cell pulls on any arch: the index over every arch's image,
  # read back from the registry by digest only after every arch has published (DEC-1060).
  publish-index:
    needs: [publish-amd64, publish-arm64]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Push and sign the multi-arch index
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish-index published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ github.sha }}
          path: published/PUBLISHED
          if-no-files-found: error
          retention-days: 90
      - name: Install helm (checksum-verified)
        run: |
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o helm.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum --check
          tar xzf helm.tgz linux-amd64 && cat linux-amd64/helm > helm
          sudo install helm /usr/local/bin/ && rm -r helm helm.tgz linux-amd64
      # The hosted clusters' charts, packaged through their symlinks, pushed and signed by the
      # same identity as the images (E21-58, DEC-2015 item 3), after PUBLISHED is kept, so a chart
      # failure never loses the index's list; CHARTS names each chart's digest.
      - name: Push and sign the hosted clusters' charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish-charts published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charts-${{ github.sha }}
          path: published/CHARTS

  # The five jobs below run on a manual dispatch from `main` only, never on a push or a pull
  # request (DEC-2024, DEC-2026; DEC-2605 rows 8 and 9). `release-signing-build` rebuilds the release, requires
  # its build-a's digest, so what is signed is what `compare` proved reproducible, and hands `dist`
  # on. It holds no secret.
  release-signing-build:
    needs: [build-a-amd64, build-a-arm64, compare]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rebuild the release
        id: build
        run: cargo xtask release build dist | tee -a "$GITHUB_OUTPUT"
      - name: The rebuild differs from build-a
        if: steps.build.outputs.digest != needs[format('build-a-{0}', matrix.arch)].outputs.digest
        run: |
          echo "the signing build is not the release build-a built and compare proved"
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-to-sign-${{ github.sha }}-${{ matrix.arch }}
          path: |
            dist/SHA256SUMS
            dist/bin/
            dist/sbom/
          if-no-files-found: error
          retention-days: 1

  # The only job that reads a secret, and only once the founder, the `release-signing`
  # environment's required reviewer, approves the run. It checks out only `.github/scripts` and
  # runs no cargo and no xtask, so no build script or dependency runs beside the key:
  # `release-sign.sh` checks the handed-on release against build-a's digest, installs cosign pinned
  # by SHA-256, and signs in a clean environment. The key is single-line base64, so GitHub masks
  # it whole.
  release-signing:
    needs: [build-a-amd64, build-a-arm64, release-signing-build]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            cosign: https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
            cosign_sha256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          - arch: arm64
            runner: ubuntu-24.04-arm
            cosign: https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-arm64
            cosign_sha256: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-to-sign-${{ github.sha }}-${{ matrix.arch }}
          path: dist
      - name: Check the release against build-a, and sign each binary and SHA256SUMS
        env:
          DIGEST: ${{ needs[format('build-a-{0}', matrix.arch)].outputs.digest }}
          COSIGN_URL: ${{ matrix.cosign }}
          COSIGN_SHA256: ${{ matrix.cosign_sha256 }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          COSIGN_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: .github/scripts/release-sign.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signatures-${{ github.sha }}-${{ matrix.arch }}
          path: |
            dist/SHA256SUMS
            signatures/
          if-no-files-found: error
          retention-days: 90

  # Holds no secret: verifies every signature against the committed public half and runs the
  # signed mandate-agentd at tier `production`, so a key that is not the one RELEASE_KEYS compiles
  # in fails the run.
  release-signing-check:
    needs: [release-signing]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-to-sign-${{ github.sha }}-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signatures-${{ github.sha }}-${{ matrix.arch }}
          path: signed
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Verify the signatures and drill the signed release at tier production
        run: cargo xtask release check-signed dist signed/signatures

  # A hosted cell's images (DEC-2026): only once `release-signing-check` proved this run's
  # signatures. `publish-signed` verifies every signature against the committed public half again
  # before it builds or pushes anything, then pushes each image with its binary's release signature
  # as `signed-<commit>-<arch>`, signs it keyless and attests its SBOM. Neither job holds a release
  # secret: only the run's own token, as `publish` on a push.
  release-signing-publish:
    needs: [release-signing-check]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-to-sign-${{ github.sha }}-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signatures-${{ github.sha }}-${{ matrix.arch }}
          path: signed
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Publish this arch's release-signed images, sign them keyless and attest their SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish-signed dist signed/signatures signed-published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-published-${{ github.sha }}-${{ matrix.arch }}
          path: signed-published/PUBLISHED
          if-no-files-found: error
          retention-days: 90

  release-signing-publish-index:
    needs: [release-signing-publish]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Push and sign the release-signed multi-arch index
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish-signed-index signed-published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-published-${{ github.sha }}
          path: signed-published/PUBLISHED
          if-no-files-found: error
          retention-days: 90
