# The web app's cheap checks (DEC-200): the Impeccable detector, the founder's no-gradients rule,
# lint, the types, the unit suite, and the production build — about eight minutes on a pull
# request that touches `web/`, and what the DEC-175 merge gate reads as the `web` check. The
# Playwright suite moved to `web-e2e.yml` (DEC-256): it reads computed styles in Chromium against
# `next start`, which is what catches a gradient or mask painted from a stylesheet, but a 2-core
# runner needs about half an hour for it — more than a private repository's Actions minutes can
# afford on every push — so it runs weekly and on demand there, and the coordinator dispatches it
# on a branch before merging a risky web change. Until `web/package.json` exists every step after
# the checkout is skipped; `hashFiles` cannot gate the job itself, because a job-level `if` is
# evaluated before the checkout. The Impeccable detector (Apache-2.0, `docs/dependencies.md`)
# fails on any primary finding and reads `web/.impeccable/config.json` when it exists. It flags
# gradient text and AI-typical palettes but not a plain gradient, so the no-gradients rule has its
# own check. `npm run build` is the production build, and its postbuild checks fail if it contains
# the scenario switcher or takes a scenario.
name: web

on:
  pull_request:
    paths:
      - "web/**"
      - "vercel.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    # 15 minutes: the checks above take about eight; the cap clears a queue, not a hang.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      IMPECCABLE_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the web app
        id: app
        working-directory: .
        run: |
          if [ -f web/package.json ]; then echo "present=true"; else echo "present=false"; fi | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.app.outputs.present == 'true'
      - name: Impeccable detector (DEC-200)
        if: steps.app.outputs.present == 'true'
        run: npx --yes impeccable@4.1.0 detect src/
      - name: No gradients (DEC-200)
        if: steps.app.outputs.present == 'true'
        run: |
          if grep -rnEi 'gradient|bg-(linear|radial|conic)-' src/; then
            echo "gradients are not allowed in web/ (DEC-200, founder 2026-09-28)" >&2
            exit 1
          fi
      - run: npm run lint
        if: steps.app.outputs.present == 'true'
      - run: npm run typecheck
        if: steps.app.outputs.present == 'true'
      - run: npm test --if-present
        if: steps.app.outputs.present == 'true'
      # DEC-750: every pending test fails at its stub when un-skipped.
      - run: npm run pending
        if: steps.app.outputs.present == 'true'
      - run: npm run build
        if: steps.app.outputs.present == 'true'
