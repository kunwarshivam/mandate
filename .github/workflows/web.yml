# The web app's checks (DEC-200). Not a required check: `fast` and `full` take the short path for a
# change that touches only documentation and `web/` (DEC-112), and this workflow runs the web
# checks. Until `web/package.json` exists every step after the checkout is skipped; `hashFiles`
# cannot gate the job itself, because a job-level `if` is evaluated before the checkout.
# The Impeccable detector (Apache-2.0, `docs/dependencies.md`) fails on any primary finding and
# reads `web/.impeccable/config.json` when it exists. It flags gradient text and AI-typical palettes
# but not a plain gradient, so the founder's no-gradients rule (DEC-200) has its own check.
# That check reads source; the Playwright suite (`web/e2e/`) reads computed styles in Chromium
# against `next start`, which catches a gradient or mask Kumo paints from its own stylesheet.
# `npm run build` is the production build, and its postbuild checks fail if it contains the scenario
# switcher or takes a scenario. The suite then builds its own copy into `.next-e2e`, with the scenario
# switch on (`web/scripts/e2e-build.mjs`), and runs in light and dark: about 9 minutes on two workers.
# A second, short suite (`web/playwright.auth.config.ts`) builds with sign-in on against a stub Supabase
# address, into `.next-auth-e2e`, and checks what a signed-out visitor meets (DEC-211).
# Only the Chromium headless shell is installed, cached per Playwright version; on a cache hit
# only its system libraries are installed.
name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    # 40 minutes: the 2026-09-30 run on #364 was cancelled at the old 25-minute cap
    # while the e2e suite (grown by the W4 polish rounds) was still retrying. A clean
    # run fits well inside this; the cap clears the suite with retries, not cancels it.
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      IMPECCABLE_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the web app
        id: app
        working-directory: .
        run: |
          if [ -f web/package.json ]; then echo "present=true"; else echo "present=false"; fi | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.app.outputs.present == 'true'
      - name: Impeccable detector (DEC-200)
        if: steps.app.outputs.present == 'true'
        run: npx --yes impeccable@4.1.0 detect src/
      - name: No gradients (DEC-200)
        if: steps.app.outputs.present == 'true'
        run: |
          if grep -rnEi 'gradient|bg-(linear|radial|conic)-' src/; then
            echo "gradients are not allowed in web/ (DEC-200, founder 2026-09-28)" >&2
            exit 1
          fi
      - run: npm run lint
        if: steps.app.outputs.present == 'true'
      - run: npm run typecheck
        if: steps.app.outputs.present == 'true'
      - run: npm test --if-present
        if: steps.app.outputs.present == 'true'
      - run: npm run build
        if: steps.app.outputs.present == 'true'
      - name: Playwright version
        id: playwright
        if: steps.app.outputs.present == 'true' && hashFiles('web/playwright.config.ts') != ''
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        if: steps.playwright.outputs.version != ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Chromium's libraries come from Ubuntu's archive. The runner also lists packages.microsoft.com,
      # which has answered 403 for noble; one failing source fails `apt-get update` and the install.
      - name: Drop the runner's Microsoft package source
        if: steps.playwright.outputs.version != ''
        run: grep -rls 'packages\.microsoft\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ | tee /dev/stderr | xargs -r sudo rm -f
      - name: Install Chromium
        if: steps.playwright.outputs.version != '' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system libraries
        if: steps.playwright.outputs.version != '' && steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Computed styles in Chromium (DEC-200)
        if: steps.playwright.outputs.version != ''
        run: npm run test:e2e
      - name: Sign-in on, signed out (DEC-211)
        if: steps.playwright.outputs.version != '' && hashFiles('web/playwright.auth.config.ts') != ''
        run: npm run test:e2e:auth
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.playwright.outputs.version != ''
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
