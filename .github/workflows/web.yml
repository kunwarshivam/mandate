# The web app's checks (DEC-200). Not a required check: `fast` and `full` take the short path for a
# change that touches only documentation and `web/` (DEC-112), and this workflow runs the web
# checks. Until `web/package.json` exists every step after the checkout is skipped; `hashFiles`
# cannot gate the job itself, because a job-level `if` is evaluated before the checkout.
name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the web app
        id: app
        working-directory: .
        run: |
          if [ -f web/package.json ]; then echo "present=true"; else echo "present=false"; fi | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.app.outputs.present == 'true'
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.app.outputs.present == 'true'
      - run: npm run lint
        if: steps.app.outputs.present == 'true'
      - run: npm run typecheck
        if: steps.app.outputs.present == 'true'
      - run: npm test --if-present
        if: steps.app.outputs.present == 'true'
      - run: npm run build
        if: steps.app.outputs.present == 'true'
