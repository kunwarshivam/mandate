tamper_cases:
  - name: payload_modified
    change: "vector seq 2: payload.qty '10' -> '11' (stored hash unchanged)"
    expect: { verification: fail, first_failure: { seq: 2, check: rehash_mismatch } }
  - name: event_deleted
    change: "vector seq 2 removed"
    expect: { verification: fail, first_failure: { seq: 3, check: seq_gap } }
  - name: seq_values_swapped
    change: "the seq values of vectors 2 and 3 are swapped; all other bytes and stored hashes unchanged"
    expect: { verification: fail, first_failure: { seq: 2, check: rehash_mismatch } }
  - name: prev_hash_rewritten
    change: "vector seq 3: prev_hash replaced and its hash recomputed so it re-hashes correctly"
    expect: { verification: fail, first_failure: { seq: 3, check: prev_hash_mismatch } }
