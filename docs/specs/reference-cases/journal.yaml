- name: event_deleted
  change: row seq 3 deleted
  expect:
    seq: 4
    check: seq_gap
- name: seq_values_swapped
  change: the seq members inside bodies 2 and 3 are swapped; rows and columns stay in seq order
  expect:
    seq: 2
    check: column_mismatch
- name: prev_hash_changed_without_rehash
  change: 'seq 4: prev_hash replaced in body and column; stored hash unchanged'
  expect:
    seq: 4
    check: rehash_mismatch
- name: prev_hash_rewritten_and_rehashed
  change: 'seq 4: prev_hash replaced in body and column; hash recomputed'
  expect:
    seq: 4
    check: prev_hash_mismatch
- name: whitespace_inserted_and_rehashed
  change: 'seq 2: a space inserted after the opening brace of the body; hash recomputed'
  expect:
    seq: 2
    check: non_canonical
- name: column_altered
  change: 'seq 5: event_type column changed to ''FillReversed'''
  expect:
    seq: 5
    check: column_mismatch
