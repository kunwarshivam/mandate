# Test vectors for docs/specs/journal.md (spec v0.5) - version 3
#
# Implementations must reproduce, byte for byte:
# - `chain[].canonical`: the canonical body of `chain[].body` (UTF-8), and `chain[].hash` =
#   lowercase hex SHA-256 of those bytes; each body's `prev_hash` chains to the previous hash.
# - `export_line_seq_1`: the export line for seq 1 (the body is an exact byte slice of it).
# - `string_escaping.canonical_utf8_hex`: canonical bytes of `string_escaping.object`.
# - `merkle`: leaf hashes, root, and timestamp imprint.
# Decimal cases must normalize or reject exactly as listed. Tamper cases apply to the Postgres
# store (rows with columns) and give the expected first verification failure (spec §11). Append
# cases give the expected outcome (spec §5.1). Changing these vectors requires founder approval.
#
# `agent_stream` (spec §9.1, DEC-177) is generated by reference/journal/generate.py, which also
# checks it; edit the generator, never the section. Its `chain` follows the rules above, from the
# agent stream's `StreamOpened` at seq 1; `artifacts[].canonical` are the stored bytes of each
# `artifacts[].ref`, so the chain verifies with spec §11 check 6. Each `invalid_drafts` case is the
# draft of `chain[base_seq - 1].body` (without `seq`, `prev_hash`, `recorded_at`) with each change
# setting the dotted `path` to `value`; `append` refuses it as `Invalid` with the listed reason
# and path. `derivation` holds the inputs the `DecisionMade` numbers are recomputed from. The
# section is additive: `version` stays 3 until the harness reads it (DEC-177).

