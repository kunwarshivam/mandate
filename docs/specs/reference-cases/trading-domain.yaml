# Reference cases for docs/specs/trading-domain.md (spec v0.5)
#
# SCHEMA v3 - HARNESS RULES
#
# Values and comparison
# - Decimals are strings and compare by decimal value, not string form.
# - Keys absent from an `expect` block are not checked.
# - Expected values are cumulative since the start of the case.
# - Fee rates in `configs` are TEST VALUES ONLY, not current regulatory rates.
#
# Ordering and indices
# - Steps run in list order; the list index is the event sequence number.
# - `step_N` in `expect_overrides` is 1-based. Bar indices are 0-based.
#
# Time model
# - The harness emits only the events listed in the case. It never fires time-driven events on
#   its own, except that `advance_clock` emits every `SettlementPosted`, `DividendPaid`, and
#   `TradingDayStarted` due at or before its `at`, in due order.
# - `fees_charged`, corporate actions, and broker postings are explicit steps only.
#
# Simulated broker (executor and gate cases)
# - Confirms cancels and accepts submissions immediately, unless the case supplies a
#   `broker_order_update` for that order.
# - Account `buying_power` equals the model's buying power unless the case supplies it.
#
# Fixture defaults (apply unless the case supplies the field)
# - Instruments pass every §3.2 floor: absent `prior_close`, `median_dollar_volume_20d`, or
#   crypto volume fields pass; absent `leveraged_or_inverse` is false; absent `ipo` is false.
# - Account: `status: ACTIVE`, `crypto_status: ACTIVE`, flags false. The alpaca profile also
#   defaults `type: margin`, `multiplier: 1`, `regime: intraday_margin`.
# - Conduct-control volume checks pass; no concentration cap; agents: one agent `agent_a` whose
#   universe is every instrument in the case.
# - Gate cases assume a fresh, sane quote whose midpoint equals the order's limit price, unless
#   the step's `data.quote` supplies bid and ask (applies to that step only).
#
# Variants
# - `overrides.steps` replaces the case's steps. Other override keys merge into the case:
#   objects merge recursively; arrays of objects that have `id` or `name` merge by that key;
#   other arrays are replaced. `expect_overrides.step_N` merges into step N's expectation.
#
# Attribution of fills and broker events
# - A `fill` step is a Mandate-originated fill of the most recent approved order for that agent and
#   instrument (or its own order if none), unless `data.source: external`.
# - A `broker_order_update` with an unknown `client_order_id` is external activity only if it
#   carries a fill; unknown-ID rejects count only toward the 403 threshold (spec §7.3).
#
# Backtest fields
# - `decided_at`: decision time; eligibility starts at the first bar starting at or after it.
# - `resting_since_bar: N` / `resting_since: previous_trading_day`: the order was eligible before
#   that bar and is resting at its start, so the marketable-on-arrival test does not apply.
# - `first_bar_reference_volume`: the 20-session same-minute median for the session's first bar.
# - `initial_position`: position held when the order is simulated.
# - `isolation: per_order`: each order is simulated alone against the bars.
#
# Purposes and verdicts
# - `purpose` is the originating component's exit type; the gate still checks it against side and
#   position. `risk_exit` is exempt from every conduct control; `discretionary_exit` is paced and may
#   receive verdict `defer` (spec 9.6), never `deny`.
#
# Other rules
# - A fill without `client_order_id` is its own order (for per-order fee caps).
# - `non_marginable_buying_power` equals the model value unless supplied.
# - GTC expiry = creation date + 90 calendar days; `advance_clock` across a `TradingDayStarted`
#   that reaches the re-placement buffer triggers protective re-placement (spec §5.4).
# - Fee reservations are rounded per order (spec §2.1).
# - Reason codes follow the gate evaluation order in spec §9.1; the first failing check wins.
#
# EXPECTATION VOCABULARY
#   positions.<instrument>: {qty, cost_basis, avg_cost}
#   cash: {settled, unsettled: [{settles_on, amount}], total}
#   receivables            net signed (receivables minus payables)
#   fees: {accrued, charged, total_usd}   total_usd = charged + accrued + USD value of asset fees
#   realized_pnl_gross, realized_pnl_net, income, unrealized_pnl, equity, buying_power
#   marks.<instrument>     current mark after the step
#   decision: {verdict: allow|deny, reason_code}
#   orders.<name>: {state}
#   actions                ordered list of executor actions
#   agent_mode             normal | exits_only | paused | stopped
#   trade_date, settles_on, day_trade_count
#   fills: [{bar, qty, price, leg, liquidity}]      canceled_legs: [...]
#   conservation: {delta_equity, realized_gross, unrealized, income, fees}
#   reconciliation: {status, broker_qty_before_fee_posting, tolerance_qty}
#   protective_sell_qty
#
# Changing or adding a case requires founder approval.

schema_version: 3

configs:
  test_default:
    fees:
      effective_from: "2026-01-01"
      equities:
        sec_rate: "0.00003"            # test value
        taf_per_share: "0.0002"        # test value
        taf_cap: "9.79"                # test value
        taf_cap_basis: per_execution
        cat_per_share: "0.00001"       # test value, buys and sells
        charge: { time: "20:00 America/New_York", rounding: { scale: 2, mode: ceiling } }
      crypto:
        maker_bps: "15"
        taker_bps: "25"
        asset_fee_rounding: { scale: 9, mode: half_up }
        usd_fee_rounding: { scale: 2, mode: half_up }
        charge: { time: "00:00 UTC" }
    backtest:
      decision_latency_ms: 0
      approval_latency_ms: 0
      slippage: { half_spread_bps: "1", impact_model: fixed, impact_bps: "2" }
      volume_cap: { fraction: "0.10", reference: previous_bar_same_session, first_bar: median_same_minute_20_sessions }
      fill_price_tick_rounding: none
    gate:
      data_profile: sip
      price_floor: "5.00"
      liquidity_floor_usd: "1000000"
      collar: { liquid_threshold_usd: "50000000", liquid_x: "0.01", other_x: "0.02", crypto_x: "0.02", passive_band: "0.20" }
      opposite_fill_interval_s: 60
      order_to_fill: { max: "10", min_orders: 20 }
      unexplained_403_threshold: 3
      crypto_stop_limit_offset: "0.005"       # the mandate fraction (mandate spec §3)
      stop_watchdog_s: 60
      close_window_minutes: 10
      protective_replace_buffer_trading_days: 2
      bracket_partial_fill_timeout_s: 60
      max_unprotected_s: 60
      exit_ladder:
        step_s: 5
        liquid: { offset: "0.005", step: "0.005", max: "0.03" }
        other: { offset: "0.01", step: "0.01", max: "0.05" }
        crypto: { offset: "0.01", step: "0.01", max: "0.05" }
      legacy_pdt_equity_threshold: "25000.00"
    accounting:
      basis_reduction: { scale: 12, mode: half_even }
      mark_adjustment: { scale: 12, mode: half_even }
  no_fees:
    extends: test_default
    fees:
      equities: { sec_rate: "0", taf_per_share: "0", cat_per_share: "0" }

calendars:
  us_2026:
    valid_from: "2026-09-01"
    valid_to: "2026-12-31"
    rule: weekdays not listed as holidays are trading days
    trading_holidays: ["2026-11-26", "2026-12-25"]
    early_closes: ["2026-11-27", "2026-12-24"]
    settlement_holidays: ["2026-10-12", "2026-11-11"]   # NYSE open, no settlement

reason_codes:
  # account and agent
  - account_restricted
  - account_trading_blocked
  - crypto_account_inactive
  - agent_exits_only
  - agent_paused
  - agent_stopped
  # eligibility and concentration
  - not_in_universe
  - ineligible_exchange
  - ipo_not_tradable
  - below_price_floor
  - below_liquidity_floor
  - leveraged_etp_not_enabled
  - concentration_limit
  - max_order_size          # mandate spec §5.3
  - reentry_cooldown        # mandate spec §5.3
  # session and halts
  - session_not_allowed
  - extended_hours_opening_not_allowed
  - auction_window
  - instrument_halted
  # order constraints
  - would_cross_zero
  - sell_exceeds_available
  - working_order_limit
  - add_blocked_by_protective_order
  - unknown_order_in_flight
  - market_order_not_allowed
  # marks and conduct
  - stale_mark
  - price_outside_collar
  - min_resting_time
  - opposite_fill_interval
  - conduct_limit_breached
  - order_rate_limited
  - max_orders_per_day      # mandate spec §5.3 (deny; no mode change)
  - close_window            # deny for openings, defer for discretionary exits
  - discretionary_exit_regular_session_only   # defer
  # exposure and buying power
  - gross_exposure_limit
  - insufficient_buying_power
  - insufficient_settled_buying_power
  # day trading
  - legacy_pdt_day_trade_budget
  # deployment
  - instrument_claimed

cases:

  - id: RC-01
    title: Buy, partial sell, fee accrual and daily charge, equity, settlement, conservation
    scope: [accounting]
    broker_profile: alpaca
    config: test_default
    calendar: us_2026
    instruments:
      AAPL: { asset_class: us_equity, exchange: NASDAQ, fractionable: true }
    initial:
      account: { cash: { settled: "10000.00" } }
    steps:
      - at: "2026-09-21T10:00:00-04:00"
        event: fill
        data: { instrument: AAPL, side: buy, qty_gross: "10", price: "150.00" }
        expect:
          cash: { settled: "8500.00", total: "8500.00" }
          fees: { accrued: "0.0001" }
      - at: "2026-09-21T11:00:00-04:00"
        event: fill
        data: { instrument: AAPL, side: sell, qty_gross: "4", price: "160.00" }
        expect:
          positions: { AAPL: { qty: "6", cost_basis: "900.00", avg_cost: "150.00" } }
          realized_pnl_gross: "40.00"
          cash: { settled: "8500.00", unsettled: [{ settles_on: "2026-09-22", amount: "640.00" }] }
          fees: { accrued: "0.02014" }
      - at: "2026-09-21T15:59:00-04:00"
        event: mark
        data: { instrument: AAPL, price: "155.00", source: quote }
        expect: { unrealized_pnl: "30.00", equity: "10069.97986" }
      - at: "2026-09-21T20:00:00-04:00"
        event: fees_charged
        data: { family: equities, trade_date: "2026-09-21" }
        expect:
          fees: { accrued: "0", charged: "0.03", total_usd: "0.03" }
          cash: { settled: "8499.97", total: "9139.97" }
          equity: "10069.97"
      - at: "2026-09-22T00:00:00-04:00"
        event: advance_clock
        expect:
          cash: { settled: "9139.97", unsettled: [], total: "9139.97" }
          realized_pnl_net: "39.97"
          conservation: { delta_equity: "69.97", realized_gross: "40.00", unrealized: "30.00", fees: "0.03" }

  - id: RC-02
    title: Averaging in; reducing keeps average cost; daily fee total
    scope: [accounting]
    broker_profile: alpaca
    config: test_default
    calendar: us_2026
    instruments:
      MSFT: { asset_class: us_equity, exchange: NASDAQ }
    initial:
      account: { cash: { settled: "100000.00" } }
    steps:
      - at: "2026-09-21T10:00:00-04:00"
        event: fill
        data: { instrument: MSFT, side: buy, qty_gross: "10", price: "100.00" }
      - at: "2026-09-21T10:30:00-04:00"
        event: fill
        data: { instrument: MSFT, side: buy, qty_gross: "10", price: "110.00" }
        expect: { positions: { MSFT: { qty: "20", cost_basis: "2100.00", avg_cost: "105.00" } } }
      - at: "2026-09-21T11:00:00-04:00"
        event: fill
        data: { instrument: MSFT, side: sell, qty_gross: "5", price: "120.00" }
        expect:
          positions: { MSFT: { qty: "15", cost_basis: "1575.00", avg_cost: "105.00" } }
          realized_pnl_gross: "75.00"
          fees: { accrued: "0.01925" }
      - at: "2026-09-21T20:00:00-04:00"
        event: fees_charged
        data: { family: equities, trade_date: "2026-09-21" }
        expect: { fees: { charged: "0.02" }, cash: { total: "98499.98" } }

  - id: RC-03
    title: Flip in fills (accounting); the gate rejects a zero-crossing order
    scope: [accounting, gate]
    broker_profile: generic
    config: no_fees
    calendar: us_2026
    instruments:
      XYZ: { asset_class: us_equity, exchange: NYSE }
    initial:
      account: { type: margin, cash: { settled: "100000.00" } }
    steps:
      - { at: "2026-09-21T10:00:00-04:00", event: fill, data: { instrument: XYZ, side: buy, qty_gross: "5", price: "50.00" } }
      - at: "2026-09-21T11:00:00-04:00"
        event: fill
        data: { instrument: XYZ, side: sell, qty_gross: "5", price: "55.00" }
        expect: { positions: { XYZ: { qty: "0", cost_basis: "0" } }, realized_pnl_gross: "25.00" }
      - at: "2026-09-21T11:00:01-04:00"
        event: fill
        data: { instrument: XYZ, side: sell, qty_gross: "3", price: "55.00" }
        expect: { positions: { XYZ: { qty: "-3", cost_basis: "-165.00", avg_cost: "55.00" } } }
      - at: "2026-09-21T14:00:00-04:00"
        event: fill
        data: { instrument: XYZ, side: buy, qty_gross: "3", price: "52.00" }
        expect: { positions: { XYZ: { qty: "0", cost_basis: "0" } }, realized_pnl_gross: "34.00" }
    variants:
      - name: gate_rejects_zero_crossing_order
        overrides:
          broker_profile: alpaca
          initial: { positions: [{ instrument: XYZ, qty: "5", cost_basis: "250.00" }] }
          steps:
            - at: "2026-09-22T10:00:00-04:00"
              event: propose_order
              data: { instrument: XYZ, side: sell, type: limit, qty: "8", limit_price: "55.00", purpose: risk_exit }
              expect: { decision: { verdict: deny, reason_code: would_cross_zero } }

  - id: RC-04
    title: Forward split 4-for-1 - OCO cancel, mark adjustment, broker-posting gate, protection re-derived
    scope: [accounting, executor, reconciliation]
    broker_profile: alpaca
    config: no_fees
    calendar: us_2026
    instruments:
      ABC: { asset_class: us_equity, exchange: NYSE, fractionable: true }
    initial:
      account: { cash: { settled: "0.00" } }
      positions: [{ instrument: ABC, qty: "10", cost_basis: "4000.00" }]
      open_orders:
        - name: oco_1
          instrument: ABC
          type: oco
          tif: gtc
          purpose: protective
          legs:
            - { side: sell, type: limit, limit_price: "440.00", qty: "10" }
            - { side: sell, type: stop, stop_price: "380.00", qty: "10" }
    steps:
      - at: "2026-09-21T16:00:00-04:00"
        event: mark
        data: { instrument: ABC, price: "400.00", source: official_close }
        expect: { equity: "4000.00" }
      - at: "2026-09-21T19:45:00-04:00"
        event: corporate_action_prepare
        data: { instrument: ABC, type: split, ex_date: "2026-09-22" }
        expect:
          actions: [{ cancel: oco_1 }, { await_cancel_confirmed: oco_1 }]
          orders: { oco_1: { state: Canceled } }
      - at: "2026-09-21T20:00:00-04:00"
        event: corporate_action_applied
        data: { instrument: ABC, type: split, ratio: { new: 4, old: 1 }, ex_date: "2026-09-22" }
        expect:
          positions: { ABC: { qty: "40", cost_basis: "4000.00", avg_cost: "100.00" } }
          marks: { ABC: "100.00" }
          equity: "4000.00"
          realized_pnl_gross: "0.00"
          actions: []                           # no protection until the broker posts the split
      - at: "2026-09-21T20:05:00-04:00"
        event: reconciliation
        data: { broker_positions: { ABC: "10" } }
        expect: { reconciliation: { status: pending_corporate_action }, agent_mode: normal }
      - at: "2026-09-22T07:00:00-04:00"
        event: broker_position_update
        data: { broker_positions: { ABC: "40" } }
        expect:
          reconciliation: { status: ok }
          actions:
            - submit_protective: { type: oco, tif: gtc, qty: "40", take_profit: "110.00", stop: "95.00" }
      - at: "2026-09-22T09:31:00-04:00"
        event: mark
        data: { instrument: ABC, price: "100.00", source: quote }
        expect: { equity: "4000.00", unrealized_pnl: "0.00" }

  - id: RC-05
    title: Reverse split 1-for-10 with cash in lieu and adjusted mark (non-fractionable)
    scope: [accounting]
    broker_profile: alpaca
    config: no_fees
    calendar: us_2026
    instruments:
      LOW: { asset_class: us_equity, exchange: NASDAQ, fractionable: false }
    initial:
      account: { cash: { settled: "0.00" } }
      positions: [{ instrument: LOW, qty: "25", cost_basis: "50.00" }]
    steps:
      - at: "2026-09-21T16:00:00-04:00"
        event: mark
        data: { instrument: LOW, price: "2.00", source: official_close }
        expect: { equity: "50.00" }
      - at: "2026-09-21T20:00:00-04:00"
        event: corporate_action_applied
        data: { instrument: LOW, type: split, ratio: { new: 1, old: 10 }, ex_date: "2026-09-22", cash_in_lieu_price_per_new_share: "19.00" }
        expect:
          positions: { LOW: { qty: "2", cost_basis: "40.00", avg_cost: "20.00" } }
          marks: { LOW: "20.00" }
          receivables: "9.50"
          realized_pnl_gross: "-0.50"
          equity: "49.50"
      - at: "2026-09-24T09:00:00-04:00"
        event: broker_cash_posting
        data: { type: cash_in_lieu, instrument: LOW, amount: "9.50" }
        expect: { receivables: "0.00", cash: { settled: "9.50" }, equity: "49.50" }

  - id: RC-06
    title: Cash dividend - equity unchanged across the ex-date; DividendPaid on the pay date
    scope: [accounting]
    broker_profile: alpaca
    config: no_fees
    calendar: us_2026
    instruments:
      DIV: { asset_class: us_equity, exchange: NYSE }
    initial:
      account: { cash: { settled: "5000.00" } }
      positions: [{ instrument: DIV, qty: "100", cost_basis: "5000.00" }]
    steps:
      - at: "2026-09-21T16:00:00-04:00"
        event: mark
        data: { instrument: DIV, price: "50.00", source: official_close }
        expect: { equity: "10000.00" }
      - at: "2026-09-21T20:00:00-04:00"
        event: corporate_action_applied
        data: { instrument: DIV, type: cash_dividend, amount_per_share: "0.25", ex_date: "2026-09-22", pay_date: "2026-10-01" }
        expect: { receivables: "25.00", income: "25.00", realized_pnl_gross: "0.00" }
      - at: "2026-09-22T09:31:00-04:00"
        event: mark
        data: { instrument: DIV, price: "49.75", source: quote }
        expect: { equity: "10000.00", unrealized_pnl: "-25.00" }
      - at: "2026-10-01T00:00:00-04:00"
        event: advance_clock                  # emits DividendPaid
        expect: { receivables: "0.00", cash: { settled: "5025.00" }, equity: "10000.00" }
    variants:
      - name: protective_orders_kept_through_dividend
        overrides:
          initial:
            open_orders:
              - name: oco_1
                instrument: DIV
                type: oco
                tif: gtc
                purpose: protective
                legs:
                  - { side: sell, type: limit, limit_price: "60.00", qty: "100" }
                  - { side: sell, type: stop, stop_price: "45.00", qty: "100" }
          steps:
            - at: "2026-09-21T19:45:00-04:00"
              event: corporate_action_prepare
              data: { instrument: DIV, type: cash_dividend, ex_date: "2026-09-22" }
              expect: { actions: [], orders: { oco_1: { state: Accepted } } }
      - name: short_position_generic_broker
        overrides:
          broker_profile: generic
          initial:
            account: { type: margin, cash: { settled: "15000.00" } }
            positions: [{ instrument: DIV, qty: "-100", cost_basis: "-5000.00" }]
        expect_overrides:
          step_1: { equity: "10000.00" }
          step_2: { receivables: "-25.00", income: "-25.00" }
          step_3: { equity: "10000.00", unrealized_pnl: "25.00" }
          step_4: { receivables: "0.00", cash: { settled: "14975.00" }, equity: "10000.00" }

  - id: RC-07
    title: Crypto fees in the received asset; unposted-fee reconciliation
    scope: [accounting, reconciliation]
    broker_profile: alpaca
    config: test_default
    calendar: us_2026
    instruments:
      BTCUSD: { asset_class: crypto, symbol: "BTC/USD", min_trade_increment: "0.000000001" }
    initial:
      account: { cash: { settled: "100000.00" } }
    steps:
      - at: "2026-09-21T10:00:00-04:00"
        event: fill
        data: { instrument: BTCUSD, side: buy, qty_gross: "0.5", price: "60000.00", liquidity: taker }
        expect:
          positions: { BTCUSD: { qty: "0.49875", cost_basis: "29925.00", avg_cost: "60000.00" } }
          fees: { accrued: "0", total_usd: "75.00" }
          cash: { settled: "70000.00" }
          reconciliation: { broker_qty_before_fee_posting: "0.5", tolerance_qty: "0.00125", status: ok }
      - at: "2026-09-21T14:00:00-04:00"
        event: fill
        data: { instrument: BTCUSD, side: sell, qty_gross: "0.49875", price: "62000.00", liquidity: taker }
        expect:
          positions: { BTCUSD: { qty: "0" } }
          realized_pnl_gross: "997.50"
          fees: { accrued: "77.31", total_usd: "152.31" }
          cash: { settled: "100922.50" }
          equity: "100845.19"
      - at: "2026-09-22T00:00:00Z"
        event: fees_charged
        data: { family: crypto, day: "2026-09-21" }
        expect:
          fees: { accrued: "0" }
          cash: { settled: "100845.19" }
          equity: "100845.19"
          conservation: { delta_equity: "845.19", realized_gross: "997.50", fees: "152.31" }

  - id: RC-08
    title: Cash-account settlement and buying power (generic broker; Alpaca has no cash accounts)
    scope: [gate, accounting]
    broker_profile: generic
    config: test_default
    calendar: us_2026
    instruments:
      XYZ: { asset_class: us_equity, exchange: NYSE }
      QQQ: { asset_class: us_equity, exchange: NASDAQ, fractionable: true }
    initial:
      account: { type: cash, cash: { settled: "1000.00" } }
    steps:
      - at: "2026-09-21T14:00:00-04:00"
        event: fill
        data: { instrument: XYZ, side: buy, qty_gross: "5", price: "100.00" }
        expect: { cash: { settled: "500.00" }, buying_power: "499.99" }
      - at: "2026-09-21T15:00:00-04:00"
        event: fill
