# Reference cases for docs/specs/trading-domain.md (spec v0.2)
#
# Schema v2
# - Decimals are strings and compare by decimal value (not string form).
# - Keys absent from an `expect` block are not checked.
# - Expected values are cumulative since the start of the case unless under `delta`.
# - Steps are processed in list order; the list index is the event sequence number.
# - Fee rates in `configs` are TEST VALUES ONLY, not current regulatory rates.
# - Changing or adding a case requires founder approval.
# - Variants: `overrides.steps` replaces the case's steps entirely; all other override keys are
#   merged into the case (JSON merge patch). `expect_overrides.step_N` (1-based) merges into the
#   expectation of step N.
# - Gate cases assume a fresh, sane quote whose midpoint equals the order's limit price (so the
#   price collar and mark-freshness checks pass), unless the case supplies quotes.
#
# Expectation vocabulary
#   positions.<instrument>: {qty, cost_basis, avg_cost}
#   cash: {settled, unsettled: [{settles_on, amount}], total}
#   receivables, fees: {accrued, charged, total_usd}, realized_pnl_gross, income,
#   unrealized_pnl, equity, buying_power
#   decision: {verdict: allow|deny, reason_code}
#   orders.<name>: {state, ...}
#   actions: ordered list of executor actions
#   agent_mode: normal | exits_only | paused
#   trade_date, settles_on, day_trade_count, fills: [{bar, qty, price}]

schema_version: 2

configs:
  test_default:
    fees:
      effective_from: "2026-01-01"
      equities:
        sec_rate: "0.00003"            # test value, fraction of sale proceeds
        taf_per_share: "0.0002"        # test value
        taf_cap_per_order: "9.79"      # test value
        cat_per_share: "0.00001"       # test value, buys and sells
        accrual: per_fill_full_precision
        charge: account_day_total
        charge_rounding: { scale: 2, mode: ceiling }
      crypto:
        maker_bps: "15"
        taker_bps: "25"
        asset_fee_rounding: { scale: 9, mode: half_up }
        usd_fee_rounding: { scale: 2, mode: half_up }
    backtest:
      decision_latency_ms: 0
      approval_latency_ms: 0
      slippage: { half_spread_bps: "1", impact_model: fixed, impact_bps: "2" }
      volume_cap: { fraction: "0.10", reference: previous_bar }
      fill_price_tick_rounding: none
    gate:
      price_floor: "5.00"
      min_median_dollar_volume_20d: "1000000"
      mark_staleness_ms: 2000
      fee_reservation: accrued_rounded_up
      legacy_pdt_equity_threshold: "25000.00"
    accounting:
      basis_reduction: { scale: 12, mode: half_even }
  no_fees:
    extends: test_default
    fees:
      equities: { sec_rate: "0", taf_per_share: "0", cat_per_share: "0" }

calendars:
  us_2026:
    trading_holidays: ["2026-11-26"]
    early_closes: ["2026-11-27"]
    settlement_holidays: ["2026-10-12", "2026-11-11"]   # bank holidays: NYSE open, no settlement

reason_codes:
  - insufficient_buying_power
  - insufficient_settled_buying_power
  - would_cross_zero
  - legacy_pdt_day_trade_budget
  - add_blocked_by_protective_order
  - account_restricted
  - account_trading_blocked
  - ineligible_exchange
  - below_price_floor
  - below_liquidity_floor
  - leveraged_etp_not_enabled
  - ipo_not_tradable
  - not_in_universe
  - instrument_claimed
  - market_order_not_allowed
  - session_not_allowed
  - instrument_halted
  - stale_mark
  - price_outside_collar
  - order_rate_limited
  - conduct_limit_breached
  - concentration_limit

cases:

  - id: RC-01
    title: Buy, partial sell, fee accrual and daily charge, marks, equity, settlement, conservation
    scope: [accounting]
    broker_profile: alpaca
    config: test_default
    calendar: us_2026
    instruments:
      AAPL: { asset_class: us_equity, exchange: NASDAQ, fractionable: true }
    initial:
      account: { type: margin, multiplier: 1, cash: { settled: "10000.00" } }
    steps:
      - at: "2026-09-21T10:00:00-04:00"
        event: fill
        data: { instrument: AAPL, side: buy, qty_gross: "10", price: "150.00" }
        expect:
          cash: { settled: "8500.00", total: "8500.00" }
          fees: { accrued: "0.0001" }
      - at: "2026-09-21T11:00:00-04:00"
        event: fill
        data: { instrument: AAPL, side: sell, qty_gross: "4", price: "160.00" }
        expect:
          positions: { AAPL: { qty: "6", cost_basis: "900.00", avg_cost: "150.00" } }
          realized_pnl_gross: "40.00"
          cash: { settled: "8500.00", unsettled: [{ settles_on: "2026-09-22", amount: "640.00" }] }
          fees: { accrued: "0.02014" }       # 0.0001 + 0.0192 + 0.0008 + 0.00004
      - at: "2026-09-21T15:59:00-04:00"
        event: mark
        data: { instrument: AAPL, price: "155.00", source: quote }
        expect:
          unrealized_pnl: "30.00"
          equity: "10069.97986"              # 8500 + 640 + 930 - 0.02014
      - at: "2026-09-21T20:00:00-04:00"
        event: fees_charged
        expect:
          fees: { accrued: "0", charged: "0.03", total_usd: "0.03" }   # ceiling of 0.02014
          cash: { settled: "8499.97", total: "9139.97" }
          equity: "10069.97"
      - at: "2026-09-22T00:00:00-04:00"
        event: advance_clock
        expect:
          cash: { settled: "9139.97", unsettled: [], total: "9139.97" }
          equity: "10069.97"
          conservation: { delta_equity: "69.97", realized_gross: "40.00", unrealized: "30.00", fees: "0.03" }

  - id: RC-02
    title: Averaging in; reducing keeps average cost; daily fee total
    scope: [accounting]
    broker_profile: alpaca
    config: test_default
    calendar: us_2026
    instruments:
      MSFT: { asset_class: us_equity, exchange: NASDAQ }
    initial:
