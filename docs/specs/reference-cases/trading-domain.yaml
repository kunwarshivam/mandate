      - at: "2026-09-22T09:31:00-04:00"
        event: mark
        data: { instrument: DIV, price: "49.75", source: quote }
        expect: { equity: "10000.00", unrealized_pnl: "-25.00" }
      - at: "2026-10-01T00:00:00-04:00"
        event: advance_clock
        expect: { receivables: "0.00", cash: { settled: "5025.00" }, equity: "10000.00" }
    variants:
      - name: short_position_generic_broker
        overrides:
          broker_profile: generic
          initial:
            account: { type: margin, cash: { settled: "15000.00" } }
            positions: [{ instrument: DIV, qty: "-100", cost_basis: "-5000.00" }]
        expect_overrides:
          step_1: { equity: "10000.00" }
          step_2: { receivables: "-25.00", income: "-25.00" }
          step_3: { equity: "10000.00", unrealized_pnl: "25.00" }
          step_4: { receivables: "0.00", cash: { settled: "14975.00" }, equity: "10000.00" }

  - id: RC-07
    title: Crypto fees in the received asset; unposted-fee reconciliation
    scope: [accounting, reconciliation]
    broker_profile: alpaca
    config: test_default
    calendar: us_2026
    instruments:
      BTCUSD: { asset_class: crypto, symbol: "BTC/USD", min_trade_increment: "0.000000001" }
    initial:
      account: { type: margin, multiplier: 1, crypto_status: ACTIVE, cash: { settled: "100000.00" } }
    steps:
      - at: "2026-09-21T10:00:00-04:00"
        event: fill
        data: { instrument: BTCUSD, side: buy, qty_gross: "0.5", price: "60000.00", liquidity: taker }
        expect:
          positions: { BTCUSD: { qty: "0.49875", cost_basis: "29925.00", avg_cost: "60000.00" } }
          fees: { total_usd: "75.00" }       # 0.00125 BTC valued at the fill price
          cash: { settled: "70000.00" }
          reconciliation: { broker_qty_before_fee_posting: "0.5", tolerance_qty: "0.00125", status: ok }
      - at: "2026-09-21T14:00:00-04:00"
        event: fill
        data: { instrument: BTCUSD, side: sell, qty_gross: "0.49875", price: "62000.00", liquidity: taker }
        expect:
          positions: { BTCUSD: { qty: "0" } }
          realized_pnl_gross: "997.50"
          fees: { accrued: "77.31", total_usd: "152.31" }   # 77.30625 half-up
          cash: { settled: "100922.50" }
          equity: "100845.19"
      - at: "2026-09-21T20:00:00-04:00"
        event: fees_charged
        expect:
          fees: { accrued: "0" }
          cash: { settled: "100845.19" }
          equity: "100845.19"
          conservation: { delta_equity: "845.19", realized_gross: "997.50", fees: "152.31" }

  - id: RC-08
    title: Cash-account settlement and buying power (generic broker; Alpaca has no cash accounts)
    scope: [gate, accounting]
    broker_profile: generic
    config: test_default
    calendar: us_2026
    instruments:
      XYZ: { asset_class: us_equity, exchange: NYSE }
      QQQ: { asset_class: us_equity, exchange: NASDAQ, fractionable: true }
    initial:
      account: { type: cash, cash: { settled: "1000.00" } }
    steps:
      - at: "2026-09-21T14:00:00-04:00"
        event: fill
        data: { instrument: XYZ, side: buy, qty_gross: "5", price: "100.00" }
        expect: { cash: { settled: "500.00" }, buying_power: "499.99" }   # 500 - ceil(0.00005)
      - at: "2026-09-21T15:00:00-04:00"
        event: fill
        data: { instrument: XYZ, side: sell, qty_gross: "5", price: "110.00" }
        expect:
          cash: { settled: "500.00", unsettled: [{ settles_on: "2026-09-22", amount: "550.00" }] }
          fees: { accrued: "0.0176" }
          buying_power: "499.98"
      - at: "2026-09-21T15:30:00-04:00"
        event: propose_order
        data: { instrument: QQQ, side: buy, type: limit, qty: "6", limit_price: "100.00", tif: day, purpose: open }
        expect: { decision: { verdict: deny, reason_code: insufficient_settled_buying_power } }
      - at: "2026-09-21T20:00:00-04:00"
        event: fees_charged
        expect: { fees: { charged: "0.02" }, cash: { settled: "499.98" } }
      - at: "2026-09-22T00:00:00-04:00"
        event: advance_clock
        expect: { cash: { settled: "1049.98", unsettled: [] }, buying_power: "1049.98" }

  - id: RC-09
    title: Legacy day-trade budget blocks openings; Alpaca intraday-margin variant allows
    scope: [gate]
    broker_profile: generic
    config: test_default
    calendar: us_2026
    instruments:
      AAPL: { asset_class: us_equity, exchange: NASDAQ }
      BTCUSD: { asset_class: crypto, symbol: "BTC/USD" }
    initial:
      account:
        type: margin
        regime: legacy_pdt
        last_equity: "10000.00"
        cash: { settled: "10000.00" }
        prior_day_trades:
          - { date: "2026-09-15", instrument: AAA }
          - { date: "2026-09-16", instrument: BBB }
          - { date: "2026-09-18", instrument: CCC }
    steps:
      - at: "2026-09-21T10:00:00-04:00"
        event: propose_order
        data: { instrument: AAPL, side: buy, type: limit, qty: "10", limit_price: "150.00", purpose: open }
        expect:
          day_trade_count: 3                 # window 09-15 .. 09-21
          decision: { verdict: deny, reason_code: legacy_pdt_day_trade_budget }
      - at: "2026-09-21T10:05:00-04:00"
        event: fill
        data: { instrument: BTCUSD, side: buy, qty_gross: "0.01", price: "60000.00", liquidity: taker }
      - at: "2026-09-21T14:05:00-04:00"
        event: propose_order
        data: { instrument: BTCUSD, side: sell, type: limit, qty: "0.009975", limit_price: "60000.00", purpose: close }
        expect:
          decision: { verdict: allow }       # crypto is not subject to day-trade rules
          day_trade_count: 3
    variants:
      - name: alpaca_intraday_margin
        overrides:
          broker_profile: alpaca
          initial: { account: { regime: intraday_margin, multiplier: 1 } }
        expect_overrides:
          step_1: { decision: { verdict: allow } }

  - id: RC-09B
    title: Legacy regime - exits are never denied; open same-day positions limit new openings
    scope: [gate]
    broker_profile: generic
    config: test_default
    calendar: us_2026
    instruments:
      AAPL: { asset_class: us_equity, exchange: NASDAQ }
      MSFT: { asset_class: us_equity, exchange: NASDAQ }
    initial:
      account:
        type: margin
        regime: legacy_pdt
        last_equity: "10000.00"
        cash: { settled: "10000.00" }
        prior_day_trades:
          - { date: "2026-09-16", instrument: BBB }
          - { date: "2026-09-18", instrument: CCC }
    steps:
      - at: "2026-09-21T10:00:00-04:00"
        event: propose_order
        data: { instrument: AAPL, side: buy, type: limit, qty: "10", limit_price: "150.00", purpose: open }
        expect: { day_trade_count: 2, decision: { verdict: allow } }   # budget 1 >= 1 + 0
      - at: "2026-09-21T10:01:00-04:00"
        event: fill
        data: { instrument: AAPL, side: buy, qty_gross: "10", price: "150.00" }
      - at: "2026-09-21T11:00:00-04:00"
        event: propose_order
        data: { instrument: MSFT, side: buy, type: limit, qty: "5", limit_price: "400.00", purpose: open }
        expect: { decision: { verdict: deny, reason_code: legacy_pdt_day_trade_budget } }   # budget 1 < 1 + 1
      - at: "2026-09-21T14:00:00-04:00"
        event: propose_order
        data: { instrument: AAPL, side: sell, type: limit, qty: "10", limit_price: "151.00", purpose: close }
        expect: { decision: { verdict: allow } }
      - at: "2026-09-21T14:00:05-04:00"
        event: fill
        data: { instrument: AAPL, side: sell, qty_gross: "10", price: "151.00" }
        expect: { day_trade_count: 3 }

  - id: RC-10
    title: Backtest - timing, slippage, limit through, marketable limit, volume cap
    scope: [backtest]
    broker_profile: backtest
    config: test_default
    calendar: us_2026
    instruments:
      TST: { asset_class: us_equity, exchange: NASDAQ }
    isolation: per_order                     # each order is simulated alone against the bars
    bars:                                    # 1-minute SIP bars, regular session; start timestamps
      - { start: "2026-09-21T09:40:00-04:00", open: "99.90", high: "100.20", low: "99.80", close: "100.00", volume: "5000" }
      - { start: "2026-09-21T09:41:00-04:00", open: "100.00", high: "100.50", low: "99.60", close: "100.40", volume: "8000" }
      - { start: "2026-09-21T09:42:00-04:00", open: "100.40", high: "100.60", low: "100.10", close: "100.30", volume: "6000" }
    orders:
      - name: market_sell_exit
        initial_position: { qty: "100" }
        decided_at: "2026-09-21T09:41:00-04:00"   # close of the first bar
        order: { side: sell, type: market, qty: "100", purpose: close }
        expect: { fills: [{ bar: 1, qty: "100", price: "99.97" }] }                 # 100.00 x (1 - 3 bps)
      - name: limit_sell_touch_is_not_fill
