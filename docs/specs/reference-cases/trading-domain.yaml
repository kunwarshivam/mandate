  - id: RC-14
    title: Exit sequence with protective OCO; plain add blocked; add via bracket; kill switch
    scope: [executor, gate]
    broker_profile: alpaca
    config: test_default
    calendar: us_2026
    instruments:
      AAPL: { asset_class: us_equity, exchange: NASDAQ }
    initial:
      account: { type: margin, multiplier: 1, cash: { settled: "20000.00" } }
      positions: [{ instrument: AAPL, qty: "10", cost_basis: "1500.00" }]
      open_orders:
        - name: oco_1
          instrument: AAPL
          type: oco
          tif: gtc
          purpose: protective
          legs:
            - { side: sell, type: limit, limit_price: "170.00", qty: "10" }
            - { side: sell, type: stop, stop_price: "140.00", qty: "10" }
    steps:
      - at: "2026-09-22T11:00:00-04:00"
        event: propose_order
        data: { name: exit_1, instrument: AAPL, side: sell, type: limit, qty: "10", limit_price: "155.00", purpose: close }
        expect:
          decision: { verdict: allow }
          actions:
            - { cancel: oco_1 }
            - { await_cancel_confirmed: oco_1 }
            - { journal: unprotected_window_start }
            - { rerun_gate: exit_1 }
            - { submit: exit_1 }
      - at: "2026-09-22T11:00:03-04:00"
        event: broker_order_update
        data: { name: exit_1, status: filled, fill: { qty: "10", price: "155.00" } }
        expect:
          positions: { AAPL: { qty: "0" } }
          realized_pnl_gross: "50.00"
          actions: [{ journal: unprotected_window_end }]   # position closed: nothing to re-place
    variants:
      - name: plain_add_blocked
        overrides:
          steps:
            - at: "2026-09-22T11:00:00-04:00"
              event: propose_order
              data: { instrument: AAPL, side: buy, type: limit, qty: "5", limit_price: "151.00", purpose: increase }
              expect: { decision: { verdict: deny, reason_code: add_blocked_by_protective_order } }
      - name: add_via_bracket
        overrides:
          steps:
            - at: "2026-09-22T11:00:00-04:00"
              event: propose_order
              data:
                name: bracket_2
                instrument: AAPL
                type: bracket
                entry: { side: buy, type: limit, qty: "5", limit_price: "151.00" }
                take_profit: { limit_price: "170.00" }
                stop_loss: { stop_price: "140.00" }
                purpose: increase
              expect:
                decision: { verdict: allow }
                actions: [{ submit: bracket_2 }]
                protective_sell_qty_after_entry_fill: "15"
      - name: kill_switch
        overrides:
          steps:
            - at: "2026-09-22T11:00:00-04:00"
              event: kill_switch
              data: { scope: agent }
              expect:
                actions:
                  - { cancel_all_orders: agent }
                  - { await_cancel_confirmed: all }
                  - { close_all_positions: agent }
                agent_mode: paused

