  - id: RC-12
    title: Backtest stops, gaps, stop-limit, adverse-first, extended-hours non-trigger
    scope: [backtest]
    broker_profile: backtest
    config: test_default
    calendar: us_2026
    instruments:
      TST: { asset_class: us_equity, exchange: NASDAQ }
    isolation: per_order
    orders:
      - name: stop_triggers_intrabar
        initial_position: { qty: "100" }
        order: { side: sell, type: stop, stop_price: "99.00", qty: "100", purpose: protective, resting_since_bar: 0 }
        bars:
          - { start: "2026-09-21T10:00:00-04:00", open: "99.60", high: "99.80", low: "99.40", close: "99.50", volume: "9000" }
          - { start: "2026-09-21T10:01:00-04:00", open: "99.50", high: "99.60", low: "98.80", close: "98.90", volume: "9000" }
        expect: { fills: [{ bar: 1, qty: "100", price: "98.9703" }] }    # 99.00 x (1 - 3 bps)
      - name: stop_gap_through
        initial_position: { qty: "100" }
        order: { side: sell, type: stop, stop_price: "99.00", qty: "100", purpose: protective, resting_since_bar: 0 }
        bars:
          - { start: "2026-09-21T10:00:00-04:00", open: "99.60", high: "99.80", low: "99.40", close: "99.50", volume: "9000" }
          - { start: "2026-09-21T10:01:00-04:00", open: "98.50", high: "98.90", low: "98.20", close: "98.60", volume: "9000" }
        expect: { fills: [{ bar: 1, qty: "100", price: "98.47045" }] }   # open 98.50 x (1 - 3 bps)
      - name: stop_limit_gap_rests_as_limit
        initial_position: { qty: "100" }
        order: { side: sell, type: stop_limit, stop_price: "99.00", limit_price: "98.80", qty: "100", purpose: protective, resting_since_bar: 0 }
        bars:
          - { start: "2026-09-21T10:00:00-04:00", open: "99.60", high: "99.80", low: "99.40", close: "99.50", volume: "9000" }
          - { start: "2026-09-21T10:01:00-04:00", open: "98.50", high: "98.70", low: "98.20", close: "98.60", volume: "9000" }
          - { start: "2026-09-21T10:02:00-04:00", open: "98.60", high: "98.90", low: "98.40", close: "98.85", volume: "9000" }
        expect: { fills: [{ bar: 2, qty: "100", price: "98.80" }] }      # bar 1 gaps below the limit: no fill
      - name: adverse_first_oco
        initial_position: { qty: "100" }
        order:
          type: oco
          legs:
            - { side: sell, type: limit, limit_price: "101.00", qty: "100" }
            - { side: sell, type: stop, stop_price: "99.00", qty: "100" }
          resting_since_bar: 0
        bars:
          - { start: "2026-09-21T10:00:00-04:00", open: "100.00", high: "100.20", low: "99.80", close: "100.00", volume: "9000" }
          - { start: "2026-09-21T10:01:00-04:00", open: "100.00", high: "101.50", low: "98.70", close: "100.00", volume: "9000" }
        expect:
          fills: [{ bar: 1, leg: stop, qty: "100", price: "98.9703" }]
          canceled_legs: [limit]
      - name: resting_limit_gap_through_fills_at_open
        order: { side: buy, type: limit, limit_price: "99.00", qty: "100", purpose: open, resting_since_bar: 0 }
        bars:
          - { start: "2026-09-21T10:00:00-04:00", open: "99.40", high: "99.60", low: "99.10", close: "99.30", volume: "9000" }
          - { start: "2026-09-21T10:01:00-04:00", open: "98.50", high: "98.80", low: "98.40", close: "98.70", volume: "9000" }
        expect: { fills: [{ bar: 1, qty: "100", price: "98.50" }] }
      - name: stop_not_triggered_in_extended_hours
        initial_position: { qty: "100" }
        order: { side: sell, type: stop, stop_price: "99.00", qty: "100", purpose: protective, resting_since_bar: 0 }
        bars:
          - { start: "2026-09-21T09:00:00-04:00", open: "99.50", high: "99.60", low: "98.00", close: "99.30", volume: "2000", session: pre_market }
          - { start: "2026-09-21T09:30:00-04:00", open: "99.20", high: "99.50", low: "99.10", close: "99.40", volume: "9000", session: regular }
        expect: { fills: [] }

