# Reference cases for docs/specs/mandate.md (spec Draft v0.2)
#
# Generated by a reference implementation; every expected value is computed, not typed.
#
# HARNESS RULES
# Values
# - Decimals are strings and compare by decimal value. Timestamps use the journal form
#   (journal spec 4.7). `drawdown`, `daily_pnl_fraction`, `target_value`, `delta`, and agent return
#   are reported rounded half-even to 12 places (spec 5.2); combined conviction and combined score
#   are rounded to 12 places before use (spec 8.3).
# - `base` names a mandate in `bases`; `patch` is an RFC 6902 JSON Patch applied to it first.
# Kinds
# - schema: validate against schemas/mandate.schema.json (JSON Schema 2020-12).
# - semantic: `context` overrides `validation_context_defaults`. `provenance` maps a JSON Pointer
#   to {source, confirmed}; absent paths are {user_entered, confirmed: true}. Expect the sorted
#   V-codes and W-codes.
# - policy: `policies` are listed outermost first; keys are policy keys (spec 4.3). Each violation
#   reports the key, the violating level and value, and the nearest ancestor whose value it breaks.
# - risk_state: one agent, one instrument, zero fees. E = allocation + realized P&L +
#   qty x (risk mark - avg cost). The case starts at `initial.at` with E = H = E0 = allocation and
#   mode normal. Each step's `expect` is the state after the step; `journal` lists the
#   account-stream events it emits, in order; `pending` lists limits awaiting confirmation.
#   `mark.sane: false` means the quote failed the trading spec 8.2 checks.
# - risk_day: the risk day containing `at` and its bounds (spec 5.4).
# - gate: only the mandate limits of spec 5.3 are evaluated, in trading spec 9.1 order; every other
#   gate check passes. `positions_mv` uses risk marks. `computed` is informative.
# - builder: the order builder (spec 8.3) followed by the gate dry-run and autonomy. Autonomy
#   inputs not supplied default to: session regular, drawdown 0, daily_pnl_fraction 0,
#   position_pnl_fraction 0, bought_today_usd 0, first_trade_in_instrument = (position_qty = 0).
# - autonomy: evaluate spec 6.2 for the given action.
# - agent_flatten: the agent-scoped kill-switch plan (trading spec 5.5).
# - goal: goal completion (spec 3.1) for the given state.
# - change: classify `base` against the patched mandate (spec 9.2).

