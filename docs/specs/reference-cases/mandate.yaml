        max_orders_per_day: 50
        max_daily_loss: '0.02'
        daily_loss_action: exits_only
        max_drawdown: '0.08'
        drawdown_ladder:
        - {at: '0.03', action: scale_sizes, factor: '0.5'}
        - {at: '0.06', action: exits_only, factor: null}
        - {at: '0.08', action: flatten_and_pause, factor: null}
        hysteresis: '0.01'
        scale_action: limit_buys
        breach_confirm_s: 60
        daily_breach_min_s: 3600
        scale_lift_after_s: 600
        reentry_cooldown_s: 3600
      autonomy:
        rules:
        - id: large_orders
          when: {field: order_usd, op: gt, value: '900'}
          then: ask
        - id: low_score
          when: {field: combined_score, op: lt, value: '0.65'}
          then: ask
        - id: routine
          when:
            field: purpose
            op: in
            value: [increase, open]
          then: auto
        default: ask
        approval:
          timeout_s: 600
          on_timeout: skip
          approvers: ['role:approver']
          two_approver_above_usd: null
      notifications:
        channels: [email, web_push]
        quiet_hours: {start: '23:00', end: '07:00', timezone: America/New_York}
