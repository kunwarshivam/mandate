# Reference cases for docs/specs/mandate.md (spec v0.1)
#
# Generated by a reference implementation; every expected value is computed, not typed.
#
# HARNESS RULES
# - Decimals are strings and compare by decimal value. Ratios (drawdown, daily_pnl_fraction,
#   combined_conviction, combined_confidence, target_value) are rounded half-even to 12 places.
# - `base` names a mandate in `bases`; `patch` is an RFC 6902 JSON Patch applied to it before the
#   case runs (`-` appends to an array).
# - `schema` cases: validate against schemas/mandate.schema.json (JSON Schema 2020-12).
# - `semantic` cases: the patched mandate is schema-valid; `context` supplies the account and
#   workspace facts the V-rules need; `provenance` values: user_confirmed, platform_default,
#   compiler_inferred_unconfirmed (absent paths are user_confirmed). Expect the full sorted set of
#   violated codes.
# - `policy` cases: `policies` are listed outermost first, as maps from JSON Pointer to value. Each
#   violation reports the path, the level that violates, its value, and the nearest level whose
#   limit it violates (spec §4.2). A level's own policy is checked against every level above it.
# - `risk_state` cases: one agent, one instrument, zero fees. Agent equity
#   E = allocation + position_qty x (bid - avg_cost). Steps run in order; each step's `expect` is the
#   state after the step, including the journal events it emits, in order. The case starts with
#   E = H = E0 = allocation and mode `normal`. Journal events are account-stream events (spec §5.5).
# - `gate` cases: only the mandate limits of spec §5.2 are evaluated, in trading spec §9.1 order
#   (concentration, order size, orders per day, gross exposure); every other gate check passes.
#   `positions_mv` uses risk marks. `computed` is informative.
# - `decider` cases: trust weights are the midpoint of each advisor's bounds; a signal is fresh
#   when as_of <= now < expires_at. Openings are priced at the ask; exits at the bid. Autonomy
#   inputs not listed default to: session regular, drawdown 0, daily_pnl_fraction 0.
# - `change` cases: the classification compares `base` with the patched mandate (spec §9).

