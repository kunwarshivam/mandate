- id: MC-R01
  kind: risk_state
  title: 'Drawdown ladder: scale, hysteresis boundary, exits_only, flatten_and_pause'
  base: two_stock_swing
  patch:
  - {op: replace, path: /risk/max_position_usd, value: '10000'}
  - {op: replace, path: /risk/max_position_fraction, value: '1'}
  - {op: replace, path: /risk/max_gross_exposure_usd, value: '10000'}
  - {op: replace, path: /risk/breach_confirm_s, value: 0}
  - {op: replace, path: /risk/scale_lift_after_s, value: 0}
  - {op: replace, path: /risk/daily_breach_min_s, value: 0}
  - {op: replace, path: /risk/max_daily_loss, value: '0.5'}
  initial: {position_qty: '100', avg_cost: '100', asset_class: us_equity, at: '2026-09-21T14:00:00.000000000Z'}
  steps:
  - event: mark
    at: '2026-09-21T14:01:00.000000000Z'
    bid: '105'
    session: regular
    sane: true
    expect:
      agent_equity: '10500'
      high_water_mark: '10500'
      drawdown: '0'
      day_start_equity: '10000'
      daily_pnl: '500'
      daily_pnl_fraction: '0.05'
      contributed_capital: '10000'
      size_factor: '1'
      restrictions: []
      agent_mode: normal
      pending: []
      journal: []
  - event: mark
    at: '2026-09-21T14:02:00.000000000Z'
    bid: '101.85'
    session: regular
    sane: true
    expect:
      agent_equity: '10185'
      high_water_mark: '10500'
      drawdown: '0.03'
      day_start_equity: '10000'
      daily_pnl: '185'
      daily_pnl_fraction: '0.0185'
      contributed_capital: '10000'
      size_factor: '0.5'
      restrictions: []
      agent_mode: normal
      pending: []
      journal:
      - {type: RiskLimitTriggered, limit: 'drawdown_ladder[0]', action: scale_sizes}
  - event: mark
    at: '2026-09-21T14:03:00.000000000Z'
    bid: '101'
    session: regular
    sane: true
    expect:
      agent_equity: '10100'
      high_water_mark: '10500'
      drawdown: '0.038095238095'
      day_start_equity: '10000'
      daily_pnl: '100'
      daily_pnl_fraction: '0.01'
      contributed_capital: '10000'
      size_factor: '0.5'
      restrictions: []
      agent_mode: normal
      pending: []
      journal: []
  - event: mark
    at: '2026-09-21T14:04:00.000000000Z'
    bid: '102'
    session: regular
    sane: true
    expect:
      agent_equity: '10200'
      high_water_mark: '10500'
