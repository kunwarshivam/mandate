[files]
# reference/ is frozen; fixtures and lockfiles are generated.
extend-exclude = ["reference/", "fixtures/", "Cargo.lock", "python/uv.lock", "web/package-lock.json", "web/node_modules/"]

[default]
extend-ignore-re = [
    "[0-9a-f]{16,}",                # hashes
    "\\\\x[0-9A-Fa-f]{2}",          # escaped bytes in test vectors
    "B[A-Za-z0-9_-]{86}",           # base64url uncompressed P-256 keys in RFC test vectors
]

[default.extend-words]
marginable = "marginable"           # Alpaca's term (non_marginable_buying_power)
caf = "caf"                         # "café" split by an escaped byte in journal vectors
fpr = "fpr"                         # gpg --with-colons record type (fingerprint), deploy/
xdescribe = "xdescribe"             # Vitest's skipped-describe alias, refused by web/scripts/pending.mjs (DEC-750)
xit = "xit"                         # Vitest's skipped-test alias, refused by web/scripts/pending.mjs (DEC-750)
xtest = "xtest"                     # Vitest's skipped-test alias, refused by web/scripts/pending.mjs (DEC-750)
cose = "cose"                       # CBOR Object Signing and Encryption (RFC 9052), WebAuthn's key format
