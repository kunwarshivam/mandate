# Which workspace packages each reference suite is the external oracle for (DEC-497).
#
# `cargo xtask ci mutants` mutates a crate and runs that crate's own tests. Several crates' oracles
# are not there: they are reference-case suites in this package, which the mutated crate does not
# depend on, so nothing discovers them. This table is how the gate finds them. A mutation run that
# mutates a package named here also runs the suites that name it, and only those.
#
# Every `tests/<name>.rs` must have an entry and every entry must name an existing suite and
# workspace packages this package depends on; `cargo xtask oracles` fails otherwise, so a new suite
# cannot join without saying what it judges.
#
# An entry is a claim that the suite can fail on a change to that package. Under-naming a package
# is how a missed mutant hides, so name a package whenever the suite reaches it, even indirectly;
# the cost of naming one more is the suite's own run time per mutant, and `refcases`, the case
# runner, names every package the corpus exercises.

[suites]
agent_stream = ["mandate-journal"]
asset_id = ["mandate-domain", "mandate-journal"]
control_stream = ["mandate-canon", "mandate-journal", "mandate-spec", "mandate-time"]
harness = ["mandate-accounting", "mandate-num", "mandate-risk", "mandate-sim", "mandate-time"]
mandate_escalation_harness = ["mandate-approval", "mandate-num", "mandate-runtime", "mandate-time"]
mandate_gate_harness = ["mandate-num", "mandate-risk", "mandate-time"]
mandate_harness = ["mandate-builder", "mandate-canon", "mandate-num", "mandate-spec"]
mandate_lifecycle_harness = ["mandate-approval", "mandate-journal", "mandate-num", "mandate-runtime", "mandate-time"]
production_config_refs = ["mandate-canon", "mandate-journal", "mandate-time"]
refcases = [
    "mandate-accounting",
    "mandate-approval",
    "mandate-builder",
    "mandate-canon",
    "mandate-domain",
    "mandate-executor",
    "mandate-journal",
    "mandate-num",
    "mandate-research",
    "mandate-risk",
    "mandate-runtime",
    "mandate-spec",
    "mandate-sim",
    "mandate-time",
]
risk_state = ["mandate-canon", "mandate-journal", "mandate-spec", "mandate-time"]
trading_domain_gate_harness = ["mandate-num", "mandate-risk", "mandate-time"]
