[package]
name = "mandate-marketdata"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Alpaca historical market data: the data-host client, exact vendor-number parsing, and idempotent Parquet datasets (backlog E2-1, ADR-0001 ES-23), and their inspection (E2-2)"

[lints]
workspace = true

[features]
# Builds `tests/live.rs`, which calls the Alpaca market-data host with the paper credentials. CI
# never enables it (ADR-0001 ES-19), so a run without it has no live test to report as passed.
live-alpaca = []

[[test]]
name = "live"
required-features = ["live-alpaca"]

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
mandate-canon.workspace = true
mandate-num.workspace = true
mandate-time.workspace = true
parquet.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
