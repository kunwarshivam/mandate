[package]
name = "mandate-marketdata"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Alpaca historical market data: the data-host client, exact vendor-number parsing, and idempotent Parquet datasets (backlog E2-1, ADR-0001 ES-23)"

[lints]
workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
mandate-canon.workspace = true
mandate-time.workspace = true
parquet.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
