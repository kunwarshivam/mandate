mandate-gateway.workspace = true
mandate-journal.workspace = true
mandate-num.workspace = true
mandate-ports.workspace = true
mandate-process.workspace = true
mandate-research.workspace = true
mandate-research-driver.workspace = true
mandate-research-run.workspace = true
mandate-risk.workspace = true
mandate-runtime.workspace = true
mandate-spec.workspace = true
mandate-store.workspace = true
mandate-time.workspace = true
tokio = { workspace = true, features = ["rt", "signal"] }

[dev-dependencies]
mandate-accounting.workspace = true
mandate-journal-pg.workspace = true
proptest.workspace = true
serde_json.workspace = true
