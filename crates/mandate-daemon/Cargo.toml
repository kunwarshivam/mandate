[package]
name = "mandate-daemon"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The agent runtime as a long-running process: journal tailing with the kill switch read first, a wake hint that never decides an outcome, one writer epoch, and mandate-process's lifecycle (E21-30, DEC-1012)"

