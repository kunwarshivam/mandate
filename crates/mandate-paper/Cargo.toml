mandate-num.workspace = true
mandate-runtime.workspace = true
mandate-shell.workspace = true
mandate-spec.workspace = true
mandate-time.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
mandate-marketdata.workspace = true
proptest.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "time"] }
