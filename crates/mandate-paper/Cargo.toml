[package]
name = "mandate-paper"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The paper adapter: the confirmed deployment, the GET-only preflight, the model host's output and its stored closes, through the production cycle (E7-19 slice 5, the first paper trade brief's E1a)"

[lints]
workspace = true

[features]
live = []
# The rehearsal against the simulator (DEC-922, DEC-937 item 2): the Robinhood login dials only
# the loopback endpoint `MANDATE_RH_SIM_ENDPOINT` names. Nothing turns it on but an explicit flag.
rh-sim = []

[dependencies]
mandate-accounting.workspace = true
mandate-alpaca.workspace = true
mandate-artifacts-fs.workspace = true
mandate-bars.workspace = true
mandate-canon.workspace = true
mandate-connections.workspace = true
mandate-domain.workspace = true
mandate-journal.workspace = true
mandate-journal-pg.workspace = true
mandate-mcp.workspace = true
mandate-modelhost.workspace = true
mandate-num.workspace = true
mandate-robinhood.workspace = true
mandate-runtime.workspace = true
mandate-shell.workspace = true
mandate-spec.workspace = true
mandate-time.workspace = true
rustix.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
mandate-executor.workspace = true
mandate-marketdata.workspace = true
mandate-rh-sim.workspace = true
proptest.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "time"] }
