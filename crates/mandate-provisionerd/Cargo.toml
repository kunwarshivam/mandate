[package]
name = "mandate-provisionerd"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The role provisioner's process: mandate-provisioner over the Postgres control stream and the vault, logged in by AppRole, with mandate-process's lifecycle and probes (E21-33, DEC-2350)"

[lints]
workspace = true

[dependencies]
mandate-canon.workspace = true
mandate-connections.workspace = true
mandate-deploy-manager.workspace = true
mandate-deployd.workspace = true
mandate-journal.workspace = true
mandate-journal-pg.workspace = true
mandate-process.workspace = true
mandate-provisioner.workspace = true
mandate-time.workspace = true
mandate-vault.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros"] }
