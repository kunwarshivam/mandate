[package]
name = "mandate-dispatcher"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The notification dispatcher: turns committed causes into sends through the channel adapters (backlog E8-10; web push and the relay, E8-14)"

[lints]
workspace = true

[dependencies]
mandate-canon.workspace = true
mandate-journal.workspace = true
mandate-journal-pg.workspace = true
mandate-notify.workspace = true
mandate-push-relay.workspace = true
mandate-time.workspace = true
mandate-webpush.workspace = true
ring.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
base64ct.workspace = true
proptest.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
