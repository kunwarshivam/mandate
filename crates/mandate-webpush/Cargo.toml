[package]
name = "mandate-webpush"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Web push for opaque notices: RFC 8291 message encryption, RFC 8292 VAPID, and the request parts per class (backlog E8-14, slice S8a)"

[lints]
workspace = true

[dependencies]
aes-gcm.workspace = true
base64ct.workspace = true
hkdf.workspace = true
p256 = { workspace = true, features = ["ecdh"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
p256 = { workspace = true, features = ["ecdh", "ecdsa"] }
proptest.workspace = true
