[package]
name = "mandate-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Model Context Protocol client a broker connector uses inside itself: the streamable HTTP transport to one pinned host (backlog E7-16, connections spec §6.2)"

[lints]
workspace = true

# The rehearsal build (DEC-922 items 1 and 2): the only build in which an endpoint may be plain
# `http`, and then only to a loopback address; every endpoint it dials is on loopback. Only
# `mandate-rh-sim`'s own `rh-sim` feature turns it on; the `live` build never does.
[features]
rh-sim = []

[dependencies]
getrandom.workspace = true
mandate-canon.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
