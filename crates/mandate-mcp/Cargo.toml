[package]
name = "mandate-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Model Context Protocol client a broker connector uses inside itself: the streamable HTTP transport to one pinned host (backlog E7-16, connections spec §6.2)"

[lints]
workspace = true

[dependencies]
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
