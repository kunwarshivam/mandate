mandate-connections.workspace = true
mandate-domain.workspace = true
mandate-executor.workspace = true
mandate-gate-context.workspace = true
mandate-gate-inputs.workspace = true
mandate-journal.workspace = true
mandate-num.workspace = true
mandate-ports.workspace = true
mandate-process.workspace = true
mandate-risk.workspace = true
mandate-spec.workspace = true
mandate-store.workspace = true
mandate-time.workspace = true
mandate-vault.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "time"] }

[dev-dependencies]
mandate-marketdata.workspace = true
mandate-journal-pg.workspace = true
proptest.workspace = true
serde_json.workspace = true
