[package]
name = "mandate-executord"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The account executor as a long-running process: one writer epoch on the account stream, the journal as the only channel from the runtime, the kill switch handed first, and mandate-process's lifecycle (E21-30, DEC-2003)"

