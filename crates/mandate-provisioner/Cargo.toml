[package]
name = "mandate-provisioner"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The role provisioner: makes each OAuth connect's Kubernetes-auth roles, removes the token exchange's when its request closes or its connection is revoked, and journals each outcome on the control stream (E21-33, DEC-2350)"

[lints]
workspace = true

[dependencies]
mandate-canon.workspace = true
mandate-connections.workspace = true
mandate-deploy-manager.workspace = true
mandate-journal.workspace = true
mandate-time.workspace = true
mandate-vault.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros"] }
