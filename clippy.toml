# ADR-0001 ES-05, ES-21: core code never reads a clock or iterates hash maps.
# Shell crates that legitimately need these allow the lint at the call site with a reason.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "time arrives as an input; use the injected WallClock (ES-05)" },
    { path = "std::time::Instant::now", reason = "time arrives as an input; use the injected WallClock (ES-05)" },
    # ADR-0001 ES-08, OPS-13, E21-50: only `mandate db migrate` migrates the journal schema, as its own
    # deploy step; no process migrates at start. The command allows it at its one call site.
    { path = "mandate_journal_pg::migrate::migrate", reason = "only `mandate db migrate` applies migrations, never a process at start (ES-08, OPS-13)" },
    { path = "mandate_journal_pg::migrate::migrate_dsn", reason = "only `mandate db migrate` applies migrations, never a process at start (ES-08, OPS-13)" },
    { path = "mandate_journal_pg::migrate::migrate_known", reason = "only `mandate db migrate` applies migrations, never a process at start (ES-08, OPS-13)" },
    { path = "sqlx::migrate::Migrator::run", reason = "the journal's one ledger is `mandate db migrate`'s; no sqlx migrator runs beside it (E21-50)" },
    { path = "sqlx::migrate::Migrator::run_direct", reason = "the journal's one ledger is `mandate db migrate`'s; no sqlx migrator runs beside it (E21-50)" },
    # DEC-2378 item 11 condition 3, DEC-2388: only the cell's runtime's advisory dry run may defer a
    # check. The executor's binding gate, and every other caller, calls `evaluate` and defers none.
    # The one allowed call of each is `mandate-ports`'s wrapper and `mandate-daemon`'s dry run.
    { path = "mandate_risk::evaluate_deferring", reason = "only the advisory dry run defers checks; the binding gate calls `mandate_risk::evaluate` (DEC-2378 item 11)" },
    { path = "mandate_ports::evaluate_deferring", reason = "only the cell's runtime's advisory dry run defers checks; the binding gate calls `mandate_risk::evaluate` (DEC-2378 item 11)" },
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order breaks replay; use BTreeMap (ES-21)" },
    { path = "std::collections::HashSet", reason = "iteration order breaks replay; use BTreeSet (ES-21)" },
]
