# The vetted-source allowlist (DEC-101, E17-7, data-plane spec §4.1, DEC-1130), version 2. Versioned
# configuration: a change is a new file `allowlist-v<N+1>.toml` whose `version` is N+1, and this
# file is never edited after it reaches main. E17-7 holds its contents (E2-19).
#
# Version 2 (DEC-2394): the founder confirmed Alpaca news on 2026-10-26, answering DEC-1130 item 2,
# which made that confirmation his (DEC-79: legal). Counsel has not separately confirmed its terms
# on keeping cited items; DEC-433 item 20's retention question stays open. It must be read
# read-only with a paper key, each item journaled before use (wiring follows, DEC-2394), and
# research may read it; it gives opinions only, never orders. Its text stays licensed, so readers
# withhold it until the founder and counsel decide inference spec §13 question 6 (DEC-1130 item 6).
#
# A source is on the allowlist only while `counsel_confirmed` is true: DEC-433 item 20 allowlists
# only sources whose terms allow keeping what a thesis cited, as counsel confirms per vendor. An
# unconfirmed entry is listed so its endpoints are reviewed, but nothing fetches from it and no
# reader returns its items (DEC-1130 item 2). Flipping it is the founder's (DEC-79: legal).
#
# Each endpoint is an `https://` host and a path prefix; a fetch to any other URL is refused before
# a byte is sent (DP-9, DEC-433 item 11).

version = 2

[[source]]
id = "sec.edgar"
kind = "filings"
licensed = false
counsel_confirmed = true
# The SEC's fair-access rules: at most 10 requests a second, with a declared user agent.
min_interval_ms = 125
max_response_bytes = 8388608
endpoints = [
  "https://data.sec.gov/submissions/",
  "https://www.sec.gov/Archives/edgar/data/",
]

[[source]]
id = "alpaca.news"
kind = "news"
licensed = true
# Confirmed by the founder, DEC-2394 (DEC-1130 item 2).
counsel_confirmed = true
min_interval_ms = 300
max_response_bytes = 1048576
endpoints = ["https://data.alpaca.markets/v1beta1/news"]
