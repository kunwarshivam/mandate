# ADR-0001 ES-14. Changes to this file are founder-owned (CODEOWNERS).

[graph]
all-features = true
# The platforms we build (ES-17) and develop on; wasm32-only crates are out of scope (DEC-88).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# MPL-2.0 only as named per-crate exceptions, used unmodified.
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl-sys", reason = "rustls only (ES-14)" },
    { crate = "native-tls", reason = "rustls only (ES-14)" },
    { crate = "serde_yaml", reason = "deprecated; reference cases are exported to JSON (ES-11)" },
    { crate = "serde_yml", reason = "reference cases are exported to JSON (ES-11)" },
]

[[bans.features]]
crate = "serde_json"
deny = ["arbitrary_precision"]
reason = "changes number handling for every crate in the build; read vendor numbers as raw text (ES-23)"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
