# Python workspace (ADR-0001 ES-10). The frozen reference implementation in reference/mandate/ is
# not part of this workspace; it runs in its own pinned environment.

[tool.uv.workspace]
members = ["mandate_tools", "research_spike"]

[tool.uv]
# cel-python (deploy/tests' CEL evaluation, DEC-1177) asks for PyYAML 6.0.2 or later, which only
# adds wheels over 6.0.1; the workspace keeps the reference's 6.0.1 (mandate_tools).
override-dependencies = ["pyyaml==6.0.1"]

[tool.uv.sources]
mandate-tools = { workspace = true }
research-spike = { workspace = true }

[dependency-groups]
dev = [
    "mandate-tools",
    "research-spike",
    "cel-python==0.5.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mandate_tools", "research_spike"]

[tool.pytest.ini_options]
testpaths = ["mandate_tools/tests", "research_spike/tests", "../deploy/tests"]
addopts = "--strict-markers"
